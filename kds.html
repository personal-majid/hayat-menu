<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>Hayat Kitchen Screen</title>
<script src="config.js" onerror="window.CONFIG=window.CONFIG||null"></script>
<script src="nav.js" onerror="0"></script>
<script src="hayat-auth.js"></script>
<script src="hayat-clean.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#121518;--card:#1B1F23;--ink:#F1EFEA;--muted:#9AA2AA;--line:#2E343A;--good:#5FB38A;--warn:#E3B04B;--bad:#E0584A;--accent:#8DB8D3;--par:#A6A4D8}
:root[data-theme="light"]{--bg:#F5F4EF;--card:#FFFFFF;--ink:#1F2328;--muted:#5F6770;--line:#DDDAD2;--good:#2E7D5B;--warn:#A8812F;--bad:#C2362C;--accent:#2F5A74;--par:#5B5A8C}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.35 "Jost",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
header h1{margin:0;font:700 22px "Jost",sans-serif} header .sp{flex:1}
.pill{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px;color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--good);border-color:var(--good)} .pill.bad{color:var(--bad);border-color:var(--bad);font-weight:600}
.clock{font:700 22px "Jost",sans-serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
.hb{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:15px}
.tabs{display:flex;gap:6px} .tabs button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 14px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
main{padding:12px 14px 40px}
.cbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 14px 0;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--bad) 18%,var(--card));border:2px solid var(--bad);font-size:17px;font-weight:600;animation:pulse 1.4s ease-in-out infinite}
.cbar span{background:var(--card);border-radius:8px;padding:3px 10px;font-weight:500}
.cbar[hidden]{display:none}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));align-items:start}
.tk{background:var(--card);border:2px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.tk .hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.tk .tb{font:700 24px "Jost",sans-serif} .tk .tb small{font:500 14px "Jost",sans-serif;color:var(--muted);margin-left:6px}
.tk .age{font:700 26px "Jost",sans-serif;font-variant-numeric:tabular-nums}
.tk.g{border-color:var(--good)} .tk.g .age{color:var(--good)} .tk.a{border-color:var(--warn)} .tk.a .age{color:var(--warn)}
.tk.r{border-color:var(--bad);animation:pulse 1.2s ease-in-out infinite} .tk.r .age{color:var(--bad)}
.tk.cx{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))} .tk.cx .it li{text-decoration:line-through} .tag.cx{background:var(--bad);color:#fff}
#popk{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:50;background:var(--good);color:#fff;border-radius:16px;padding:14px 26px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 10px 40px rgba(0,0,0,.4);cursor:pointer;max-width:92vw} #popk[hidden]{display:none} #popk.cx{background:var(--bad)} #popk b{font:800 28px Jost,sans-serif} #popk span{font:700 22px Jost,sans-serif} #popk small{font-size:15px;opacity:.95}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--bad) 25%,transparent)}} @media (prefers-reduced-motion:reduce){ .tk.r{animation:none} }
.tags{display:flex;gap:6px;flex-wrap:wrap;padding:6px 12px 0} .tag{font-size:13px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--line)}
.tag.par{background:color-mix(in srgb,var(--par) 30%,transparent);color:var(--ink)} .tag.add{background:color-mix(in srgb,var(--warn) 30%,transparent)}
.it{list-style:none;margin:0;padding:8px 12px 10px;display:grid;gap:4px}
.it li{font-size:20px;font-weight:600;display:flex;gap:10px;align-items:baseline;cursor:pointer;user-select:none}
.it li .q{min-width:34px;text-align:right;color:var(--accent)} .it li.x{text-decoration:line-through;opacity:.45}
.it li small{font-size:13px;font-weight:500;color:var(--muted)}
.ft{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;margin-top:auto}
.done{border:0;background:var(--good);color:#fff;border-radius:10px;padding:12px 18px;font:700 18px "Jost",sans-serif}
.st{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:11px 12px;font:700 16px "Jost",sans-serif} .st.go{background:#c27c12;border-color:#c27c12;color:#fff}
.tmr b{font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.tk .tno{font:800 34px "Jost",sans-serif;letter-spacing:-.5px} .tk .sec{font:600 14px "Jost",sans-serif;color:var(--muted);margin-left:8px}
.tk .who{padding:4px 12px 0;font-size:15px;font-weight:600;color:var(--ink)}
.knote{margin:8px 12px 0;padding:8px 10px;border-radius:8px;background:#fff3c4;color:#5a4300;font-weight:700;font-size:16px}
.tag.ur{background:#c0392b;color:#fff} .tag.hl{background:#555;color:#fff} .tag.tr{background:repeating-linear-gradient(135deg,#e3a94e 0 8px,#f6e9d2 8px 16px);color:#3a2a00;font-weight:800}
.tk.hold{opacity:.55;border-style:dashed} .tk.urg{border-color:#c0392b;box-shadow:0 0 0 2px #c0392b} .tk.trial{border-style:dashed}
.empty{color:var(--muted);font-size:20px;text-align:center;padding:60px 0}
.msg{max-width:640px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;font-size:17px}
.msg a{color:var(--accent)}
.recent{margin-top:18px;color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.recent button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;font-size:14px}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;max-width:420px}
dialog label{display:flex;gap:10px;align-items:center;font-size:17px;padding:6px 0}
.inote{display:block;margin-top:3px;font-style:normal;font-weight:900;font-size:.92em;color:#7a3d00;background:#ffe9b8;border-radius:6px;padding:2px 7px;width:fit-content;max-width:100%} .knote.onote{background:#e8f1ff;color:#123}
</style></head><body>
<header>
  <h1>🍳 <span id="stName">Kitchen</span></h1>
  <div class="tabs" id="stTabs"></div>
  <span class="sp"></span>
  <span class="pill" id="count">–</span>
  <span class="pill" id="feed">connecting…</span>
  <span class="clock" id="clk"></span>
  <button class="hb" id="snd" title="Sound on new orders">🔇</button>
  <button class="hb" id="cfg" title="Which stations this screen shows">⚙</button>
  <button class="hb" id="thm" title="Light / dark">◐</button>
  <button class="hb" id="fs" title="Full screen">⤢</button>
</header>
<div class="cbar" id="cbar" hidden></div>
<main id="main"><div class="empty">Loading…</div></main>
<dialog id="dlg"><form method="dialog"><h3 style="margin-top:0">Stations on this screen</h3><div id="dlgBody"></div><p style="text-align:right;margin-bottom:0"><button class="hb" value="ok">Done</button></p></form></dialog>
<script>
/* Hayat kitchen screen. Reads the counter + captain bills (orders, and trial_orders when
   settings/captain.kdsTrial is on) plus VMENU's vm_open (only while the old VMENU sync runs),
   shows only what this kitchen makes, one card per KOT round. Accept / Start go to kds_state,
   "Ready" to kds, so the waiter's phone and the office see it. Sign in with a kitchen, captain or office code. */
const $=id=>document.getElementById(id);
const PREP={mandi:4,grill:10,fish:12,gravy:15,meals:3,bread:6.5,juice:5,tea:3,shawaya:8,fridge:0};
const KNAME={mandi:'Mandi',grill:'Alfaham',fish:'Fish fry',gravy:'Gravy & Chinese',meals:'Meals',bread:'Porotta & chapati',juice:'Juice',tea:'Tea',shawaya:'Shawaya'};
const SCREENS={mandi:{n:'Mandi kitchen',st:['mandi','grill','bread']},main:{n:'Main kitchen',st:['meals']},juice:{n:'Juice Hut block',st:['juice','tea','shawaya','fish','gravy']}};
const SEC={'AC':'AC','NON AC':'Non-AC','HUT':'Hut','JUICY HUT':'Juice Hut','PARCEL':'Parcel'};
let ST=JSON.parse(localStorage.getItem('kds-cfg')||'null')||{screen:new URLSearchParams(location.search).get('k')||'mandi',custom:{},sound:false,theme:'dark'};
const q=new URLSearchParams(location.search).get('k'); if(q&&SCREENS[q]) ST.screen=q;
const save=()=>{ try{ localStorage.setItem('kds-cfg',JSON.stringify(ST)); }catch(e){} };
const stations=()=>ST.custom[ST.screen]||SCREENS[ST.screen].st;
document.documentElement.dataset.theme=ST.theme==='light'?'light':'dark';

function station(n){ n=String(n||'').toUpperCase();
  if(/PARCEL|PAPER PLATE|PAPER GLASS|BILL ZERO/.test(n)) return [];
  if(/MAYONNAISE/.test(n)) return ['mandi'];
  if(/MANDI|ALFAHAM|ALFHAM|ALFAM|MASALAFAHAM/.test(n)){ if(/KING FISH/.test(n)) return ['mandi','fish']; if(/SHAWAYA/.test(n)) return ['mandi','shawaya'];
    const s=[]; if(/MANDI/.test(n)) s.push('mandi'); if(/ALFAHAM|ALFHAM|ALFAM|MASALAFAHAM/.test(n)) s.push('grill'); return s; }
  if(/SHAWAYA|SHAWARMA/.test(n)) return ['shawaya'];
  if(/POROTTA|CHAPATI|RUMALI|KUBOOS/.test(n)) return ['bread'];
  if(/MEALS|BIRIYANI|THOSAI|OMELETTE/.test(n)) return ['meals'];
  if(/AILA|KING FISH|PRAWNS|MANDAL|POMFRET|FISH/.test(n)) return ['fish'];
  if(/BUTTER CHICKEN|KADAI CHICKEN|PANEER|KORMA|PEPPER CHICKEN|HYDERABADI|MUSHROOM MASALA|VEG CURRY|VEG KADAI/.test(n)) return ['meals'];
  if(/FRIED RICE|NOODLE|NOODEL|CHILLI(?! SODA)|MANCHURIAN|CHICKEN 65|GARLIC|DRAGON|LOLLIPOP|KONDATTAM|BROAST|BEEF|SOUP|GHEE|FRENCH|SALAD(?! WITH)/.test(n)) return ['gravy'];
  if(/JUICE|MOJITO|LIME|AVILMILK|SHAKE|SCOOP|SCOTCH|FRUIT SALAD|TENDER|CHICCKU/.test(n)) return ['juice'];
  if(/TEA|COFFE|MILK|BOOST/.test(n)) return ['tea'];
  return null; }   /* null = no rule knows it ([] = never a kitchen item) */
/* never drop a dish: no rule -> the line's own kitchen (captain/counter station) if it names a station or a screen, else the Main kitchen.
   captain.js kdsStation / kdsSt / KDS_SCREENS is a COPY of this mapping (waiter's "n of m ready") - keep the two identical */
const BOTTLED=/7 ?UP|SPRITE|PEPSI|COCA|COCO ?COLA|COKE|\bSLICE\b|MIRINDA|FANTA|THUMS ?UP|LIMCA|MAAZA|FROOTI|\bDEW\b|RED ?BULL|\bSTING\b|BISLERI|KINLEY|AQUAFINA|MINERAL|MENIRAL|WATER BOTTLE|BOTTLE WATER|\bCAN\b|\bPET\b|\d+ ?ML\b|\d ?LTR\b/i;   /* = captain.js DR_SOFT: bottles need no kitchen */
function kdsSt(n,st){ const s=station(n); if(s) return s; if(BOTTLED.test(n)) return []; st=String(st||'').toLowerCase();
  if(Object.prototype.hasOwnProperty.call(KNAME,st)) return [st]; if(Object.prototype.hasOwnProperty.call(SCREENS,st)) return [SCREENS[st].st[0]]; return [SCREENS.main.st[0]]; }
function tms(v){ if(!v) return null; if(typeof v==='number') return v; if(typeof v==='object'){ if(v.toMillis) return v.toMillis(); if(v.seconds!=null) return v.seconds*1000; }
  let s=String(v); if(!/[zZ]|[+-]\d\d:?\d\d$/.test(s)) s+='+05:30'; const t=Date.parse(s); return isNaN(t)?null:t; }
/* a new ticket says so across the whole screen for a few seconds */
let POPT=null; function pop(k){ const b=document.getElementById('popk')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'popk'})); const o=k.o, where=o.type==='Parcel'?'#'+(o.token||o.kot||''):'Table '+(o.table||'');
  b.className=k.cancel?'cx':''; b.innerHTML='<b>'+(k.cancel?'✕ CANCEL':'NEW KOT')+'</b><span>'+where+'</span><small>'+k.items.map(i=>i.q+'× '+i.n).slice(0,4).join(' · ')+'</small>'; b.hidden=false; clearTimeout(POPT); POPT=setTimeout(()=>{ b.hidden=true; },6000); b.onclick=()=>{ b.hidden=true; }; }
const hm=ms=>new Date(ms+5.5*3600e3).toISOString().slice(11,16);

let TRIAL=[], KDSTRIAL=false, KST={}, WEB=[], OPEN=[], DONE={}, META=null, FB=null, seen=new Set(), first=true, strike=new Set(JSON.parse(sessionStorage.getItem('kds-x')||'[]'));
/* the web counter: each KOT round, and each CANCEL ticket, as its own card */
const kesc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));   /* web/captain orders carry typed notes: never raw HTML */
function webOpen(){ const out=[], now=Date.now();
  /* captain-app TRIAL orders show only when Setup → Settings → "Show trial orders on the kitchen screen" is on */
  for(const o of WEB.concat(KDSTRIAL?TRIAL:[])){ if(!o.kots||!o.kots.length||(o.noKds&&!o.trial)) continue;
    const gone=o.status==='cancelled'||(o.status==='delivered'&&(o.mode==='delivery'||o.type==='delivery'||o.type==='pickup'));   /* a PAID bill keeps its uncooked tickets (counter bills are paid before cooking); only cancelled / handed-over orders clear */
    const items=[]; o.kots.forEach(k=>{ if(gone&&!(k.kind==='cancel'&&now-(k.at||0)<45*60000)) return; (k.lines||[]).forEach(l=>{ if(l.station==='none') return;   /* bottled drinks: the waiter brings them */
      if(k.skip&&k.skip.includes(l.station)) return;   /* kitchens the waiter switched off for this KOT (kot.skip = captain station keys) */
      const lb=l.note&&l.base!=null?l.base:l.label;   /* new captain lines: base = size, note = the cook's note (old lines: note inside label) */
      items.push({n:kesc(l.name+(lb?' ('+lb+')':'')),st:l.station||'',nt:kesc(l.note||''),q:+l.q||0,t:k.at,cancel:k.kind==='cancel',reason:kesc(k.reason||''),round:k.n,note:kesc(k.note||''),hold:!!(k.hold&&!k.fireAt),fire:k.fireAt||0,pri:k.pri||''}); }); });
    if(!items.length) continue;
    out.push({invoiceId:'w'+kesc(o.id),orderAt:o.at,items,table:kesc(o.table||''),section:o.mode==='dinein'?kesc(o.section||''):'',type:o.mode==='dinein'?'':'Parcel',token:kesc(o.token||''),taker:kesc(String(o.by||'').replace(/^SIM · /,'')),pax:o.pax||0,trial:!!o.trial,web:true,src:o.source||'',onote:kesc(o.note||'')}); }
  return out; }
function tickets(){ const mine=new Set(stations()), out=[];
  for(const o of OPEN.concat(webOpen())){ const base=tms(o.orderAt), groups={};
    for(const it of o.items||[]){ const st=kdsSt(it.n,it.st).filter(s=>mine.has(s)); if(!st.length) continue;
      const t=tms(it.t)||base; const k=String(Math.round((t||0)/60000))+(o.web&&it.round!=null&&!it.cancel?'r'+it.round:'')+(it.cancel?'c':'');   /* web/captain: one card per KOT round, even two rounds in the same minute */ (groups[k]=groups[k]||{t,items:[],st:new Set(),cancel:!!it.cancel,reason:it.reason||'',round:it.round,note:it.note||'',hold:!!it.hold,fire:it.fire||0,pri:it.pri||''}).items.push(it); st.forEach(s=>groups[k].st.add(s)); }
    const ks=Object.keys(groups).sort(); ks.forEach((k,idx)=>{ const g=groups[k], id=ST.screen+'_'+o.invoiceId+'_'+k;
      const mg={}; g.items.forEach(it=>{ const n=String(it.n).trim(), nt=it.nt||'', key=n+'|'+nt; (mg[key]=mg[key]||{n,nt,q:0}).q+=(+it.q||1); }); g.items=Object.values(mg);   /* "less spicy" stays its own line */
      if(DONE[id]) return; out.push({id,inv:o.invoiceId,round:k,addon:!g.cancel&&(idx>0||(g.t&&base&&g.t-base>60000)),t:g.t,items:g.items,st:[...g.st],o,cancel:g.cancel,reason:g.reason,kotN:g.round,note:g.note,hold:g.hold,fire:g.fire,pri:g.pri}); }); }
  /* urgent first, held KOTs last, then oldest first */
  return out.sort((a,b)=>((b.pri==='urgent')-(a.pri==='urgent'))||((a.hold?1:0)-(b.hold?1:0))||((a.t||0)-(b.t||0))); }
function render(){ const now=Date.now(), T=tickets();
  $('stName').textContent=SCREENS[ST.screen].n; $('count').textContent=T.length+' open';
  $('stTabs').innerHTML=Object.keys(SCREENS).map(k=>'<button aria-pressed="'+(k===ST.screen)+'" data-k="'+k+'">'+SCREENS[k].n+'</button>').join('');
  $('stTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{ ST.screen=b.dataset.k; save(); seen=new Set(); first=true; render(); });
  if(!T.length){ $('main').innerHTML='<div class="empty">No orders for '+SCREENS[ST.screen].n+' right now ✓</div>'+recentHtml(); bindRecent(); return; }
  let fresh=0;
  $('main').innerHTML='<div class="grid">'+T.map(k=>{ const age=k.t?Math.max(0,(now-k.t)/60000):0, prep=Math.max(...k.st.map(s=>PREP[s]||5)), c=age<prep?'g':age<prep+5?'a':'r', o=k.o;
      if(!seen.has(k.id)){ seen.add(k.id); if(!first){ fresh++; pop(k); } }
      const par=o.type==='Parcel', where=par?'🛍️ #'+(o.token||o.kot||''):(o.table?'<b class="tno">'+o.table+'</b>':'')+'<small class="sec">'+(SEC[o.section]||o.section||'')+'</small>';
      const ks=KST[k.id]||{}, held=k.hold&&!k.cancel;
      return '<div class="tk '+(k.cancel?'cx':held?'hold':c)+(k.pri==='urgent'?' urg':'')+(o.trial?' trial':'')+'"><div class="hd"><span class="tb">'+where+'</span><span class="age">'+Math.floor(age)+'′</span></div>'
        +'<div class="who">'+(o.taker?'👤 '+o.taker:'')+(o.pax?' · 👥 '+o.pax:'')+'</div>'
        +'<div class="tags">'+(o.trial?'<span class="tag tr">TRIAL · practice</span>':'')+(k.pri==='urgent'?'<span class="tag ur">⚡ URGENT</span>':k.pri==='norush'?'<span class="tag">🐢 no rush</span>':'')+(held?'<span class="tag hl">⏸ HOLD · wait for fire</span>':'')+(k.fire&&!held?'<span class="tag ur">🔥 FIRE NOW</span>':'')+(k.cancel?'<span class="tag cx">✕ CANCEL'+(k.reason?' · '+k.reason:'')+'</span>':'')+(par?'<span class="tag par">Parcel · pack it</span>':'')+(k.addon?'<span class="tag add">+ Add-on</span>':'')+'<span class="tag">KOT'+(k.kotN&&!k.cancel?' #'+k.kotN:'')+' '+(k.t?hm(k.t):'')+'</span>'+(o.web&&!o.src.match(/captain|sim/)?'<span class="tag">counter</span>':'')+'</div>'
        +(o.onote?'<div class="knote onote">📌 '+o.onote+'</div>':'')+(k.note?'<div class="knote">📝 '+k.note+'</div>':'')
        +'<ul class="it">'+k.items.map((it,i)=>{ const x=strike.has(k.id+'#'+i); return '<li class="'+(x?'x':'')+'" data-s="'+k.id+'#'+i+'"><span class="q">'+(it.q||1)+'×</span><span>'+it.n+(it.nt?'<em class="inote">📝 '+it.nt+'</em>':'')+'</span></li>'; }).join('')+'</ul>'
        +'<div class="ft">'+(held?'<span>waiting for the waiter to fire</span>':ks.prepAt?'<span class="tmr">🔥 cooking <b>'+mmss(now-ks.prepAt)+'</b> / '+Math.round(prep)+' min</span>':ks.acceptAt?'<span class="tmr">👍 in queue <b>'+mmss(now-ks.acceptAt)+'</b></span><button class="st go" data-st="prep" data-id="'+k.id+'" data-inv="'+k.inv+'" data-r="'+k.round+'">🔥 Start</button>':'<span>target '+Math.round(prep)+' min</span><button class="st" data-st="acc" data-id="'+k.id+'" data-inv="'+k.inv+'" data-r="'+k.round+'">👍 Accept</button><button class="st go" data-st="prep" data-id="'+k.id+'" data-inv="'+k.inv+'" data-r="'+k.round+'">🔥 Start</button>')
        +(held?'':'<button class="done" data-id="'+k.id+'" data-inv="'+k.inv+'" data-r="'+k.round+'">✓ Ready</button>')+'</div></div>'; }).join('')+'</div>'+recentHtml();
  $('main').querySelectorAll('li[data-s]').forEach(li=>li.onclick=()=>{ const s=li.dataset.s; strike.has(s)?strike.delete(s):strike.add(s); sessionStorage.setItem('kds-x',JSON.stringify([...strike])); li.classList.toggle('x'); });
  $('main').querySelectorAll('.done').forEach(b=>b.onclick=()=>bump(b.dataset.id,b.dataset.inv,b.dataset.r));
  $('main').querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>kstate(b.dataset.id,b.dataset.inv,b.dataset.r,b.dataset.st));
  bindRecent(); if(fresh&&ST.sound) beep(); first=false; }
let RECENT=[];
const mmss=ms=>{ const s=Math.max(0,Math.round(ms/1000)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
/* accept (seen, in the queue) and start (cooking, own timer) - the waiter's phone shows both */
async function kstate(id,inv,round,st){ const k=tickets().find(x=>x.id===id), now=Date.now(), cur=KST[id]||{};
  const v=Object.assign({},cur,{screen:ST.screen,inv:Number(inv)||inv,round,at:(k&&k.t)||now,table:k?(k.o.table||null):null}); if(st==='acc') v.acceptAt=now; if(st==='prep'){ v.prepAt=now; if(!v.acceptAt) v.acceptAt=now; }
  KST[id]=v; render(); try{ await FB.fs.setDoc(FB.fs.doc(FB.db,'kds_state',id),v); }catch(e){ alert('Could not save: '+(e.code||e.message)); } }
setInterval(()=>{ if(document.querySelector('.tmr')) render(); },15000);
function recentHtml(){ return RECENT.length?'<div class="recent">Done just now: '+RECENT.slice(-5).reverse().map(r=>'<button data-u="'+r.id+'">↩ '+r.lab+'</button>').join('')+'</div>':''; }
function bindRecent(){ document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>unbump(b.dataset.u)); }
async function bump(id,inv,round){ const k=tickets().find(x=>x.id===id); DONE[id]={local:true}; RECENT.push({id,lab:k?(k.o.type==='Parcel'?'Parcel #'+(k.o.token||''):(SEC[k.o.section]||'')+' '+(k.o.table||'')):id}); render();
  try{ await FB.fs.setDoc(FB.fs.doc(FB.db,'kds',id),{screen:ST.screen,inv:Number(inv)||inv,round,doneAt:FB.fs.serverTimestamp(),kotAt:k&&k.t?new Date(k.t):null,items:k?k.items.map(i=>i.n):[],table:k?(k.o.table||null):null,section:k?(k.o.section||null):null,parcel:k?k.o.type==='Parcel':false}); }
  catch(e){ delete DONE[id]; RECENT=RECENT.filter(r=>r.id!==id); render(); alert('Could not save: '+(e.code||e.message)); } }
async function unbump(id){ delete DONE[id]; RECENT=RECENT.filter(r=>r.id!==id); render(); try{ await FB.fs.deleteDoc(FB.fs.doc(FB.db,'kds',id)); }catch(e){} }
let AC=null; function beep(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); [0,0.18].forEach(d=>{ const o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=880; o.connect(g); g.connect(AC.destination); g.gain.setValueAtTime(0.25,AC.currentTime+d); g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d+0.15); o.start(AC.currentTime+d); o.stop(AC.currentTime+d+0.16); }); }catch(e){} }
function feed(){ const f=$('feed'); if(!META){ f.className='pill bad'; f.textContent='no data from the shop PC yet'; return; }
  const last=Math.max(tms(META.openAt)||0,tms(META.lastRunAt)||0), m=(Date.now()-last)/60000;
  if(m>3){ f.className='pill bad'; f.textContent='⚠ orders '+Math.round(m)+' min old: is the shop PC on?'; } else { f.className='pill ok'; f.textContent='● live'; } }
setInterval(()=>{ $('clk').textContent=hm(Date.now()); feed(); if(FB) render(); },15000); $('clk').textContent=hm(Date.now());
$('snd').textContent=ST.sound?'🔔':'🔇'; $('snd').onclick=()=>{ ST.sound=!ST.sound; save(); $('snd').textContent=ST.sound?'🔔':'🔇'; if(ST.sound) beep(); };
$('thm').onclick=()=>{ ST.theme=ST.theme==='light'?'dark':'light'; save(); document.documentElement.dataset.theme=ST.theme; };
$('fs').onclick=()=>{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{}); };
$('cfg').onclick=()=>{ const mine=new Set(stations()); $('dlgBody').innerHTML=Object.keys(KNAME).map(k=>'<label><input type="checkbox" value="'+k+'"'+(mine.has(k)?' checked':'')+'> '+KNAME[k]+'</label>').join('')+'<p style="color:var(--muted);font-size:14px">Saved on this tablet only.</p>';
  $('dlg').showModal(); $('dlg').onclose=()=>{ const v=[...$('dlgBody').querySelectorAll('input:checked')].map(i=>i.value); ST.custom[ST.screen]=v.length?v:SCREENS[ST.screen].st; save(); seen=new Set(); first=true; render(); }; };

/* the pass is loud about late cleaning: washrooms, glass, floors that are overdue */
let CPLAN=null, CLOGS=[], CLATE='';
function cleanBar(){ const b=$('cbar'); if(!CPLAN){ b.hidden=true; return; }
  const H=window.HayatClean, st=H.state(CPLAN,H.bizDate(),CLOGS,H.bizMin()), late=st.rows.filter(r=>r.st==='overdue'&&r.late<=120);
  if(!late.length){ b.hidden=true; CLATE=''; return; }
  b.hidden=false; b.innerHTML='🧹 Late cleaning:'+late.slice(0,6).map(r=>'<span>'+H.area(CPLAN,r.t.area).icon+' '+r.t.name+' · '+r.late+'′</span>').join('')+(late.length>6?'<span>+'+(late.length-6)+' more</span>':'');
  const key=late.map(r=>r.id).join(','); if(key!==CLATE){ if(CLATE!==''||late.length) { if(ST.sound) beep(); } CLATE=key; } }
let CLOGOFF=null, CLOGDAY='';
function subLogs(){ if(!FB) return; const d=HayatClean.bizDate(); if(d===CLOGDAY) return; CLOGDAY=d; if(CLOGOFF) try{ CLOGOFF(); }catch(e){} CLOGS=[];   /* a tablet left on past 05:00 reads the NEW day's cleaning log */
  CLOGOFF=FB.fs.onSnapshot(FB.fs.query(FB.fs.collection(FB.db,'cleanlog'),FB.fs.where('day','==',d)),s=>{ CLOGS=s.docs.map(x=>x.data()); cleanBar(); },()=>{}); }
setInterval(()=>{ subLogs(); cleanBar(); },30000);
(async function(){
  const stop=h=>{ $('main').innerHTML='<div class="msg">'+h+'</div>'; };
  let ctx; try{ ctx=await HayatAuth.start(); }catch(e){ return stop('<b>Not connected.</b> '+(e.message||e)); }
  const go=async()=>{ const fs=ctx.fs, db=ctx.db; FB={fs,db};
    const fail=e=>stop(e&&e.code==='permission-denied'?'<b>Not allowed.</b> This sign-in is not kitchen or office, or the latest firestore.rules are not published yet.':'<b>Could not reach Firebase.</b> '+(e&&(e.code||e.message)));
    fs.onSnapshot(fs.doc(db,'vm_meta','sync'),d=>{ META=d.exists()?d.data():null; feed(); },fail);
    fs.onSnapshot(fs.query(fs.collection(db,'orders'),fs.where('at','>=',Date.now()-12*3600e3)),snap=>{ WEB=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(o=>o.source==='counter'||(o.kots&&o.kots.length)); render(); },()=>{});
    fs.onSnapshot(fs.collection(db,'vm_open'),snap=>{ OPEN=snap.docs.map(d=>d.data()); const live=new Set(OPEN.map(o=>String(o.invoiceId)).concat(WEB.map(o=>'w'+o.id)).concat(TRIAL.map(o=>'w'+o.id)));
      Object.keys(DONE).forEach(id=>{ if(!live.has(id.split('_')[1])) delete DONE[id]; }); render(); },fail);
    const since=new Date(Date.now()-12*3600e3);
    fs.onSnapshot(fs.query(fs.collection(db,'kds'),fs.where('doneAt','>=',since)),snap=>{ snap.docs.forEach(d=>{ DONE[d.id]=d.data(); }); render(); },fail);
    fs.onSnapshot(fs.query(fs.collection(db,'kds_state'),fs.where('at','>=',Date.now()-12*3600e3)),snap=>{ (snap&&snap.docs||[]).forEach(d=>{ KST[d.id]=d.data(); }); render(); },()=>{});
    let trialOff=null; fs.onSnapshot(fs.doc(db,'settings','captain'),d=>{ const on=!!(d.exists()&&d.data().kdsTrial); if(on===KDSTRIAL&&(trialOff||!on)) return; KDSTRIAL=on; if(trialOff){ trialOff(); trialOff=null; TRIAL=[]; }
      if(on) trialOff=fs.onSnapshot(fs.query(fs.collection(db,'trial_orders'),fs.where('at','>=',Date.now()-12*3600e3)),snap=>{ TRIAL=snap.docs.map(d=>Object.assign({id:d.id},d.data())); render(); },()=>{}); render(); },()=>{});
    fs.onSnapshot(fs.doc(db,'cleanplan','main'),d=>{ CPLAN=d.exists()&&d.data().tasks?Object.assign({},HayatClean.DEFAULT_PLAN,d.data()):HayatClean.DEFAULT_PLAN; cleanBar(); },()=>{});
    subLogs();
  };
  if(!['office','kitchen','captain'].includes(ctx.role)){ $('main').innerHTML=''; await HayatAuth.form($('main'),ctx,['kitchen','office','captain'],go,'Sign in once on this tablet with the kitchen code.'); return; }
  go(); })();
</script>
