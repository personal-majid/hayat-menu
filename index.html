<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140C06">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Authentic Yemeni mandi, alfaham, shawaya and fresh seafood in Makkaraparamba, Malappuram. Dine-in, takeaway, home delivery and catering.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-icon.png">
<meta property="og:type" content="restaurant">
<meta property="og:title" content="Hayat Fish Restaurant — Menu">
<meta property="og:description" content="Authentic Yemeni mandi, alfaham and fresh seafood. Makkaraparamba, Malappuram. Home delivery and catering.">
<meta property="og:image" content="assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/mark.png">
<link rel="apple-touch-icon" href="assets/mark.png">
<title>Hayat Fish Restaurant — Menu</title>
<style>
html[lang="ml"] .prow .n,html[lang="ml"] .row .n{line-height:1.5}
html[lang="ml"] h2.sec{letter-spacing:.2px}
html[lang="ml"] .cp b,html[lang="ml"] .phead span:nth-child(n+3){letter-spacing:.2px}
html[lang="ml"] .tag{letter-spacing:.2px}
:root{
  --bg:#140C06; --card:#271A0D;
  --line:rgba(201,162,75,.20); --line2:rgba(201,162,75,.38);
  --gold:#C9A24B; --gold2:#EFCE86; --cream:#F5F1DF; --green:#8FBE43;
  --paper:#EFE6CF; --ink:#2A1A0D; --hot:#E4705A; --muted:#A28C6C;
  --ig1:#F58529; --ig2:#DD2A7B; --ig3:#8134AF;
  --r:18px; --r2:12px; --tap:52px;
  --shadow:0 14px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:
    radial-gradient(1200px 700px at 12% -12%, #4A2E12 0%, transparent 58%),
    radial-gradient(900px 560px at 104% 108%, #3A1E28 0%, transparent 55%),
    var(--bg);
  color:var(--cream);
  font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Noto Sans Malayalam",
    "Manjari","AnjaliOldLipi",sans-serif;
  overflow:hidden;user-select:none;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
img{display:block}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ================= header ================= */
header{display:flex;align-items:center;gap:14px;padding:11px 20px;flex:0 0 auto;z-index:30;
  background:linear-gradient(180deg,rgba(38,24,12,.96),rgba(20,12,6,.92));
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header .logo{height:48px;width:auto;flex:0 0 auto}
.brand h1{margin:0;font-size:17.5px;font-weight:700;letter-spacing:.3px;color:var(--green)}
.brand p{margin:2px 0 0;font-size:10.5px;color:var(--gold);letter-spacing:1.6px;text-transform:uppercase}
.spacer{flex:1}
#search{width:186px;min-height:42px;background:rgba(255,255,255,.045);border:1px solid var(--line);
  border-radius:var(--r2);padding:0 14px;color:var(--cream);font-size:14px;outline:none}
#search::placeholder{color:var(--muted)}
#search:focus{border-color:var(--gold);background:rgba(255,255,255,.07)}
.gbtn{min-height:42px;padding:0 16px;border-radius:var(--r2);display:flex;align-items:center;gap:8px;
  font-size:13px;font-weight:700;letter-spacing:.4px;border:1px solid var(--line2);
  background:linear-gradient(135deg,rgba(201,162,75,.18),rgba(201,162,75,.06));color:var(--gold2)}
.gbtn:active{background:rgba(201,162,75,.3)}

/* ================= shell ================= */
#body{flex:1;display:flex;min-height:0}
nav{width:250px;flex:0 0 auto;overflow-y:auto;padding:12px;
  border-right:1px solid var(--line);background:rgba(0,0,0,.26)}
nav::-webkit-scrollbar,main::-webkit-scrollbar,.hscroll::-webkit-scrollbar{height:0;width:0}
.navitem{display:flex;align-items:center;gap:12px;width:100%;min-height:var(--tap);
  padding:0 13px;border-radius:var(--r2);margin-bottom:4px;text-align:left;
  font-size:14.5px;font-weight:600;line-height:1.2;color:var(--cream)}
.navitem .ic{font-size:20px}
.navitem small{display:block;font-size:10px;font-weight:700;opacity:.55;letter-spacing:.6px}
.navitem:active{background:rgba(255,255,255,.05)}
.navitem.on{background:linear-gradient(135deg,var(--gold),#A8823A);color:#241608}
.navitem.special{border:1px solid var(--line2);
  background:linear-gradient(135deg,rgba(221,42,123,.18),rgba(129,52,175,.10));margin-bottom:12px}
.navitem.special.on{background:linear-gradient(135deg,var(--gold),#A8823A);color:#241608;border-color:var(--gold)}
.navsep{height:1px;background:var(--line);margin:10px 4px}
main{flex:1;overflow-y:auto;padding:0 26px 96px;scroll-behavior:smooth}

/* ================= back bars ================= */
.backbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:14px 0 12px;margin-bottom:6px;
  background:linear-gradient(180deg,var(--bg) 62%,rgba(20,12,6,0))}
.back{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:0 18px 0 14px;
  border-radius:999px;border:1px solid var(--line2);font-size:13.5px;font-weight:700;
  background:rgba(255,255,255,.05);color:var(--gold2);letter-spacing:.3px}
.back:active{background:rgba(201,162,75,.2)}
.back .a{font-size:17px;line-height:1}
.crumbtxt{font-size:12.5px;color:var(--muted);letter-spacing:.4px}
.backbottom{display:flex;justify-content:center;margin:38px 0 6px}
.backbottom .back{padding:0 30px;min-height:52px;font-size:14.5px}

/* ================= headings ================= */
.rule{display:flex;align-items:center;gap:16px;margin:6px 0 6px}
.rule:before,.rule:after{content:"";height:1px;flex:1;
  background:linear-gradient(90deg,transparent,var(--line2),transparent)}
h2.sec{margin:0;font-size:26px;font-weight:800;letter-spacing:1px;color:var(--gold2);
  text-transform:uppercase;text-align:center;white-space:nowrap}
p.secsub{margin:8px 0 22px;font-size:12.5px;color:var(--muted);text-align:center;letter-spacing:.5px}
h3.mini{margin:34px 0 14px;font-size:11.5px;letter-spacing:2.6px;text-transform:uppercase;
  color:var(--gold);display:flex;align-items:center;gap:12px}
h3.mini:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,var(--line2),transparent)}

/* ================= thumbnails ================= */
.thumb{width:62px;height:62px;flex:0 0 auto;border-radius:var(--r2);overflow:hidden;
  background:#2A1A0C;border:1px solid var(--line);position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}

/* ================= price table ================= */
.seg{display:inline-flex;gap:4px;padding:4px;background:rgba(255,255,255,.05);
  border:1px solid var(--line);border-radius:14px;margin:0 0 18px}
.seg button{min-height:40px;padding:0 22px;border-radius:11px;font-size:13.5px;
  font-weight:700;color:var(--muted);letter-spacing:.3px}
.seg button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#241608}
.plist{max-width:940px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
  box-shadow:var(--shadow)}
.phead{display:grid;grid-template-columns:62px 1fr repeat(3,94px);gap:16px;align-items:center;
  padding:12px 20px;background:rgba(0,0,0,.34);border-bottom:1px solid var(--line)}
.phead span:nth-child(n+3){text-align:center;font-size:10px;font-weight:800;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--gold)}
.prow{display:grid;grid-template-columns:62px 1fr repeat(3,94px);gap:16px;align-items:center;
  width:100%;padding:13px 20px;text-align:left;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow:active{background:rgba(201,162,75,.10)}
.prow.anchor{background:linear-gradient(90deg,rgba(201,162,75,.16),rgba(201,162,75,.03))}
.prow .pl{min-width:0}
.prow .n{display:block;font-size:15.5px;font-weight:700;letter-spacing:.2px}
.prow .d{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.prow .pc{text-align:center;color:var(--gold2);font-weight:700;font-size:16px;white-space:nowrap}
.prow .pc.na{color:rgba(162,140,108,.5);font-weight:600}
.prow .pc em{display:block;font-style:normal;font-size:9px;letter-spacing:.9px;
  text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:3px}

/* paper variant */
.paper{background:var(--paper);color:var(--ink);border-radius:var(--r);
  padding:8px;max-width:860px;box-shadow:var(--shadow)}
.rows{display:grid;gap:6px}
.row{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.5);
  border:1px solid rgba(160,140,100,.28);border-radius:var(--r2);padding:9px 14px;
  min-height:var(--tap);text-align:left;width:100%}
.row:active{border-color:var(--gold)}
.row .n{font-size:15px;font-weight:600}
.row .d{font-size:11.5px;color:#6B5A3E;margin-top:2px}
.row .p{margin-left:auto;color:#8A6A1E;font-weight:800;font-size:16px;white-space:nowrap}
.paper .thumb{border-color:rgba(160,140,100,.35);background:#DCCDA9}

/* ============ photo cards (price under the image) ============ */
.pgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}
.pcard{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);
  background:var(--card);text-align:left;display:block;width:100%;box-shadow:var(--shadow)}
.pcard:active{border-color:var(--gold2);transform:scale(.99)}
.pcard .ph{aspect-ratio:4/3;overflow:hidden;background:#2A1A0C}
.pcard .ph img{width:100%;height:100%;object-fit:cover}
.pcard .cap{padding:12px 14px 14px;border-top:1px solid var(--line);
  background:linear-gradient(180deg,#2C1D0E,#1E1309)}
.pcard .cn{font-size:15px;font-weight:700;letter-spacing:.2px;line-height:1.3}
.pcard .cprices{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.cp{font-size:12.5px;font-weight:700;color:var(--gold2);background:rgba(201,162,75,.16);
  border:1px solid var(--line2);border-radius:8px;padding:4px 9px;white-space:nowrap}
.cp b{color:var(--muted);font-weight:700;font-size:9.5px;letter-spacing:.8px;
  text-transform:uppercase;margin-right:5px}
.ribbon{position:absolute;top:12px;left:12px;font-size:9.5px;font-weight:800;
  letter-spacing:1.2px;text-transform:uppercase;padding:5px 10px;border-radius:7px;
  background:linear-gradient(135deg,var(--gold2),var(--gold));color:#241608}
.ribbon.hot{background:linear-gradient(135deg,#F08A72,var(--hot));color:#2A0D08}

/* ================= dish page ================= */
.detail{max-width:960px}
.hero{aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:#2A1A0C;
  border:1px solid var(--line);margin-bottom:20px;box-shadow:var(--shadow);position:relative}
.hero img{width:100%;height:100%;object-fit:cover}
.hero .hcap{position:absolute;left:0;right:0;bottom:0;padding:56px 24px 20px;
  background:linear-gradient(180deg,rgba(12,7,3,0),rgba(12,7,3,.88))}
.hero .hcap .hn{font-size:26px;font-weight:800;letter-spacing:.3px}
.hero .hcap .hp{display:flex;flex-wrap:wrap;gap:9px;margin-top:11px}
.detail h3{margin:0;font-size:29px;letter-spacing:.3px;color:var(--cream);font-weight:800}
.detail .subline{font-size:13.5px;color:var(--gold);margin-bottom:8px;letter-spacing:.4px}
.detail .desc{font-size:15px;line-height:1.75;color:#DFD6BC;margin:14px 0 4px;max-width:680px}
table.mx{width:100%;max-width:580px;border-collapse:separate;border-spacing:0;
  border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;font-size:14px}
table.mx th,table.mx td{padding:13px 10px;text-align:center;border-bottom:1px solid var(--line)}
table.mx thead th{background:rgba(0,0,0,.32);color:var(--gold);font-size:10px;
  text-transform:uppercase;letter-spacing:1.3px;font-weight:800}
table.mx tbody th{text-align:left;font-weight:700;color:var(--cream);font-size:13px;
  background:rgba(0,0,0,.18)}
table.mx td{color:var(--gold2);font-weight:700;font-size:15.5px}
table.mx tr:last-child th,table.mx tr:last-child td{border-bottom:0}
.opts{display:grid;gap:9px;max-width:460px}
.opt{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.04);
  border:1px solid var(--line);border-radius:var(--r2);padding:14px 17px;font-size:14.5px;font-weight:600}
.opt .p{color:var(--gold2);font-size:17px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:26px}
.chip{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:999px;
  padding:7px 13px;font-size:11.5px;color:var(--muted)}

/* ================= tags ================= */
.tag{font-size:9px;font-weight:800;padding:3px 7px;border-radius:5px;text-transform:uppercase;
  letter-spacing:.7px;margin-left:7px;vertical-align:1.5px;display:inline-block}
.tag.hot{background:rgba(228,112,90,.9);color:#2A0D08}
.tag.veg{background:rgba(143,190,67,.9);color:#17250A}
.tag.star{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#241608}

/* ================= gallery ================= */
.tabs{display:inline-flex;gap:4px;padding:4px;background:rgba(255,255,255,.05);
  border:1px solid var(--line);border-radius:14px;margin:0 0 22px}
.tabs button{min-height:42px;padding:0 22px;border-radius:11px;font-size:13.5px;
  font-weight:700;color:var(--muted);letter-spacing:.4px}
.tabs button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#241608}
.ggrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.gcell{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--card);
  position:relative;width:100%;display:block;box-shadow:var(--shadow)}
.gcell img,.gcell video{width:100%;aspect-ratio:4/3;object-fit:cover;background:#000}
.gcell .gc{position:absolute;left:0;right:0;bottom:0;padding:28px 14px 12px;font-size:13px;
  font-weight:600;background:linear-gradient(180deg,rgba(12,7,3,0),rgba(12,7,3,.9));pointer-events:none}
.gcell .play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.gcell .play span{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;
  background:rgba(12,7,3,.6);border:1px solid rgba(255,255,255,.4);font-size:20px;color:#fff}
.hscroll{display:flex;gap:15px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x mandatory}
.igcard{flex:0 0 auto;width:330px;height:560px;border-radius:var(--r);overflow:hidden;
  border:1px solid var(--line);background:#000;scroll-snap-align:start}
.igcard iframe{width:100%;height:100%;border:0;display:block}
.igwrap{display:grid;gap:15px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));max-width:1080px}
.igwrap .igcard{width:100%}
.offline{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;
  height:100%;padding:26px;text-align:center;background:var(--card);color:var(--muted);font-size:13px}
.offline b{color:var(--cream);font-size:15px}
.offline a{color:#fff;text-decoration:none;font-weight:700;font-size:13px;padding:11px 18px;
  border-radius:10px;background:linear-gradient(135deg,var(--ig1),var(--ig2) 55%,var(--ig3))}
.nomedia{background:rgba(255,255,255,.035);border:1px dashed var(--line2);border-radius:var(--r);
  padding:24px;color:var(--muted);font-size:13px;line-height:1.7;max-width:680px}
.nomedia code{color:var(--gold2);font-size:12px}
.nomedia b{color:var(--cream)}

/* ================= home ================= */
.homehero{text-align:center;padding:22px 0 4px}
.homehero img{height:136px;width:auto;margin:0 auto 8px}
.homehero .tl{font-size:11.5px;letter-spacing:4px;color:var(--gold);text-transform:uppercase}
.trust{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:18px}
.trust span{font-size:10px;letter-spacing:1.3px;color:var(--muted);text-transform:uppercase;
  border:1px solid var(--line);border-radius:999px;padding:6px 13px}
.promo{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:26px}
.pbox{border:1px solid var(--line2);border-radius:var(--r);padding:20px;
  background:linear-gradient(150deg,rgba(201,162,75,.13),rgba(255,255,255,.02));box-shadow:var(--shadow)}
.pbox .pi{font-size:26px;line-height:1}
.pbox h4{margin:12px 0 6px;font-size:16.5px;font-weight:800;letter-spacing:.3px;color:var(--gold2)}
.pbox p{margin:0;font-size:12.5px;line-height:1.6;color:var(--muted)}
.nums{display:grid;gap:7px;margin-top:14px}
.nums a{display:flex;align-items:center;justify-content:space-between;gap:10px;
  min-height:44px;padding:0 14px;border-radius:10px;text-decoration:none;
  background:rgba(0,0,0,.28);border:1px solid var(--line);color:var(--cream);font-size:13.5px}
.nums a b{color:var(--gold2);font-size:14.5px;letter-spacing:.3px}
.nums a span{font-size:10.5px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.tile{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;
  display:flex;flex-direction:column;background:var(--card);box-shadow:var(--shadow);position:relative}
.tile:active{border-color:var(--gold2);transform:scale(.99)}
.tile .cover{aspect-ratio:16/10;overflow:hidden;background:#2A1A0C}
.tile .cover img{width:100%;height:100%;object-fit:cover}
.tile .tb{padding:13px 15px 15px}
.tile .tt{font-size:15px;font-weight:700}
.tile .ts{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.tile .tc{color:var(--gold2);font-weight:700;font-size:11px;margin-top:11px;display:block;
  letter-spacing:1.2px;text-transform:uppercase}
.infobar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:26px;padding:16px 20px;
  border:1px solid var(--line);border-radius:var(--r);background:rgba(255,255,255,.03);font-size:13px}
.infobar .il{color:var(--muted)}
.infobar a{margin-left:auto;color:var(--gold2);text-decoration:none;font-weight:700;font-size:13px}
.igbar{display:flex;align-items:center;gap:14px;border:1px solid var(--line2);border-radius:var(--r);
  padding:16px 20px;margin:26px 0 0;
  background:linear-gradient(135deg,rgba(221,42,123,.16),rgba(129,52,175,.08))}
.igbar .t{font-size:15px;font-weight:800}
.igbar .s{font-size:12px;color:var(--muted);margin-top:3px}
.igbar a{margin-left:auto;padding:13px 22px;border-radius:12px;color:#fff;text-decoration:none;
  font-weight:700;font-size:13.5px;background:linear-gradient(135deg,var(--ig1),var(--ig2) 55%,var(--ig3))}
.thanks{text-align:center;color:var(--gold);font-size:13.5px;margin:36px 0 0;font-style:italic;
  letter-spacing:.5px}
.empty{color:var(--muted);padding:28px 0;font-size:14px}


/* ============ celebrate ============ */
.celebrate{position:relative;overflow:hidden;border-radius:22px;margin-top:8px;
  border:1px solid rgba(201,162,75,.45);padding:30px 26px;
  background:
    radial-gradient(700px 300px at 8% 0%, rgba(221,42,123,.18), transparent 62%),
    radial-gradient(600px 320px at 100% 100%, rgba(201,162,75,.22), transparent 60%),
    linear-gradient(160deg,#3A1E12,#1E1209);box-shadow:var(--shadow)}
.celebrate .kicker{font-size:10.5px;letter-spacing:3px;text-transform:uppercase;color:var(--gold)}
.celebrate h3{margin:10px 0 6px;font-size:30px;font-weight:800;letter-spacing:-.3px;
  background:linear-gradient(100deg,#FFF0C4,var(--gold2),#F0A8C0);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.celebrate .tag{font-size:13.5px;color:var(--gold2);letter-spacing:.4px}
.celebrate p.cb{margin:14px 0 20px;font-size:14.5px;line-height:1.7;color:#E4DBC2;max-width:640px}
.occ{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:22px}
.occ .o{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px;padding:14px 15px}
.occ .o .oi{font-size:22px;line-height:1}
.occ .o b{display:block;margin:8px 0 3px;font-size:14.5px;color:var(--cream)}

/* ============ kiosk QR sheet ============ */

.ups{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x mandatory}

/* ============ instagram reel cards (kiosk) ============ */
.igrow{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x mandatory}
.igrow::-webkit-scrollbar{height:0}
.igc{flex:0 0 auto;width:230px;aspect-ratio:9/16;border-radius:20px;overflow:hidden;

  background:linear-gradient(150deg,rgba(221,42,123,.30),rgba(129,52,175,.18),#241608);
  box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:flex-end;padding:16px}
.igc:active{transform:scale(.98)}
.igc .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);

  background:rgba(12,7,3,.5);border:1.5px solid rgba(255,255,255,.55);color:#fff}
.igc .mark{position:absolute;top:14px;left:14px;font-size:11px;font-weight:800;letter-spacing:.6px;

.igc .t{font-size:14.5px;font-weight:700;line-height:1.3;position:relative}

.igc{position:relative;overflow:hidden;background:#000;padding:0}

  transform:scale(1.02);transform-origin:top center;

.igc iframe.in{opacity:1}
/* The embed is a picture, not a player. Instagram will not play a reel inside
   an iframe — tapping inside it navigates to instagram.com. On a table tablet

.igc iframe{pointer-events:none}

/* ===== WELCOME VIDEO OVERLAY ===================================== */
#intro{position:fixed;inset:0;z-index:9000;background:#000;overflow:hidden;
  touch-action:none;transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .5s}
#intro[hidden]{display:none}

  transition:transform .38s cubic-bezier(.4,0,.2,1)}

.introslide{flex:0 0 100%;height:100%;position:relative;background:#000}
.introslide video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
/* the clips are 16:9 — on a portrait phone, letterbox instead of
   cropping the logo out of frame */
@media (orientation:portrait){ .introslide video{object-fit:contain} }
#intro .veil{position:absolute;inset:auto 0 0 0;height:42%;pointer-events:none;
  background:linear-gradient(to top,rgba(0,0,0,.78),rgba(0,0,0,0))}

  background:linear-gradient(to bottom,rgba(0,0,0,.55),rgba(0,0,0,0))}

  text-shadow:0 2px 14px rgba(0,0,0,.7)}
#introhint .chev{display:block;width:17px;height:17px;margin:0 auto 9px;
  border-left:3px solid var(--gold,#d9a441);border-top:3px solid var(--gold,#d9a441);
  border-radius:3px;transform:rotate(45deg);font-size:0;
  animation:introbob 1.6s ease-in-out infinite}

#introdots{position:absolute;left:0;right:0;bottom:max(104px,calc(env(safe-area-inset-bottom) + 92px));
  display:flex;gap:8px;justify-content:center;z-index:3;pointer-events:none}
#introdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.38);

#intro .ib{position:absolute;z-index:4;border:1px solid rgba(255,255,255,.3);

@keyframes sndpulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(217,164,65,.55)}

#introsound{top:max(16px,env(safe-area-inset-top));right:16px}

@media (max-width:560px){

}

     Everything below is a copy of icons.js / lang.js / config.js /
     menu-data.js, inlined so the menu still works if one of those

<script>/* defaults from assets/qr.js */
/* ============================================================
   Tiny QR encoder — byte mode, ECC level L, versions 1..10.
   Enough for any Instagram / WhatsApp / Google URL.

   Why this exists: you will post hundreds of reels. Paste the URL
   into config.js and the code is drawn in the browser. No files to
   generate, nothing to upload, works offline.

   window.qrSvg(text, size)  ->  a data: URI you can put in <img src>
   ============================================================ */
(function () {

  /* ---- Galois field GF(256) ---- */
  var EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  (function () {
    var x = 1;
    for (var i = 0; i < 255; i++) {
      EXP[i] = x; LOG[x] = i;
      x <<= 1; if (x & 0x100) x ^= 0x11d;
    }
    for (i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  })();
  function mul(a, b) { return (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]]; }

  /* ---- Reed–Solomon ---- */
  function rsPoly(n) {
    var p = [1];
    for (var i = 0; i < n; i++) {
      var q = p.concat([0]);
      for (var j = 0; j < p.length; j++) q[j + 1] ^= mul(p[j], EXP[i]);
      p = q;
    }
    return p;
  }
  function rsEncode(data, ecLen) {
    var gen = rsPoly(ecLen), res = new Array(ecLen).fill(0);
    for (var i = 0; i < data.length; i++) {
      var factor = data[i] ^ res[0];
      res.shift(); res.push(0);
      for (var j = 0; j < ecLen; j++) res[j] ^= mul(gen[j + 1], factor);
    }
    return res;
  }

  /* ---- capacity tables, ECC level L, versions 1..10 ----
     [ total codewords, ec codewords per block, block counts ]        */
  var VER = {
    1:  { tot: 26,  ec: 7,  g1: 1, d1: 19 },
    2:  { tot: 44,  ec: 10, g1: 1, d1: 34 },
    3:  { tot: 70,  ec: 15, g1: 1, d1: 55 },
    4:  { tot: 100, ec: 20, g1: 1, d1: 80 },
    5:  { tot: 134, ec: 26, g1: 1, d1: 108 },
    6:  { tot: 172, ec: 18, g1: 2, d1: 68 },
    7:  { tot: 196, ec: 20, g1: 2, d1: 78 },
    8:  { tot: 242, ec: 24, g1: 2, d1: 97 },
    9:  { tot: 292, ec: 30, g1: 2, d1: 116 },
    10: { tot: 346, ec: 18, g1: 2, d1: 68, g2: 2, d2: 69 }
  };
  var ALIGN = {
    1: [], 2: [6, 18], 3: [6, 22], 4: [6, 26], 5: [6, 30],
    6: [6, 34], 7: [6, 22, 38], 8: [6, 24, 42], 9: [6, 26, 46], 10: [6, 28, 50]
  };

  function utf8(str) {
    var out = [], s = encodeURIComponent(str);
    for (var i = 0; i < s.length; i++) {
      if (s[i] === "%") { out.push(parseInt(s.substr(i + 1, 2), 16)); i += 2; }
      else out.push(s.charCodeAt(i));
    }
    return out;
  }

  function build(text) {
    var bytes = utf8(text), ver = 0, spec = null;
    for (var v = 1; v <= 10; v++) {
      var s = VER[v];
      var cap = s.g1 * s.d1 + (s.g2 || 0) * (s.d2 || 0);
      var lenBits = v < 10 ? 8 : 16;
      if ((4 + lenBits + bytes.length * 8) <= cap * 8) { ver = v; spec = s; break; }
    }
    if (!ver) throw new Error("QR: text too long");

    /* --- bit stream --- */
    var bits = [];
    function push(val, n) { for (var i = n - 1; i >= 0; i--) bits.push((val >> i) & 1); }
    push(4, 4);                                   // byte mode
    push(bytes.length, ver < 10 ? 8 : 16);
    for (var i = 0; i < bytes.length; i++) push(bytes[i], 8);

    var capBits = (spec.g1 * spec.d1 + (spec.g2 || 0) * (spec.d2 || 0)) * 8;
    for (i = 0; i < 4 && bits.length < capBits; i++) bits.push(0);
    while (bits.length % 8) bits.push(0);
    var pad = [0xEC, 0x11], k = 0;
    while (bits.length < capBits) { push(pad[k++ % 2], 8); }

    var codes = [];
    for (i = 0; i < bits.length; i += 8) {
      var b = 0; for (var j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
      codes.push(b);
    }

    /* --- split into blocks, add EC --- */
    var blocks = [], ecs = [], p = 0, bi;
    for (bi = 0; bi < spec.g1; bi++) { blocks.push(codes.slice(p, p + spec.d1)); p += spec.d1; }
    for (bi = 0; bi < (spec.g2 || 0); bi++) { blocks.push(codes.slice(p, p + spec.d2)); p += spec.d2; }
    for (bi = 0; bi < blocks.length; bi++) ecs.push(rsEncode(blocks[bi], spec.ec));

    var out = [], maxD = Math.max.apply(null, blocks.map(function (b) { return b.length; }));
    for (i = 0; i < maxD; i++)
      for (bi = 0; bi < blocks.length; bi++)
        if (i < blocks[bi].length) out.push(blocks[bi][i]);
    for (i = 0; i < spec.ec; i++)
      for (bi = 0; bi < ecs.length; bi++) out.push(ecs[bi][i]);

    /* --- matrix --- */
    var n = ver * 4 + 17;
    var m = [], reserved = [];
    for (i = 0; i < n; i++) { m.push(new Array(n).fill(0)); reserved.push(new Array(n).fill(0)); }

    function finder(r, c) {
      for (var dr = -1; dr <= 7; dr++) for (var dc = -1; dc <= 7; dc++) {
        var rr = r + dr, cc = c + dc;
        if (rr < 0 || cc < 0 || rr >= n || cc >= n) continue;
        var on = (dr >= 0 && dr <= 6 && (dc === 0 || dc === 6)) ||
                 (dc >= 0 && dc <= 6 && (dr === 0 || dr === 6)) ||
                 (dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4);
        m[rr][cc] = on ? 1 : 0; reserved[rr][cc] = 1;
      }
    }
    finder(0, 0); finder(0, n - 7); finder(n - 7, 0);

    var al = ALIGN[ver];
    for (i = 0; i < al.length; i++) for (var jj = 0; jj < al.length; jj++) {
      var r = al[i], c = al[jj];
      if (reserved[r] && reserved[r][c]) continue;
      for (var dr2 = -2; dr2 <= 2; dr2++) for (var dc2 = -2; dc2 <= 2; dc2++) {
        m[r + dr2][c + dc2] = (Math.abs(dr2) === 2 || Math.abs(dc2) === 2 ||
                               (dr2 === 0 && dc2 === 0)) ? 1 : 0;
        reserved[r + dr2][c + dc2] = 1;
      }
    }
    for (i = 8; i < n - 8; i++) {
      m[6][i] = (i % 2 === 0) ? 1 : 0; reserved[6][i] = 1;
      m[i][6] = (i % 2 === 0) ? 1 : 0; reserved[i][6] = 1;
    }
    m[n - 8][8] = 1; reserved[n - 8][8] = 1;                 // dark module
    for (i = 0; i < 9; i++) {
      if (!reserved[8][i]) reserved[8][i] = 1;
      if (!reserved[i][8]) reserved[i][8] = 1;
    }
    for (i = 0; i < 8; i++) { reserved[8][n - 1 - i] = 1; reserved[n - 1 - i][8] = 1; }

    /* --- place data, zig-zag --- */
    var idx = 0, bit = 0, up = true;
    for (var col = n - 1; col > 0; col -= 2) {
      if (col === 6) col--;
      for (var t = 0; t < n; t++) {
        var row = up ? (n - 1 - t) : t;
        for (var s2 = 0; s2 < 2; s2++) {
          var cc2 = col - s2;
          if (reserved[row][cc2]) continue;
          var v2 = 0;
          if (idx < out.length) v2 = (out[idx] >> (7 - bit)) & 1;
          m[row][cc2] = v2;
          bit++; if (bit === 8) { bit = 0; idx++; }
        }
      }
      up = !up;
    }

    /* --- masking --- */
    function maskFn(k, r, c) {
      switch (k) {
        case 0: return (r + c) % 2 === 0;
        case 1: return r % 2 === 0;
        case 2: return c % 3 === 0;
        case 3: return (r + c) % 3 === 0;
        case 4: return (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0;
        case 5: return ((r * c) % 2 + (r * c) % 3) === 0;
        case 6: return (((r * c) % 2 + (r * c) % 3) % 2) === 0;
        default: return (((r + c) % 2 + (r * c) % 3) % 2) === 0;
      }
    }
    function penalty(g) {
      var pen = 0, r, c, run, dark = 0;
      for (r = 0; r < n; r++) {
        run = 1;
        for (c = 1; c < n; c++) {
          if (g[r][c] === g[r][c - 1]) { run++; }
          else { if (run >= 5) pen += 3 + (run - 5); run = 1; }
        }
        if (run >= 5) pen += 3 + (run - 5);
      }
      for (c = 0; c < n; c++) {
        run = 1;
        for (r = 1; r < n; r++) {
          if (g[r][c] === g[r - 1][c]) { run++; }
          else { if (run >= 5) pen += 3 + (run - 5); run = 1; }
        }
        if (run >= 5) pen += 3 + (run - 5);
      }
      for (r = 0; r < n - 1; r++) for (c = 0; c < n - 1; c++)
        if (g[r][c] === g[r][c + 1] && g[r][c] === g[r + 1][c] && g[r][c] === g[r + 1][c + 1]) pen += 3;
      for (r = 0; r < n; r++) for (c = 0; c < n; c++) if (g[r][c]) dark++;
      pen += Math.floor(Math.abs(dark * 100 / (n * n) - 50) / 5) * 10;
      return pen;
    }

    var best = null, bestPen = Infinity, bestMask = 0;
    for (var mk = 0; mk < 8; mk++) {
      var g = m.map(function (row2) { return row2.slice(); });
      for (r = 0; r < n; r++) for (c = 0; c < n; c++)
        if (!reserved[r][c] && maskFn(mk, r, c)) g[r][c] ^= 1;
      /* format info for ECC L + this mask */
      var fmt = (0x01 << 3) | mk;               // 01 = level L
      var rem = fmt;
      for (i = 0; i < 10; i++) rem = (rem << 1) ^ (((rem >> 9) & 1) * 0x537);
      var format = ((fmt << 10) | rem) ^ 0x5412;
      for (i = 0; i < 15; i++) {
        var bitv = (format >> i) & 1;
        if (i < 6) g[i][8] = bitv;
        else if (i < 8) g[i + 1][8] = bitv;
        else if (i === 8) g[8][7] = bitv;
        else g[8][14 - i] = bitv;
        if (i < 8) g[8][n - 1 - i] = bitv;
        else g[n - 15 + i][8] = bitv;
      }
      g[n - 8][8] = 1;
      var pn = penalty(g);
      if (pn < bestPen) { bestPen = pn; best = g; bestMask = mk; }
    }
    return best;
  }

  window.qrMatrix = build;

  window.qrSvg = function (text, size) {
    size = size || 640;
    var m, n;
    try { m = build(text); n = m.length; }
    catch (e) { return ""; }
    var quiet = 4, total = n + quiet * 2, cell = size / total, d = "";
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        if (!m[r][c]) continue;
        var x = (c + quiet) * cell, y = (r + quiet) * cell;
        d += "M" + x.toFixed(2) + " " + y.toFixed(2) +
             "h" + cell.toFixed(2) + "v" + cell.toFixed(2) + "h-" + cell.toFixed(2) + "z";
      }
    }
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size +
      '" viewBox="0 0 ' + size + ' ' + size + '">' +
      '<rect width="' + size + '" height="' + size + '" fill="#fff"/>' +
      '<path d="' + d + '" fill="#1A1008"/></svg>';
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  };
})();

function rup(v){
  if(v==null) return "—";
  if(typeof v!=="number"){ return (String(v).toUpperCase()==="MP") ? T("marketPrice") : String(v); }
  return "₹"+(Number.isInteger(v) ? v.toLocaleString("en-IN") : v.toFixed(2));
}
function lowest(it){
  if(it.price!=null) return it.price;
  if(it.opts){ const n=it.opts.map(o=>o[1]).filter(v=>typeof v==="number");
               return n.length?Math.min.apply(null,n):null; }
  if(it.matrix){ const n=it.matrix.rows.flatMap(r=>r[1]).filter(v=>typeof v==="number");
                 return n.length?Math.min.apply(null,n):null; }
  return null;
}

/* instagram-style reels: silent autoplay while on screen, tap to unmute */
function mountReels(root){
  const vids=[...root.querySelectorAll(".reel video")];
  if(!vids.length) return;
  if(!("IntersectionObserver" in window)){ vids.forEach(v=>{try{v.play()}catch(e){}}); return; }
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    const v=e.target;
    if(e.isIntersecting && e.intersectionRatio>0.6){ v.play().catch(()=>{}); }
    else { v.pause(); }
  }),{threshold:[0,0.6,1]});
  vids.forEach(v=>{
    v.muted=true; v.playsInline=true; v.loop=true;
    io.observe(v);
    v.closest(".reel").addEventListener("click",ev=>{
      if(ev.target.closest("a")) return;
      v.muted=!v.muted;
      const b=v.closest(".reel").querySelector(".sound");
      if(b) b.textContent = v.muted ? "🔇" : "🔊";
      const hint=v.closest(".reel").querySelector(".hint");
      if(hint) hint.style.opacity="0";
      if(!v.muted) vids.forEach(o=>{ if(o!==v) o.muted=true; });
      v.play().catch(()=>{});
    });
  });
}

/* ---------------- instagram ---------------- */
function igEmbed(url){
  const m=String(url).match(/instagram\.com\/(p|reel|tv)\/([A-Za-z0-9_-]+)/);
  if(!m) return "";
  const src="https://www.instagram.com/"+m[1]+"/"+m[2]+"/embed/captioned/";
  return `<div class="igcard">${navigator.onLine
    ? `<iframe loading="lazy" src="${src}" scrolling="no" allowtransparency="true"
        allow="encrypted-media" referrerpolicy="origin-when-cross-origin"></iframe>`
    : `<div class="offline"><b>${T("offlineTitle")}</b>
        <span>${T("offlineBody")}</span>
        <a href="${esc(url)}" target="_blank" rel="noopener">${T("offlineBtn")}</a></div>`}</div>`;
}
const KIOSK = C.kiosk !== false;
var IG_OK = null;                      /* null = unknown, true/false after probe */
function igProbe(){
  if(!navigator.onLine){ IG_OK=false; return; }
  var done=false;
  var t=setTimeout(function(){ if(!done){ done=true; IG_OK=false; route(); } }, 3500);
  fetch("https://www.instagram.com/favicon.ico",{mode:"no-cors",cache:"no-store"})
    .then(function(){ if(done) return; done=true; clearTimeout(t);
      if(IG_OK!==true){ IG_OK=true; route(); } })
    .catch(function(){ if(done) return; done=true; clearTimeout(t);
      IG_OK=false; route(); });
}
function igNorm(x){
  if(!x) return null;
  var u = (typeof x === "string") ? x : x.url;
  if(!u || isPlaceholder(u)) return null;
  var m = String(u).match(/instagram\.com\/(p|reel|tv)\/([A-Za-z0-9_-]+)/);
  if(!m) return null;
  return { url:u, kind:m[1], code:m[2], title:(x && x.title) || "" };
}
function igList(){ return (C.trending||[]).map(igNorm).filter(Boolean); }

/* Every section runs a slideshow across the top. Use the section's own
   slides:[...] if it has them, otherwise build one from the dish photos
   so no section is ever bare. */
function sectionSlides(c){
  if(c.slides && c.slides.length) return c.slides.filter(x=>x && x.src);
  var out=[], seen={};
  (c.items||[]).forEach(function(it){
    (it.photos||[]).forEach(function(p){ if(p&&p.src&&!seen[p.src]){ seen[p.src]=1;
      out.push({src:p.src, caption:p.caption||it.name}); } });
  });
  if(out.length < 2){
    (c.items||[]).forEach(function(it){
      if(it.img && !seen[it.img]){ seen[it.img]=1; out.push({src:it.img, caption:it.name}); }
    });
  }
  return out.slice(0,6);
}
function slideShow(c, small){
  var sl = (c && c.slidesOverride) || sectionSlides(c);
  if(!sl.length) return "";
  return '<div class="slides'+(small?" small":"")+'" id="slides">'+sl.map(function(x,i){
    return '<div class="sl'+(i?"":" on")+'" data-cap="'+esc(x.caption||"")+'"'+
           (x.go?' data-goto="'+esc(x.go)+'"':'')+'>'+
           '<img '+(i?'loading="lazy" ':'')+'src="'+esc(x.src)+'" alt=""></div>';
  }).join("")+
  '<div class="scap" id="scap">'+esc(sl[0].caption||"")+'</div>'+
  '<div class="sdots">'+sl.map(function(_,i){
    return '<i class="'+(i?"":"on")+'" data-slide="'+i+'"></i>';}).join("")+'</div></div>';
}
/* Every banner in the whole menu, for the strip on the home page.
   Tapping one jumps straight to that section. */
function allSlides(){
  var out=[];
  MENU.forEach(function(c){
    (c.slides||[]).forEach(function(x){
      if(x && x.src) out.push({src:x.src, caption:x.caption||"", go:"#/c/"+c.id});
    });
  });
  return out;
}
var SLIDE_TIMER=null;
/* Shape the frame to whichever slide is showing, so a wide banner and a
   3:2 poster both fill it properly instead of sitting in black bands. */
function slideRatio(im){
  return (im && im.naturalWidth && im.naturalHeight) ? im.naturalWidth/im.naturalHeight : 0;
}
function fitBox(box, i){
  var imgs = box.querySelectorAll(".sl img");
  var im = imgs[i || 0]; if(!im) return;
  function apply(){
    var r = slideRatio(im); if(!r) return;
    var w = box.clientWidth || box.getBoundingClientRect().width;
    if(!w) return;
    var cap = box.classList.contains("small") ? 0.32 : 0.52;
    var h = Math.min(w / Math.max(1.2, Math.min(3.4, r)), window.innerHeight * cap);
    box.style.aspectRatio = "auto";     /* height rules from here on, not the ratio */
    box.style.height = Math.round(h) + "px";
  }
  if(im.complete) apply();
  else { im.addEventListener("load", apply); im.addEventListener("error", apply); }
}
function wireSlides(){
  if(SLIDE_TIMER){ clearInterval(SLIDE_TIMER); SLIDE_TIMER=null; }
  var box=document.getElementById("slides"); if(!box) return;
  var sl=box.querySelectorAll(".sl"), dots=box.querySelectorAll(".sdots i"),
      cap=document.getElementById("scap"), caps=[], i=0;
  if(sl.length<2){ return; }
  caps = Array.prototype.map.call(sl, function(el){ return el.getAttribute("data-cap")||""; });
  function show(n){
    i=((n%sl.length)+sl.length)%sl.length;
    for(var k=0;k<sl.length;k++) sl[k].className = "sl"+(k===i?" on":"");
    for(var k=0;k<dots.length;k++) dots[k].className = (k===i?"on":"");
    if(cap) cap.textContent = caps[i]||"";
    fitBox(box, i);
  }
  for(var k=0;k<dots.length;k++)(function(k){
    dots[k].addEventListener("click",function(e){ e.stopPropagation(); show(k); reset(); });
  })(k);
  var sx=null;
  box.addEventListener("touchstart",function(e){ sx=e.touches[0].clientX; },{passive:true});
  box.addEventListener("touchend",function(e){
    if(sx===null) return;
    var dx=(e.changedTouches[0].clientX-sx); sx=null;
    if(Math.abs(dx)>45){ show(i+(dx<0?1:-1)); reset(); }
  });
  fitBox(box, 0);
  window.addEventListener("resize", function(){ fitBox(box, i); });
  box.addEventListener("click", function(e){
    if(e.target && e.target.closest && e.target.closest(".sdots")) return;
    var go = sl[i] && sl[i].getAttribute("data-goto");
    if(go) location.hash = go;
  });
  function reset(){ if(SLIDE_TIMER) clearInterval(SLIDE_TIMER);
    SLIDE_TIMER=setInterval(function(){ show(i+1); }, 4800); }
  reset();
}

/* Dish videos: silent autoplay while they are on screen, tap for full screen
   with sound. Muted is not a choice — no browser autoplays audio. */
function wireVideos(){
  var vs = main.querySelectorAll("video.dv");
  if(!vs.length) return;
  function play(v){ var p=v.play(); if(p && p.catch) p.catch(function(){}); }
  if("IntersectionObserver" in window){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(e.isIntersecting) play(e.target);
        else { try{ e.target.pause(); }catch(x){} }
      });
    },{threshold:.3});
    Array.prototype.forEach.call(vs,function(v){ io.observe(v); });
  }else{
    Array.prototype.forEach.call(vs,function(v){ play(v); });
  }
  Array.prototype.forEach.call(main.querySelectorAll(".vcard"),function(card){
    var v = card.querySelector("video.dv");
    if(!v) return;
    card.addEventListener("click",function(){ fullScreen(v); });
  });
}
function fullScreen(v){
  try{ v.muted = false; }catch(e){}
  var f = v.requestFullscreen || v.webkitRequestFullscreen ||
          v.webkitEnterFullscreen || v.msRequestFullscreen;
  if(f){ try{ f.call(v); }catch(e){} }
  var p = v.play(); if(p && p.catch) p.catch(function(){ v.muted = true; v.play(); });
}
document.addEventListener("fullscreenchange", function(){
  if(document.fullscreenElement) return;
  Array.prototype.forEach.call(document.querySelectorAll("video.dv"),function(v){
    v.muted = true;                      /* back in the page: silent again */
  });
});

}

/* ===== WELCOME VIDEO OVERLAY =====================================
   Full-screen clips that play when a new guest sits down.
   Swipe UP  -> the menu.  Swipe LEFT/RIGHT -> next / previous clip.
   Comes back on its own after the tablet has been idle a while, so
   the next table gets the same welcome. ================================ */
var INTRO = (function(){
  var cfg   = (C && C.intro) || {};
  var el    = document.getElementById("intro");
  var track = document.getElementById("introtrack");
  var dots  = document.getElementById("introdots");
  var bSnd  = document.getElementById("introsound");
  var bSkip = document.getElementById("introskip");
  var hint  = document.getElementById("introhinttxt");
  var KEY   = "hayat_intro_seen";

  var clips = [], posters = [];
  try{
    clips = (cfg.clips || []).filter(function(s){ return s && String(s).indexOf("PUT_")!==0; });
    posters = cfg.posters || [];
  }catch(e){ clips = []; }

  var idx = 0, vids = [], built = false, live = false, muted = true;
  var lastTouch = Date.now(), armed = false;

  function gapMs(){
    var m = (cfg.showAgainAfterMin == null) ? 15 : Number(cfg.showAgainAfterMin);
    return (m > 0 ? m : 0) * 60000;
  }
  function stamp(){ try{ localStorage.setItem(KEY, String(Date.now())); }catch(e){} }
  function lastSeen(){ try{ return Number(localStorage.getItem(KEY)) || 0; }catch(e){ return 0; } }

  function srcTag(url, type){
    var s = document.createElement("source");
    s.src = url; s.type = type; return s;
  }
  function build(){
    if(built || !el || !clips.length) return;
    track.innerHTML = "";
    vids = clips.map(function(src,i){
      var s = document.createElement("div"); s.className = "introslide";
      var v = document.createElement("video");
      /* mp4 first (iOS, Android Chrome), webm as a fallback for browsers
         built without H.264. Same clip, both formats sit in intro/. */
      var alt = String(src).replace(/\.mp4$/i, ".webm");
      v.appendChild(srcTag(src, "video/mp4"));
      if(alt !== src) v.appendChild(srcTag(alt, "video/webm"));
      if(posters[i]) v.poster = posters[i];
      v.muted = true; v.defaultMuted = true; v.playsInline = true;
      v.setAttribute("playsinline",""); v.setAttribute("webkit-playsinline","");
      v.preload = i === 0 ? "auto" : "metadata";
      v.addEventListener("ended", function(){
        if(cfg.autoAdvance === false){ try{ v.currentTime = 0; v.play(); }catch(e){} }
        else go(idx + 1);
      });
      v.addEventListener("error", function(){
        v.dataset.bad = "1";
        /* if every clip is unplayable, get out of the way rather than
           trapping the guest on a black screen */
        if(vids.every(function(x){ return x.dataset.bad; })){ close(); return; }
        go(idx + 1);
      });
      s.appendChild(v); track.appendChild(s);
      return v;
    });
    dots.innerHTML = clips.map(function(_,i){
      return '<i class="' + (i ? "" : "on") + '"></i>';
    }).join("");
    built = true;
  }

  function paint(){
    track.style.transform = "translateX(" + (-idx * 100) + "%)";
    var ds = dots.children;
    for(var i = 0; i < ds.length; i++) ds[i].className = (i === idx ? "on" : "");
    vids.forEach(function(v,i){
      if(i === idx){
        playCur();
        var nx = vids[i+1]; if(nx && nx.preload !== "auto") nx.preload = "auto";
      }else{
        try{ v.pause(); v.currentTime = 0; }catch(e){}
      }
    });
  }
  /* Sound on by default. Browsers may still refuse to start audio without a
     tap — when that happens we drop to muted and unmute on the first touch. */
  var armedSnd = false;
  function playCur(){
    var v = vids[idx]; if(!v) return;
    v.muted = muted;
    try{ v.volume = 1; }catch(e){}
    var p = v.play();
    if(p && p.catch) p.catch(function(){
      /* the browser refused audio without a tap. Play silently, make the
         sound button obvious, and turn the sound on at the first touch. */
      muted = true; v.muted = true; label(); armUnmute();
      var q = v.play(); if(q && q.catch) q.catch(function(){});
    });
    if(muted) armUnmute();      /* muted for any other reason? same deal */
  }
  function armUnmute(){
    if(armedSnd) return; armedSnd = true;
    var f = function(){
      document.removeEventListener("pointerdown", f, true);
      document.removeEventListener("touchstart", f, true);
      armedSnd = false;
      if(!live) return;
      muted = false;
      var v = vids[idx];
      if(v){ v.muted = false; var p = v.play(); if(p && p.catch) p.catch(function(){}); }
      label();
    };
    document.addEventListener("pointerdown", f, true);
    document.addEventListener("touchstart", f, true);
  }
  function go(n){
    if(!clips.length) return;
    idx = ((n % clips.length) + clips.length) % clips.length;
    track.classList.remove("nosnap");
    paint();
  }

  function open(force){
    if(!el || !clips.length) return;
    if(!force && !shouldShow()) return;
    build();
    idx = 0; muted = (cfg.sound === false);
    label();
    el.hidden = false;
    void el.offsetWidth;                 // force reflow so the transition runs
    el.classList.remove("gone");
    document.body.style.overflow = "hidden";
    live = true;
    paint();
  }
  function close(){
    if(!live) return;
    live = false;
    el.classList.add("gone");
    stamp();
    vids.forEach(function(v){ try{ v.pause(); }catch(e){} });
    document.body.style.overflow = "";
    setTimeout(function(){ if(!live) el.hidden = true; }, 520);
  }
  function shouldShow(){
    if(cfg.enabled === false || !clips.length) return false;
    if(cfg.showEveryLoad) return true;   // play on every load / refresh
    var last = lastSeen();
    if(!last) return true;
    var g = gapMs();
    if(!g) return false;                 // showAgainAfterMin: 0  -> once per tablet
    return (Date.now() - last) > g;
  }

  function label(){
    try{
      bSkip.innerHTML = T("introSkip") + " &rarr;";
      bSnd.innerHTML  = (muted ? "&#128263; " : "&#128266; ") + T(muted ? "introSound" : "introMuted");
      bSnd.classList.toggle("pulse", !!muted);
      hint.textContent = T("introSwipe");
    }catch(e){}
  }

  /* ---- gestures ---- */
  var sx = 0, sy = 0, dx = 0, dy = 0, dragging = false, axis = "";
  function down(e){
    if(!live) return;
    var t = e.touches ? e.touches[0] : e;
    sx = t.clientX; sy = t.clientY; dx = dy = 0; dragging = true; axis = "";
    track.classList.add("nosnap");
  }
  function move(e){
    if(!dragging || !live) return;
    var t = e.touches ? e.touches[0] : e;
    dx = t.clientX - sx; dy = t.clientY - sy;
    if(!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8))
      axis = Math.abs(dy) > Math.abs(dx) ? "y" : "x";
    if(axis === "x"){
      track.style.transform = "translateX(calc(" + (-idx * 100) + "% + " + dx + "px))";
    }else if(axis === "y" && dy < 0){
      el.style.transform = "translateY(" + Math.max(dy, -260) + "px)";
      el.style.opacity = String(Math.max(0, 1 + dy / 420));
    }
    if(e.cancelable) e.preventDefault();
  }
  function up(){
    if(!dragging) return;
    dragging = false;
    el.style.transform = ""; el.style.opacity = "";
    if(axis === "y" && dy < -70){ close(); return; }
    if(axis === "x" && Math.abs(dx) > 55) go(idx + (dx < 0 ? 1 : -1));
    else go(idx);
    axis = "";
  }
  if(el){
    el.addEventListener("touchstart", down, {passive:true});
    el.addEventListener("touchmove",  move, {passive:false});
    el.addEventListener("touchend",   up);
    el.addEventListener("touchcancel",up);
    el.addEventListener("mousedown",  down);
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup",   up);
    el.addEventListener("wheel", function(e){ if(live && e.deltaY > 12) close(); }, {passive:true});
    bSkip.addEventListener("click", function(e){ e.stopPropagation(); close(); });
    bSnd.addEventListener("click",  function(e){
      e.stopPropagation(); muted = !muted;
      var v = vids[idx]; if(v){ v.muted = muted; if(!muted){ var p = v.play(); if(p&&p.catch) p.catch(function(){}); } }
      label();
    });
    window.addEventListener("keydown", function(e){
      if(!live) return;
      if(e.key === "Escape" || e.key === "ArrowUp") close();
      if(e.key === "ArrowRight") go(idx + 1);
      if(e.key === "ArrowLeft")  go(idx - 1);
    });
  }

  /* ---- replay button on the home screen ---- */
  document.addEventListener("click", function(e){
    var b = e.target && e.target.closest && e.target.closest("#introreplay");
    if(b){ e.preventDefault(); open(true); }
  });

  /* ---- idle: bring it back for the next table ---- */
  ["touchstart","mousedown","keydown","scroll"].forEach(function(ev){
    window.addEventListener(ev, function(){ lastTouch = Date.now(); }, {passive:true});
  });
  setInterval(function(){
    if(live || !gapMs() || cfg.enabled === false) return;
    if(Date.now() - lastTouch < gapMs()) return;
    lastTouch = Date.now();
    if(location.hash && location.hash !== "#/") location.hash = "#/";
    open(true);
  }, 20000);

  function sound(on){
    muted = !on;
    var v = vids[idx];
    if(v){ v.muted = muted; var p = v.play(); if(p && p.catch) p.catch(function(){}); }
    label();
  }
  return { open:open, close:close, relabel:label, sound:sound,
           has:function(){ return clips.length > 0; } };
})();

try{ INTRO.open(false); }catch(e){}

/* ===== FULL SCREEN =================================================
   A tablet on a table should show the menu, not Chrome. Browsers only
   grant full screen off a real tap, so we take the first one. Installed
   as an app it is already full screen and none of this runs. */
(function(){
  var want = C.fullscreen !== false;
  var el = document.documentElement;
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function enter(){
    if(isFs()) return;
    var f = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if(f){ try{ f.call(el); }catch(e){} }
  }
  function exit(){
    var f = document.exitFullscreen || document.webkitExitFullscreen;
    if(f){ try{ f.call(document); }catch(e){} }
  }
  var btn = document.getElementById("fsbtn");
  if(btn) btn.onclick = function(){ isFs() ? exit() : enter(); };
  if(!want) return;
  /* already an installed app? then it is full screen already */
  if(window.matchMedia && window.matchMedia("(display-mode: fullscreen)").matches) return;
  var once = function(){
    document.removeEventListener("pointerdown", once, true);
    document.removeEventListener("touchstart", once, true);
    document.removeEventListener("keydown", once, true);
    enter();
    /* the same tap unblocks audio — hand it to the intro if it is running */
    try{ if(window.INTRO && window.INTRO.sound) window.INTRO.sound(true); }catch(e){}
  };
  document.addEventListener("pointerdown", once, true);
  document.addEventListener("touchstart", once, true);
  document.addEventListener("keydown", once, true);
})();
