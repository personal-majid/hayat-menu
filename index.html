/* Chrome can offer the install before shop.js has finished parsing,
   and the offer is gone if nobody is listening. Catch it here, in
   the head, and hold it for whoever wants it. */
window.__hayatOffer = null;
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  window.__hayatOffer = e;
  try{ window.dispatchEvent(new Event("hayat-offer")); }catch(err){}
});

<!-- ============================================================
     BUILT-IN DEFAULTS
     Everything below is a copy of icons.js / lang.js / config.js /
     menu-data.js, inlined so the menu still works if one of those
     files fails to load on a phone. The real files load after this

<script>/* defaults from assets/qr.js */
/* ============================================================
   Tiny QR encoder — byte mode, ECC level L, versions 1..10.
   Enough for any Instagram / WhatsApp / Google URL.

   Why this exists: you will post hundreds of reels. Paste the URL
   into config.js and the code is drawn in the browser. No files to
   generate, nothing to upload, works offline.

   window.qrSvg(text, size)  ->  a data: URI you can put in <img src>
   ============================================================ */
(function () {

  /* ---- Galois field GF(256) ---- */
  var EXP = new Uint8Array(512), LOG = new Uint8Array(256);
  (function () {
    var x = 1;
    for (var i = 0; i < 255; i++) {
      EXP[i] = x; LOG[x] = i;
      x <<= 1; if (x & 0x100) x ^= 0x11d;
    }
    for (i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  })();
  function mul(a, b) { return (a === 0 || b === 0) ? 0 : EXP[LOG[a] + LOG[b]]; }

  /* ---- Reed–Solomon ---- */
  function rsPoly(n) {
    var p = [1];
    for (var i = 0; i < n; i++) {
      var q = p.concat([0]);
      for (var j = 0; j < p.length; j++) q[j + 1] ^= mul(p[j], EXP[i]);
      p = q;
    }
    return p;
  }
  function rsEncode(data, ecLen) {
    var gen = rsPoly(ecLen), res = new Array(ecLen).fill(0);
    for (var i = 0; i < data.length; i++) {
      var factor = data[i] ^ res[0];
      res.shift(); res.push(0);
      for (var j = 0; j < ecLen; j++) res[j] ^= mul(gen[j + 1], factor);
    }
    return res;
  }

  /* ---- capacity tables, ECC level L, versions 1..10 ----
     [ total codewords, ec codewords per block, block counts ]        */
  var VER = {
    1:  { tot: 26,  ec: 7,  g1: 1, d1: 19 },
    2:  { tot: 44,  ec: 10, g1: 1, d1: 34 },
    3:  { tot: 70,  ec: 15, g1: 1, d1: 55 },
    4:  { tot: 100, ec: 20, g1: 1, d1: 80 },
    5:  { tot: 134, ec: 26, g1: 1, d1: 108 },
    6:  { tot: 172, ec: 18, g1: 2, d1: 68 },
    7:  { tot: 196, ec: 20, g1: 2, d1: 78 },
    8:  { tot: 242, ec: 24, g1: 2, d1: 97 },
    9:  { tot: 292, ec: 30, g1: 2, d1: 116 },
    10: { tot: 346, ec: 18, g1: 2, d1: 68, g2: 2, d2: 69 }
  };
  var ALIGN = {
    1: [], 2: [6, 18], 3: [6, 22], 4: [6, 26], 5: [6, 30],
    6: [6, 34], 7: [6, 22, 38], 8: [6, 24, 42], 9: [6, 26, 46], 10: [6, 28, 50]
  };

  function utf8(str) {
    var out = [], s = encodeURIComponent(str);
    for (var i = 0; i < s.length; i++) {
      if (s[i] === "%") { out.push(parseInt(s.substr(i + 1, 2), 16)); i += 2; }
      else out.push(s.charCodeAt(i));
    }
    return out;
  }

  function build(text) {
    var bytes = utf8(text), ver = 0, spec = null;
    for (var v = 1; v <= 10; v++) {
      var s = VER[v];
      var cap = s.g1 * s.d1 + (s.g2 || 0) * (s.d2 || 0);
      var lenBits = v < 10 ? 8 : 16;
      if ((4 + lenBits + bytes.length * 8) <= cap * 8) { ver = v; spec = s; break; }
    }
    if (!ver) throw new Error("QR: text too long");

    /* --- bit stream --- */
    var bits = [];
    function push(val, n) { for (var i = n - 1; i >= 0; i--) bits.push((val >> i) & 1); }
    push(4, 4);                                   // byte mode
    push(bytes.length, ver < 10 ? 8 : 16);
    for (var i = 0; i < bytes.length; i++) push(bytes[i], 8);

    var capBits = (spec.g1 * spec.d1 + (spec.g2 || 0) * (spec.d2 || 0)) * 8;
    for (i = 0; i < 4 && bits.length < capBits; i++) bits.push(0);
    while (bits.length % 8) bits.push(0);
    var pad = [0xEC, 0x11], k = 0;
    while (bits.length < capBits) { push(pad[k++ % 2], 8); }

    var codes = [];
    for (i = 0; i < bits.length; i += 8) {
      var b = 0; for (var j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
      codes.push(b);
    }

    /* --- split into blocks, add EC --- */
    var blocks = [], ecs = [], p = 0, bi;
    for (bi = 0; bi < spec.g1; bi++) { blocks.push(codes.slice(p, p + spec.d1)); p += spec.d1; }
    for (bi = 0; bi < (spec.g2 || 0); bi++) { blocks.push(codes.slice(p, p + spec.d2)); p += spec.d2; }
    for (bi = 0; bi < blocks.length; bi++) ecs.push(rsEncode(blocks[bi], spec.ec));

    var out = [], maxD = Math.max.apply(null, blocks.map(function (b) { return b.length; }));
    for (i = 0; i < maxD; i++)
      for (bi = 0; bi < blocks.length; bi++)
        if (i < blocks[bi].length) out.push(blocks[bi][i]);
    for (i = 0; i < spec.ec; i++)
      for (bi = 0; bi < ecs.length; bi++) out.push(ecs[bi][i]);

    /* --- matrix --- */
    var n = ver * 4 + 17;
    var m = [], reserved = [];
    for (i = 0; i < n; i++) { m.push(new Array(n).fill(0)); reserved.push(new Array(n).fill(0)); }

    function finder(r, c) {
      for (var dr = -1; dr <= 7; dr++) for (var dc = -1; dc <= 7; dc++) {
        var rr = r + dr, cc = c + dc;
        if (rr < 0 || cc < 0 || rr >= n || cc >= n) continue;
        var on = (dr >= 0 && dr <= 6 && (dc === 0 || dc === 6)) ||
                 (dc >= 0 && dc <= 6 && (dr === 0 || dr === 6)) ||
                 (dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4);
        m[rr][cc] = on ? 1 : 0; reserved[rr][cc] = 1;
      }
    }
    finder(0, 0); finder(0, n - 7); finder(n - 7, 0);

    var al = ALIGN[ver];
    for (i = 0; i < al.length; i++) for (var jj = 0; jj < al.length; jj++) {
      var r = al[i], c = al[jj];
      if (reserved[r] && reserved[r][c]) continue;
      for (var dr2 = -2; dr2 <= 2; dr2++) for (var dc2 = -2; dc2 <= 2; dc2++) {
        m[r + dr2][c + dc2] = (Math.abs(dr2) === 2 || Math.abs(dc2) === 2 ||
                               (dr2 === 0 && dc2 === 0)) ? 1 : 0;
        reserved[r + dr2][c + dc2] = 1;
      }
    }
    for (i = 8; i < n - 8; i++) {
      m[6][i] = (i % 2 === 0) ? 1 : 0; reserved[6][i] = 1;
      m[i][6] = (i % 2 === 0) ? 1 : 0; reserved[i][6] = 1;
    }
    m[n - 8][8] = 1; reserved[n - 8][8] = 1;                 // dark module
    for (i = 0; i < 9; i++) {
      if (!reserved[8][i]) reserved[8][i] = 1;
      if (!reserved[i][8]) reserved[i][8] = 1;
    }
    for (i = 0; i < 8; i++) { reserved[8][n - 1 - i] = 1; reserved[n - 1 - i][8] = 1; }

    /* --- place data, zig-zag --- */
    var idx = 0, bit = 0, up = true;
    for (var col = n - 1; col > 0; col -= 2) {
      if (col === 6) col--;
      for (var t = 0; t < n; t++) {
        var row = up ? (n - 1 - t) : t;
        for (var s2 = 0; s2 < 2; s2++) {
          var cc2 = col - s2;
          if (reserved[row][cc2]) continue;
          var v2 = 0;
          if (idx < out.length) v2 = (out[idx] >> (7 - bit)) & 1;
          m[row][cc2] = v2;
          bit++; if (bit === 8) { bit = 0; idx++; }
        }
      }
      up = !up;
    }

    /* --- masking --- */
    function maskFn(k, r, c) {
      switch (k) {
        case 0: return (r + c) % 2 === 0;
        case 1: return r % 2 === 0;
        case 2: return c % 3 === 0;
        case 3: return (r + c) % 3 === 0;
        case 4: return (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0;
        case 5: return ((r * c) % 2 + (r * c) % 3) === 0;
        case 6: return (((r * c) % 2 + (r * c) % 3) % 2) === 0;
        default: return (((r + c) % 2 + (r * c) % 3) % 2) === 0;
      }
    }
    function penalty(g) {
      var pen = 0, r, c, run, dark = 0;
      for (r = 0; r < n; r++) {
        run = 1;
        for (c = 1; c < n; c++) {
          if (g[r][c] === g[r][c - 1]) { run++; }
          else { if (run >= 5) pen += 3 + (run - 5); run = 1; }
        }
        if (run >= 5) pen += 3 + (run - 5);
      }
      for (c = 0; c < n; c++) {
        run = 1;
        for (r = 1; r < n; r++) {
          if (g[r][c] === g[r - 1][c]) { run++; }
          else { if (run >= 5) pen += 3 + (run - 5); run = 1; }
        }
        if (run >= 5) pen += 3 + (run - 5);
      }
      for (r = 0; r < n - 1; r++) for (c = 0; c < n - 1; c++)
        if (g[r][c] === g[r][c + 1] && g[r][c] === g[r + 1][c] && g[r][c] === g[r + 1][c + 1]) pen += 3;
      for (r = 0; r < n; r++) for (c = 0; c < n; c++) if (g[r][c]) dark++;
      pen += Math.floor(Math.abs(dark * 100 / (n * n) - 50) / 5) * 10;
      return pen;
    }

    var best = null, bestPen = Infinity, bestMask = 0;
    for (var mk = 0; mk < 8; mk++) {
      var g = m.map(function (row2) { return row2.slice(); });
      for (r = 0; r < n; r++) for (c = 0; c < n; c++)
        if (!reserved[r][c] && maskFn(mk, r, c)) g[r][c] ^= 1;
      /* format info for ECC L + this mask */
      var fmt = (0x01 << 3) | mk;               // 01 = level L
      var rem = fmt;
      for (i = 0; i < 10; i++) rem = (rem << 1) ^ (((rem >> 9) & 1) * 0x537);
      var format = ((fmt << 10) | rem) ^ 0x5412;
      for (i = 0; i < 15; i++) {
        var bitv = (format >> i) & 1;
        if (i < 6) g[i][8] = bitv;
        else if (i < 8) g[i + 1][8] = bitv;
        else if (i === 8) g[8][7] = bitv;
        else g[8][14 - i] = bitv;
        if (i < 8) g[8][n - 1 - i] = bitv;
        else g[n - 15 + i][8] = bitv;
      }
      g[n - 8][8] = 1;
      var pn = penalty(g);
      if (pn < bestPen) { bestPen = pn; best = g; bestMask = mk; }
    }
    return best;
  }

  window.qrMatrix = build;

  window.qrSvg = function (text, size) {
    size = size || 640;
    var m, n;
    try { m = build(text); n = m.length; }
    catch (e) { return ""; }
    var quiet = 4, total = n + quiet * 2, cell = size / total, d = "";
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        if (!m[r][c]) continue;
        var x = (c + quiet) * cell, y = (r + quiet) * cell;
        d += "M" + x.toFixed(2) + " " + y.toFixed(2) +
             "h" + cell.toFixed(2) + "v" + cell.toFixed(2) + "h-" + cell.toFixed(2) + "z";
      }
    }
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size +
      '" viewBox="0 0 ' + size + ' ' + size + '">' +
      '<rect width="' + size + '" height="' + size + '" fill="#fff"/>' +
      '<path d="' + d + '" fill="#1A1008"/></svg>';
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  };
})();

</script>
<script>/* defaults from assets/icons.js */
/* ============================================================
   HAYAT — DISH ILLUSTRATIONS
   Vector artwork used for every menu item that has no photo yet.
   Crisp at any size, works offline, ~0 KB to load.

   You do not need to edit this file. To replace an illustration
   with a real photo, set  img:"photos/whatever.jpg"  on the item
   in menu-data.js — the photo wins automatically.
   ============================================================ */
(function(){

const P = {
  plate:"#E8DFC8", plateDk:"#BFB093",
  rice:"#EBD9A8", riceDk:"#D2B877",
  meat:"#8E4A22", meatDk:"#6B3416", meatLt:"#B4652F",
  char:"#4A2A16",
  bowl:"#2E4E63", bowlDk:"#1E3648", bowlLt:"#456E88",
  clay:"#8A4B2A", clayDk:"#63321A",
  bread:"#E3C98F", breadDk:"#C4A566",
  glass:"rgba(255,255,255,.20)", glassEdge:"rgba(255,255,255,.42)",
  green:"#79B54A", cream:"#F6EFDD", choc:"#5A3620"
};

/* rounded warm backdrop shared by every icon */
function bg(a,b){
  return `<defs>
    <linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".28" r=".72">
      <stop offset="0" stop-color="rgba(255,225,170,.16)"/>
      <stop offset="1" stop-color="rgba(255,225,170,0)"/></radialGradient>
  </defs>
  <rect x="-60" y="-10" width="220" height="120" fill="url(#bgg)"/>
  <rect x="-60" y="-10" width="220" height="120" fill="url(#glow)"/>`;
}
const plate = (y=72)=>`<ellipse cx="50" cy="${y}" rx="36" ry="10" fill="${P.plateDk}"/>
  <ellipse cx="50" cy="${y-2}" rx="36" ry="10" fill="${P.plate}"/>`;
const bowlShape=(c,d)=>`<path d="M16 50 h68 a34 34 0 0 1 -68 0 z" fill="${d}"/>
  <path d="M18 52 h64 a32 30 0 0 1 -64 0 z" fill="${c}"/>
  <ellipse cx="50" cy="50" rx="34" ry="7" fill="${d}"/>
  <ellipse cx="50" cy="49" rx="31" ry="5.5" fill="rgba(0,0,0,.28)"/>`;
const tallGlass=(liquid,extra="")=>`
  <path d="M32 22 h36 l-4 56 a6 6 0 0 1 -6 5 h-16 a6 6 0 0 1 -6 -5 z" fill="${P.glass}"/>
  <path d="M34.5 34 h31 l-3.3 43 a4 4 0 0 1 -4 3.5 h-16.4 a4 4 0 0 1 -4 -3.5 z" fill="${liquid}"/>
  ${extra}
  <path d="M32 22 h36 l-4 56 a6 6 0 0 1 -6 5 h-16 a6 6 0 0 1 -6 -5 z"
    fill="none" stroke="${P.glassEdge}" stroke-width="2.2"/>
  <ellipse cx="50" cy="22" rx="18" ry="4.5" fill="rgba(255,255,255,.28)"/>`;
const straw=(c="#E8556B")=>`<rect x="56" y="8" width="5" height="26" rx="2.5" fill="${c}"
  transform="rotate(12 58 20)"/>`;
const mint=`<ellipse cx="38" cy="24" rx="8" ry="5" fill="${P.green}" transform="rotate(-25 38 24)"/>
  <ellipse cx="47" cy="20" rx="7" ry="4.5" fill="#8FD05C" transform="rotate(15 47 20)"/>`;
const steam=`<g stroke="rgba(255,255,255,.35)" stroke-width="2.6" stroke-linecap="round" fill="none">
  <path d="M40 34 q4 -6 0 -12"/><path d="M50 31 q4 -7 0 -14"/><path d="M60 34 q4 -6 0 -12"/></g>`;

const I = {

/* ---- rice & mandi ---- */

  <ellipse cx="50" cy="58" rx="30" ry="15" fill="${P.riceDk}"/>

  <ellipse cx="44" cy="46" rx="15" ry="11" fill="${P.meatDk}"/>

  <ellipse cx="40" cy="41" rx="6" ry="4" fill="${P.meatLt}"/>
  <ellipse cx="66" cy="52" rx="9" ry="7" fill="${P.meatDk}"/>

  <circle cx="30" cy="56" r="2.6" fill="#C6512F"/><circle cx="72" cy="61" r="2.2" fill="#7CA83F"/>`,

  <ellipse cx="36" cy="56" rx="17" ry="13" fill="${P.meatDk}"/>
  <ellipse cx="36" cy="54" rx="16" ry="12" fill="${tint||P.meat}"/>

  <path d="M50 30 q7 7 3 14 q9 -4 8 -14 q6 8 2 18 q-9 6 -18 0 q-4 -12 5 -18 z" fill="#E2892C"/>
  <path d="M52 36 q4 5 1 9 q5 -3 4 -9 q3 5 1 11 q-6 4 -11 0 q-2 -7 5 -11 z" fill="#F5C245"/>`,

/* ---- fried ---- */
broast:()=>`${bg("#3F2A12","#6E4A18")}${plate(76)}

   <path d="M30 66 q-9 -6 -6 -16 q3 -11 14 -10 q11 1 11 12 q0 9 -8 13 z" fill="#C98A34"/>

  </g>
  <g transform="translate(28,6)">
   <path d="M46 64 q-9 -6 -6 -16 q3 -11 14 -10 q11 1 11 12 q0 9 -8 13 z" fill="#C98A34"/>
   <path d="M48 60 q-6 -5 -4 -12 q3 -8 10 -7 q8 1 8 9 q0 7 -6 10 z" fill="#E6AC4E"/>

  <ellipse cx="52" cy="42" rx="13" ry="10" fill="#D89A3E"/>
  <ellipse cx="52" cy="40" rx="11" ry="8" fill="#EFB958"/>`,

/* ---- wok tossed / dragon ---- */

  <path d="M28 54 q10 -5 18 -1" stroke="#7CA83F" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M60 68 q8 -4 13 -1" stroke="#7CA83F" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="34" cy="66" r="3" fill="#F0C24A"/>`,

/* ---- gravy ---- */
curry:(tint)=>`${bg("#43290F","#70481B")}${bowlShape(P.clay,P.clayDk)}
  <ellipse cx="50" cy="50" rx="29" ry="5" fill="${tint||"#C9622A"}"/>

<script>
/* ANY uncaught error paints a readable screen instead of a white one */
window.onerror=function(msg,src,line,col,err){
  if(String(msg).indexOf("assets not loaded")>=0) return;
  try{
    var e=document.getElementById("crash");
    if(e) return;
    var d=document.createElement("div"); d.id="crash";
    d.setAttribute("style","position:fixed;inset:0;z-index:9999;overflow:auto;background:#140C06;"+
      "color:#F5F1DF;padding:30px 20px;font:15px/1.7 -apple-system,Segoe UI,Roboto,sans-serif");
    d.innerHTML="<div style='max-width:560px;margin:0 auto'>"+
      "<h2 style='color:#EFCE86'>Something broke loading the menu</h2>"+
      "<p style='color:#A28C6C'>Please screenshot this and send it over.</p>"+
      "<pre style='white-space:pre-wrap;word-break:break-word;background:rgba(255,255,255,.06);"+
      "border:1px solid rgba(201,162,75,.3);border-radius:12px;padding:14px;font-size:12.5px;color:#EFCE86'>"+
      String(msg)+"\n"+String(src||"")+":"+line+":"+col+"\n\n"+
      ((err&&err.stack)?String(err.stack).slice(0,700):"")+"\n\n"+navigator.userAgent+"</pre>"+
      "<button onclick=\"(async()=>{try{var r=await navigator.serviceWorker.getRegistrations();"+
      "for(var i=0;i<r.length;i++)await r[i].unregister();var k=await caches.keys();"+
      "for(var j=0;j<k.length;j++)await caches.delete(k[j]);}catch(e){};location.reload(true)})()\" "+
      "style='margin-top:16px;width:100%;min-height:52px;border-radius:14px;border:1px solid #C9A24B;"+
      "background:linear-gradient(135deg,#EFCE86,#C9A24B);color:#241608;font-weight:700;font-size:15px'>"+
      "Clear cache and reload</button></div>";
    document.body.appendChild(d);
  }catch(_){}
};
/* everything has a built-in default, so this should never fire */
if(!window.CONFIG||!window.MENU||!window.LANG||!window.iconSvg){
  document.body.innerHTML='<div style="padding:40px;color:#EFCE86;font:16px sans-serif;text-align:center">'+
    'Menu data failed to load. Please reload the page.</div>';
  throw new Error("assets not loaded");
}
const C=window.CONFIG, MENU=window.MENU;
const nav=document.getElementById("nav"), main=document.getElementById("main"),
      search=document.getElementById("search"), overlay=document.getElementById("overlay");
let VARIANT="Without Mandi", GTAB="photos", STARS=0;
/* "kiosk" = our tablet, so Google opens as a QR the guest scans.
   "own"   = they came from a printed card or the menu link on their own
             phone, where the Google box can open directly. */
let RATEMODE="kiosk";
/* "night" is the dark gold room, "garden" is the green of the printed flyer.
   The guest's choice is kept on that device; config.js sets the first one. */
let THEME="night";
/* "table" = the price list, "photo" = the picture cards. The guest flips
   between them from the header; the choice is remembered on the device. */
let VIEW = "table";
let L = localStorage0("hayatLang") || "en";
try{ VIEW = localStorage0("hayatView") === "photo" ? "photo" : "table"; }catch(e){}
try{
  THEME = localStorage0("hayatTheme") || ((C && C.theme==="garden") ? "garden" : "night");
  applyTheme();
}catch(e){}
function applyTheme(){
  document.documentElement.setAttribute("data-theme", THEME);
  var m=document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", THEME==="garden" ? "#243510" : "#100A05");
  var b=document.getElementById("themebtn");
  if(b) b.classList.toggle("on", THEME==="garden");
}
function localStorage0(k){ try{return window.localStorage.getItem(k)}catch(e){return null} }
function saveLang(v){ try{window.localStorage.setItem("hayatLang",v)}catch(e){} }
function T(k){
  var a = window.LANG.ui[L] && window.LANG.ui[L][k];
  if(a !== undefined && a !== null && a !== "") return a;
  var b = window.LANG.ui.en[k];
  if(b !== undefined && b !== null) return b;
  return k;
}
const NM = it => (L==="ml" && window.LANG.items[it.id]) || it.name;
const SN = c  => (L==="ml" && window.LANG.sections[c.id]) || c.name;
const OL = s  => (L==="ml" && window.LANG.opts[s]) || T(s) || s;
const IGURL="https://www.instagram.com/"+C.instagram+"/";

function applyChrome(){
  document.getElementById("tagline").textContent=C.tagline;
  document.getElementById("search").placeholder=T("search");
  document.getElementById("langbtn").textContent =
    (window.innerWidth<860) ? (L==="en" ? "അ" : "A") : T("langBtn");
  document.getElementById("galtxt").textContent=T("gallery");
  var vb=document.getElementById("viewbtn"), vt=document.getElementById("viewtxt");
  if(vb && vt){
    vb.classList.toggle("on", VIEW==="photo");
    vt.textContent = VIEW==="photo" ? T("viewPhotos") : T("viewList");
  }
  document.getElementById("fdel").textContent=T("homeDelivery");
  document.getElementById("fcat").textContent=T("catering");
  document.getElementById("frev").innerHTML='<span class="star">&#9733;</span> '+T("rateUs");
  document.documentElement.lang = L==="ml" ? "ml" : "en";
}
document.getElementById("fig").onclick=()=>{
  KIOSK ? qrSheet("insta") : openOut(IGURL);
};
document.getElementById("frev").onclick=()=>{
  STARS=0; search.value=""; location.hash = KIOSK ? "#/rate" : "#/review";
};
applyChrome();

/* ---------------- helpers ---------------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rup(v){
  if(v==null) return "—";
  if(typeof v!=="number"){ return (String(v).toUpperCase()==="MP") ? T("marketPrice") : String(v); }
  return "₹"+(Number.isInteger(v) ? v.toLocaleString("en-IN") : v.toFixed(2));
}
function lowest(it){
  if(it.price!=null) return it.price;
  if(it.opts){ const n=it.opts.map(o=>o[1]).filter(v=>typeof v==="number");
               return n.length?Math.min.apply(null,n):null; }
  if(it.matrix){ const n=it.matrix.rows.flatMap(r=>r[1]).filter(v=>typeof v==="number");
                 return n.length?Math.min.apply(null,n):null; }
  return null;
}
const telHref=n=>"tel:"+String(n).replace(/\s+/g,"");
const telShow=n=>String(n).replace(/^\+91/,"").replace(/(\d{5})(\d{5})/,"$1 $2");
function art(it,wide){return window.iconSvg(it.icon||"mandi",it.tint,wide)}
/* A dish with a real photograph gets the photograph. A dish that only has
   generated artwork gets a quiet branded panel — better an honest mark than a
   fake plate blown up to full width. */
function isArtOnly(it){
  try{ return (window.ART_ONLY||[]).indexOf(it.id) >= 0; }catch(e){ return false; }
}
function dishHero(it){
  if(!isArtOnly(it)) return '<div class="hero">'+pic(it,true)+'</div>';
  return '<div class="hero brandhero">'+
           '<img class="mark" src="assets/mark.png" alt="">'+
           '<div class="bs">'+esc(C.tagline||"")+'</div>'+
         '</div>';
}
function pic(it,wide){
  const fb=art(it||{},wide);
  return `<img loading="lazy" src="${(it&&it.img)||fb}" alt="${esc((it&&it.name)||"")}"
    onerror="this.onerror=null;this.src='${fb}'">`;
}
/* Dishes without a photograph get the mark, not a drawn plate. */
function media(it,wide){
  if(isArtOnly(it)) return '<span class="artmark"><img src="assets/mark.png" alt=""></span>';
  return pic(it,wide);
}
const thumb=it=>`<span class="thumb${isArtOnly(it)?" art":""}">${media(it)}</span>`;
const tagHtml=it=>(it.tags||[]).map(t=>
  `<span class="tag ${t}">${t==="star"?T("tagStar"):t==="hot"?T("tagHot"):T("tagVeg")}</span>`).join("");
function priceChips(it){
  if(it.matrix){
    const r=it.matrix.rows.find(x=>x[0]===VARIANT)||it.matrix.rows[0];
    return it.matrix.cols.map((c,i)=>r[1][i]==null?"":
      `<span class="cp"><b>${esc(T(c))}</b>${rup(r[1][i])}</span>`).join("");
  }
  if(it.opts) return it.opts.map(o=>`<span class="cp"><b>${esc(OL(o[0]))}</b>${rup(o[1])}</span>`).join("");
  return `<span class="cp">${rup(it.price)}</span>`;
}
function findItem(id){
  for(const c of MENU){ const it=c.items.find(x=>x.id===id); if(it) return [it,c]; }
  return null;
}
function upsellStrip(excludeCat){
  const ids=(C.upsell||[]).filter(id=>{const f=findItem(id);return f && f[1].id!==excludeCat;});
  if(!ids.length) return "";
  return `<h3 class="mini">${T("goesWith")}</h3><div class="ups">${ids.map(id=>{
    const [it,c]=findItem(id);
    return `<button class="upc" data-go="#/d/${c.id}/${it.id}">
      <div class="ph">${pic(it)}</div>
      <div class="b"><div class="n">${esc(NM(it))}</div>
      <div class="p">${it.price!=null?rup(it.price):rup(lowest(it))}</div></div></button>`;
  }).join("")}</div>`;
}
const isPlaceholder=u=>/REPLACE_ME/i.test(String(u));
const WA = (txt) => "https://wa.me/"+C.whatsapp+"?text="+encodeURIComponent(txt||C.whatsappText);

/* feedback is kept on this device and can be exported as a text file.
   A static site has no server to write to — see FEEDBACK.txt in the folder. */
function saveFeedback(rec){
  try{
    const k="hayatFeedback";
    const all=JSON.parse(localStorage.getItem(k)||"[]");
    all.push(rec); localStorage.setItem(k,JSON.stringify(all));
  }catch(e){}
}
function saveLead(rec){
  try{
    const all=JSON.parse(localStorage.getItem("hayatLeads")||"[]");
    all.push(rec); localStorage.setItem("hayatLeads",JSON.stringify(all));
  }catch(e){}
}
function exportAll(){
  let fb=[],ld=[];
  try{fb=JSON.parse(localStorage.getItem("hayatFeedback")||"[]")}catch(e){}
  try{ld=JSON.parse(localStorage.getItem("hayatLeads")||"[]")}catch(e){}
  if(!fb.length&&!ld.length){ alert("Nothing saved on this device yet."); return; }
  let t="HAYAT — SAVED ON THIS TABLET\n\n";
  t+="PARTY ENQUIRIES ("+ld.length+")\n=========================\n";
  ld.forEach(r=>{t+="\nDate saved : "+r.at+"\nName       : "+(r.name||"-")+
    "\nPHONE      : "+(r.phone||"-")+"\nOccasion   : "+(r.occasion||"-")+
    "\nEvent date : "+(r.when||"-")+"\nPeople     : "+(r.people||"-")+
    "\nNotes      : "+(r.notes||"-")+"\n-----------------------------------------\n";});
  t+="\n\nFEEDBACK ("+fb.length+")\n=========================\n";
  fb.forEach(r=>{t+="\nDate  : "+r.at+"\nStars : "+r.stars+"\nName  : "+(r.name||"-")+
    "\nPhone : "+(r.phone||"-")+"\nText  : "+(r.text||"-")+
    "\n-----------------------------------------\n";});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([t],{type:"text/plain"}));
  a.download="hayat-tablet-export.txt"; a.click();
}
function exportFeedback(){
  let all=[]; try{all=JSON.parse(localStorage.getItem("hayatFeedback")||"[]")}catch(e){}
  if(!all.length){ alert("No feedback saved on this device yet."); return; }
  const txt = all.map(r =>
    "-----------------------------------------\n"+
    "Date   : "+r.at+"\nStars  : "+r.stars+"\nName   : "+(r.name||"-")+
    "\nPhone  : "+(r.phone||"-")+"\nComment: "+(r.text||"-")).join("\n");
  const blob=new Blob(["HAYAT FEEDBACK\n"+all.length+" entries\n"+txt+"\n"],{type:"text/plain"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="hayat-feedback.txt"; a.click();
}

/* instagram-style reels: silent autoplay while on screen, tap to unmute */
function mountReels(root){
  const vids=[...root.querySelectorAll(".reel video")];
  if(!vids.length) return;
  if(!("IntersectionObserver" in window)){ vids.forEach(v=>{try{v.play()}catch(e){}}); return; }
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    const v=e.target;
    if(e.isIntersecting && e.intersectionRatio>0.6){ v.play().catch(()=>{}); }
    else { v.pause(); }
  }),{threshold:[0,0.6,1]});
  vids.forEach(v=>{
    v.muted=true; v.playsInline=true; v.loop=true;
    io.observe(v);
    v.closest(".reel").addEventListener("click",ev=>{
      if(ev.target.closest("a")) return;
      v.muted=!v.muted;
      const b=v.closest(".reel").querySelector(".sound");
      if(b) b.textContent = v.muted ? "🔇" : "🔊";
      const hint=v.closest(".reel").querySelector(".hint");
      if(hint) hint.style.opacity="0";
      if(!v.muted) vids.forEach(o=>{ if(o!==v) o.muted=true; });
      v.play().catch(()=>{});
    });
  });
}

/* ===== WHOSE SCREEN IS THIS? =======================================
   tablet : our tablet on the table. Instagram, WhatsApp and Google open
            as a QR code the guest scans, so the tablet never leaves the
            menu. Marked by  ?us  (or #/us) in the address, then
            remembered on that device for good.
   guest  : somebody's own phone, from the QR on the table or the card.
            Every link opens directly — they are already signed in to
            Instagram and Google there.
   The star page is always treated as the guest's own phone unless it is
   running on our tablet, where it falls back to a QR. */
var MODE = (function(){
  var q = (location.search || "") + " " + (location.hash || "");
  function remember(v){ try{ window.localStorage.setItem("hayatMode", v); }catch(e){} return v; }
  if(/[?&]us\b/.test(location.search) || /#\/us\b/.test(location.hash)) return remember("tablet");
  if(/[?&](guest|me)\b/.test(location.search))                            return remember("guest");
  var saved = null;
  try{ saved = window.localStorage.getItem("hayatMode"); }catch(e){}
  if(saved === "tablet" || saved === "guest") return saved;
  return (C.defaultMode === "tablet") ? "tablet" : "guest";
})();
const KIOSK = (MODE === "tablet");
/* #/us was only a marker — drop straight into the menu */
if(/#\/us\b/.test(location.hash)) location.hash = "#/";
var IG_OK = null;                      /* null = unknown, true/false after probe */
function igProbe(){
  if(!navigator.onLine){ IG_OK=false; return; }
  var done=false;
  var t=setTimeout(function(){ if(!done){ done=true; IG_OK=false; route(); } }, 3500);
  fetch("https://www.instagram.com/favicon.ico",{mode:"no-cors",cache:"no-store"})
    .then(function(){ if(done) return; done=true; clearTimeout(t);
      if(IG_OK!==true){ IG_OK=true; route(); } })
    .catch(function(){ if(done) return; done=true; clearTimeout(t);
      IG_OK=false; route(); });
}
function igNorm(x){
  if(!x) return null;
  var u = (typeof x === "string") ? x : x.url;
  if(!u || isPlaceholder(u)) return null;
  var m = String(u).match(/instagram\.com\/(p|reel|tv)\/([A-Za-z0-9_-]+)/);
  if(!m) return null;
  return { url:u, kind:m[1], code:m[2], title:(x && x.title) || "" };
}
function igList(){ return (C.trending||[]).map(igNorm).filter(Boolean); }

/* A guest's own phone: open the real app/site. window.open is blocked by
   several mobile browsers when it is not a plain anchor, and a blocked call
   leaves the guest staring at a dead tab — so fall back to a real navigation. */
function openOut(u){
  if(!u) return;
  var w=null;
  try{ w=window.open(u,"_blank","noopener"); }catch(e){ w=null; }
  if(!w || w.closed || typeof w.closed==="undefined"){ location.href=u; }
}
/* Tap a starter -> it lands on the clipboard, guest pastes it into Google
   and finishes the sentence. Never the whole review: identical text across
   reviews is what Google's filter removes. */
function copyText(t){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText)
      return navigator.clipboard.writeText(t).catch(function(){ legacyCopy(t); });
  }catch(e){}
  legacyCopy(t);
}
function legacyCopy(t){
  var a=document.createElement("textarea");
  a.value=t; a.setAttribute("readonly","");
  a.style.cssText="position:fixed;top:-1000px;opacity:0";
  document.body.appendChild(a); a.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(a);
}
function toast(msg){
  var t=document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add("on");
  clearTimeout(toast._t);
  toast._t=setTimeout(function(){ t.classList.remove("on"); },2200);
}
/* Android: hand the review to the Google Maps app if it is installed.
   The intent carries a browser fallback, so a phone without Maps — and
   every iPhone — simply lands on the same web page as before. QR codes
   always keep the plain https address; a scanner cannot read an intent. */
function nativeReview(u){
  if(!u || KIOSK) return u;
  if(!/Android/i.test(navigator.userAgent||"")) return u;
  if(!/^https:\/\//.test(u)) return u;
  return "intent://" + u.slice(8) +
         "#Intent;scheme=https;package=com.google.android.apps.maps;" +
         "S.browser_fallback_url=" + encodeURIComponent(u) + ";end";
}

   same page, guest mode, so the microphone and the share sheet work. */

/* Category tiles with more than one picture cycle through them. One timer
   drives every tile, so twenty categories cost the same as one. */
var TILE_TIMER=null;
/* Move the picture closest to the tile's own shape to the front. */
function leadWithBestFit(box){
  var imgs = box.querySelectorAll("img");
  if(imgs.length < 2) return;
  var done = 0;
  function pick(){
    if(++done < imgs.length) return;
    var best = 0, bestGap = 99;
    Array.prototype.forEach.call(imgs, function(im, i){
      if(!im.naturalWidth || !im.naturalHeight) return;
      var gap = Math.abs((im.naturalWidth/im.naturalHeight) - 1.6);
      if(gap < bestGap){ bestGap = gap; best = i; }
    });
    if(!best) return;
    box.insertBefore(imgs[best], imgs[0]);
    for(var k=0;k<imgs.length;k++) imgs[k].className = "";
    imgs[best].className = "on";
  }
  Array.prototype.forEach.call(imgs, function(im){
    if(im.complete) pick(); else { im.addEventListener("load", pick); im.addEventListener("error", pick); }
  });
}
function wireTiles(){
  if(TILE_TIMER){ clearInterval(TILE_TIMER); TILE_TIMER=null; }
  var sets = main.querySelectorAll(".tile .tsl");
  if(!sets.length) return;
  Array.prototype.forEach.call(sets, function(box){ leadWithBestFit(box); });
  var step = 0;
  TILE_TIMER = setInterval(function(){
    step++;
    Array.prototype.forEach.call(sets, function(box){
      var imgs = box.querySelectorAll("img");
      if(imgs.length < 2) return;
      var n = step % imgs.length;
      for(var k=0;k<imgs.length;k++) imgs[k].className = (k===n ? "on" : "");
      var dots = box.parentNode.querySelectorAll(".tdots i");
      for(var k=0;k<dots.length;k++) dots[k].className = (k===n ? "on" : "");
    });
  }, 3600);
}

     a "fake reviews removed" banner, or be suspended. Set
       review.gate: false
     in config.js and both doors come back for everybody.
     ------------------------------------------------------------------ */
  const GATE  = (R.gate !== false);
  const happy = !GATE || s>=4;

  const head5 = s>=5 ? T("revHead5") : s===4 ? T("revHead4")
              : s===3 ? T("revHead3") : T("revHead2");

  const google = own
    ? `<a class="revbtn primary" href="${esc(nativeReview(link))}" target="_blank" rel="noopener">

    : `<button class="revbtn primary" data-qr="review"><span class="g">G</span>${T("revOnGoogle")}</button>`;

          &#128247; ${T("fbAttach")}</label>
      </div>
      <div class="fblist" id="fbList"></div>` : "";

  /* Two steps on purpose. The first sends the words to our WhatsApp number,
     so the guest ends up holding our chat and knows exactly where anything
     else is going. Only then are they offered the microphone and camera. */
  const form = own ? `
      <p class="revsub" style="margin:0 0 14px">${T("revPrivateSub")}</p>

      <div id="fbStep1">
        <textarea class="fld" id="fbText" placeholder="${T("whatHappened")}"></textarea>
        <a class="revbtn primary" id="fbSave" href="#" target="_blank" rel="noopener">${T("sendFeedback")}</a>
        <p class="fbnote">${T("fbToNumber")} ${esc(telShow(C.whatsapp.replace(/^91/,"")))}</p>
      </div>

      <div id="fbStep2" hidden>
        <div class="fbdone">&#10003; ${T("fbSent")}</div>
        <p class="revsub" style="margin:0 0 12px">${T("fbStep2")}</p>
        ${media}
        <button class="revbtn primary" id="fbSend2" disabled>${T("fbSendMedia")}</button>
        <p class="fbnote" id="fbNote" hidden>${T("fbShareNote")}</p>
        <button class="revbtn ghost" id="fbSkip2">${T("fbNoThanks")}</button>
      </div>` : `
      <p class="revsub" style="margin:0 0 14px">${T("revPrivateSub")}</p>
      <textarea class="fld" id="fbText" placeholder="${T("whatHappened")}"></textarea>
      <button class="revbtn primary" id="fbSave">${T("sendFeedback")}</button>`;

  const happyPanel = `
      ${google}
      ${starters.length?`<div class="revstart"><b>${T("revStarters")}</b>
        ${starters.map((t,i)=>`<button class="stchip" data-start="${i}">${esc(t)}&#8230;</button>`).join("")}
        </div>`:""}
      ${topics.length?`<div class="revtopics"><b>${T("revTopics")}</b>
        ${topics.map(t=>`<span>${esc(t)}</span>`).join("")}</div>`:""}
      <div class="revphoto">&#128247; ${T("revPhoto")}</div>

      <button class="revbtn ghost" id="revPrivOpen">${T("revPrivate")}</button>
      <div class="revpriv" id="revPriv" hidden>${form}</div>`;

  /* On the tablet there is no point offering the microphone — the guest
     finishes this on their own phone, so we hand the page over by QR. */
  const lowPanel = own
    ? `<div class="revpriv" style="border:0;padding-top:0">${form}</div>`
    : `<p class="revsub">${T("revOnPhone")}</p>
       <button class="revbtn primary" data-qr="rate">${T("scanToPhone")}</button>`;

  const panel = s===0 ? `<p class="secsub">${T("rateSub")}</p>` : `
    <div class="revwrap">
      <h3 class="revh">${esc(head5)}</h3>
      <p class="revsub">${esc(sub)}</p>
      ${happy ? happyPanel : lowPanel}
    </div>`;

  main.innerHTML=
    backBar("#/",T("menu"),T("rateUs"))+
    head(T("rateTitle"),"")+
    `<div class="stars">${[1,2,3,4,5].map(n=>
      `<button data-star="${n}" class="${n<=s?"on":""}">&#9733;</button>`).join("")}</div>`+
    panel+
    backBottom("#/",T("backMenu"));

  const open=document.getElementById("revPrivOpen");
  const priv=document.getElementById("revPriv");
  if(open && priv) open.onclick=()=>{ priv.hidden=!priv.hidden; open.hidden=!priv.hidden; };

  wireFeedback(s);
  restoreScroll();
}

/* ---- the low-star form: typed, spoken, or shown ---------------------
   WhatsApp links carry text only — no attachment can be added to a
   wa.me address. Anything recorded or picked therefore goes out
   through the phone's own share sheet, where the guest taps WhatsApp
   and the files ride along. With nothing attached we fall back to the
   plain wa.me link, which is what the tablet always uses. */
let FBFILES=[], FBREC=null, FBCHUNKS=[];

function fbRender(){
  const box=document.getElementById("fbList");
  const note=document.getElementById("fbNote");
  if(note) note.hidden = !FBFILES.length;
  const go=document.getElementById("fbSend2");
  if(go) go.disabled = !FBFILES.length;
  if(!box) return;
  box.innerHTML = FBFILES.map((f,i)=>
    `<span class="fbchip">${f.type.indexOf("audio")===0?"&#127908;"
      :f.type.indexOf("video")===0?"&#127909;":"&#128247;"}
     ${esc(f.name.length>18?f.name.slice(0,16)+"\u2026":f.name)}
     <b data-fbdrop="${i}">&times;</b></span>`).join("");
}

function wireFeedback(s){
  FBFILES=[]; FBCHUNKS=[]; FBREC=null;

  const open=document.getElementById("revPrivOpen");
  const priv=document.getElementById("revPriv");
  if(open && priv) open.onclick=()=>{ priv.hidden=!priv.hidden; open.hidden=!priv.hidden; };

  const pick=document.getElementById("fbFiles");
  if(pick) pick.onchange=()=>{
    for(const f of pick.files||[]) FBFILES.push(f);
    pick.value=""; fbRender();
  };

  const list=document.getElementById("fbList");
  if(list) list.onclick=(e)=>{
    const d=e.target.closest("[data-fbdrop]");
    if(d){ FBFILES.splice(+d.dataset.fbdrop,1); fbRender(); }
  };

  const rec=document.getElementById("fbRec"), rtx=document.getElementById("fbRecTxt");
  if(rec) rec.onclick=async ()=>{
    if(FBREC && FBREC.state==="recording"){ FBREC.stop(); return; }
    if(!navigator.mediaDevices || !window.MediaRecorder){ toast(T("fbNoMic")); return; }
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      FBCHUNKS=[]; FBREC=new MediaRecorder(stream);
      FBREC.ondataavailable=ev=>{ if(ev.data && ev.data.size) FBCHUNKS.push(ev.data); };
      FBREC.onstop=()=>{
        stream.getTracks().forEach(t=>t.stop());
        const type=(FBREC.mimeType||"audio/webm").split(";")[0];
        const ext=type.indexOf("mp4")>=0?"m4a":"webm";
        FBFILES.push(new File(FBCHUNKS,"voice-note."+ext,{type:type}));
        rec.classList.remove("rec"); if(rtx) rtx.textContent=T("fbRecord");
        fbRender();
      };
      FBREC.start();
      rec.classList.add("rec"); if(rtx) rtx.textContent=T("fbStop");
    }catch(e){ toast(T("fbNoMic")); }
  };

  const thanks=()=>{
    main.innerHTML=backBar("#/",T("menu"),T("rateUs"))+
      `<div class="revwrap" style="text-align:center;padding:50px 20px">
        <div style="font-size:44px">&#128591;</div>
        <h3 class="revh">${T("revThanksTitle")}</h3>
        <p class="revsub">${T("saved")}</p></div>`+
      backBottom("#/",T("backMenu"));
    FBFILES=[];
    restoreScroll();
  };

  /* step one — the words, straight to our WhatsApp number.
     A real link, not a scripted popup: a blocked window.open would
     navigate this page away and the guest would lose step two. */
  const send=document.getElementById("fbSave");
  if(send) send.onclick=(e)=>{
    const rec2={ at:new Date().toLocaleString(), stars:s,
      text:(document.getElementById("fbText")||{}).value||"" };
    saveFeedback(rec2);
    const url=WA("Feedback for Hayat\nRating: "+s+"/5\n\n"+(rec2.text||"-"));
    const a=document.getElementById("fbStep1"), b=document.getElementById("fbStep2");
    if(send.tagName==="A"){
      send.href=url;
      if(a && b) setTimeout(()=>{ a.hidden=true; b.hidden=false; fbRender(); },0);
      return;
    }
    if(e && e.preventDefault) e.preventDefault();
    openOut(url);
    thanks();
  };

  /* step two — whatever they recorded or picked, through the share sheet */
  const send2=document.getElementById("fbSend2");
  if(send2) send2.onclick=async ()=>{
    if(FBREC && FBREC.state==="recording"){ FBREC.stop(); await new Promise(r=>setTimeout(r,320)); }
    if(!FBFILES.length) return;
    const msg="Feedback for Hayat \u00b7 "+s+"/5";
    let shared=false;
    if(navigator.share){
      try{
        if(!navigator.canShare || navigator.canShare({files:FBFILES})){
          await navigator.share({text:msg, files:FBFILES});
          shared=true;
        }
      }catch(e){ shared = (e && e.name==="AbortError"); }
    }
    if(!shared) toast(T("fbNoShare"));
    else thanks();
  };

  const skip=document.getElementById("fbSkip2");
  if(skip) skip.onclick=thanks;
}

/* Every section runs a slideshow across the top. Use the section's own
   slides:[...] if it has them, otherwise build one from the dish photos
   so no section is ever bare. */
function sectionSlides(c){
  if(c.slides && c.slides.length) return c.slides.filter(x=>x && x.src);
  var out=[], seen={};
  (c.items||[]).forEach(function(it){
    (it.photos||[]).forEach(function(p){ if(p&&p.src&&!seen[p.src]){ seen[p.src]=1;
      out.push({src:p.src, caption:p.caption||it.name}); } });
  });
  if(out.length < 2){
    (c.items||[]).forEach(function(it){
      if(it.img && !seen[it.img]){ seen[it.img]=1; out.push({src:it.img, caption:it.name}); }
    });
  }
  return out.slice(0,6);
}
function slideShow(c, small){
  var sl = (c && c.slidesOverride) || sectionSlides(c);
  if(!sl.length) return "";
  return '<div class="slides'+(small?" small":"")+'" id="slides">'+sl.map(function(x,i){
    return '<div class="sl'+(i?"":" on")+'" data-cap="'+esc(x.caption||"")+'"'+
           (x.go?' data-goto="'+esc(x.go)+'"':'')+
           ' style="--bgimg:url(\''+esc(x.src)+'\')">'+
           '<span class="blurbg"></span>'+
           '<img '+(i?'loading="lazy" ':'')+'src="'+esc(x.src)+'" alt=""></div>';
  }).join("")+
  '<div class="scap" id="scap">'+esc(sl[0].caption||"")+'</div>'+
  '<div class="sdots'+(sl.length>6?" many":"")+'">'+sl.map(function(x,i){
    return '<i class="'+(i?"":"on")+'" data-slide="'+i+'">'+(i+1)+' / '+sl.length+'</i>';
  }).join("")+'</div></div>';
}
/* Every banner in the whole menu, for the strip on the home page.
   Tapping one jumps straight to that section. */
function allSlides(){
  var out=[];
  MENU.forEach(function(c){
    (c.slides||[]).forEach(function(x){
      if(x && x.src) out.push({src:x.src, caption:x.caption||"", go:"#/c/"+c.id});
    });
  });
  return out;
}
var SLIDE_TIMER=null;
/* One height for the whole slideshow, worked out from the TALLEST picture in
   it. Sizing per slide made the page jump every few seconds as a short banner
   was replaced by a tall one. Nothing is cropped — the shorter ones simply sit
   in the middle of the frame. */
function fitBox(box){
  if(box.classList.contains("small")) return;     /* fixed band, set in CSS */
  var imgs = box.querySelectorAll(".sl img");
  if(!imgs.length) return;
  function apply(){
    var ratio = 99;
    Array.prototype.forEach.call(imgs, function(im){
      if(im.naturalWidth && im.naturalHeight)
        ratio = Math.min(ratio, im.naturalWidth / im.naturalHeight);
    });
    if(ratio === 99) return;                       /* nothing loaded yet */
    var w = box.clientWidth || box.getBoundingClientRect().width;
    if(!w) return;
    var cap = box.classList.contains("small") ? 0.26 : 0.40;
    var h = Math.min(w / Math.max(1.2, Math.min(3.4, ratio)), window.innerHeight * cap);
    box.style.aspectRatio = "auto";
    box.style.height = Math.round(h) + "px";
  }
  apply();
  Array.prototype.forEach.call(imgs, function(im){
    if(!im.complete){ im.addEventListener("load", apply); im.addEventListener("error", apply); }
  });
}
function wireSlides(){
  if(SLIDE_TIMER){ clearInterval(SLIDE_TIMER); SLIDE_TIMER=null; }
  var box=document.getElementById("slides"); if(!box) return;
  var sl=box.querySelectorAll(".sl"), dots=box.querySelectorAll(".sdots i"),
      cap=document.getElementById("scap"), caps=[], i=0;
  if(sl.length<2){ return; }
  caps = Array.prototype.map.call(sl, function(el){ return el.getAttribute("data-cap")||""; });
  function show(n){
    i=((n%sl.length)+sl.length)%sl.length;
    for(var k=0;k<sl.length;k++) sl[k].className = "sl"+(k===i?" on":"");
    for(var k=0;k<dots.length;k++) dots[k].className = (k===i?"on":"");
    if(cap) cap.textContent = caps[i]||"";
  }
  for(var k=0;k<dots.length;k++)(function(k){
    dots[k].addEventListener("click",function(e){ e.stopPropagation(); show(k); reset(); });
  })(k);
  var sx=null;
  box.addEventListener("touchstart",function(e){ sx=e.touches[0].clientX; },{passive:true});
  box.addEventListener("touchend",function(e){
    if(sx===null) return;
    var dx=(e.changedTouches[0].clientX-sx); sx=null;
    if(Math.abs(dx)>45){ show(i+(dx<0?1:-1)); reset(); }
  });
  fitBox(box);
  window.addEventListener("resize", function(){ fitBox(box); });
  box.addEventListener("click", function(e){
    if(e.target && e.target.closest && e.target.closest(".sdots")) return;
    var go = sl[i] && sl[i].getAttribute("data-goto");
    if(go) location.hash = go;
  });
  function reset(){ if(SLIDE_TIMER) clearInterval(SLIDE_TIMER);
    SLIDE_TIMER=setInterval(function(){ show(i+1); }, 4800); }
  reset();
}

/* Dish videos: silent autoplay while they are on screen, tap for full screen
   with sound. Muted is not a choice — no browser autoplays audio. */
function wireVideos(){
  var vs = main.querySelectorAll("video.dv");
  if(!vs.length) return;
  function play(v){ var p=v.play(); if(p && p.catch) p.catch(function(){}); }
  if("IntersectionObserver" in window){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(e.isIntersecting) play(e.target);
        else { try{ e.target.pause(); }catch(x){} }
      });
    },{threshold:.3});
    Array.prototype.forEach.call(vs,function(v){ io.observe(v); });
  }else{
    Array.prototype.forEach.call(vs,function(v){ play(v); });
  }
  Array.prototype.forEach.call(main.querySelectorAll(".vcard"),function(card){
    var v = card.querySelector("video.dv");
    if(!v) return;
    card.addEventListener("click",function(){ fullScreen(v); });
  });
}
function fullScreen(v){
  try{ v.muted = false; }catch(e){}
  var f = v.requestFullscreen || v.webkitRequestFullscreen ||
          v.webkitEnterFullscreen || v.msRequestFullscreen;
  if(f){ try{ f.call(v); }catch(e){} }
  var p = v.play(); if(p && p.catch) p.catch(function(){ v.muted = true; v.play(); });
}
document.addEventListener("fullscreenchange", function(){
  if(document.fullscreenElement) return;
  Array.prototype.forEach.call(document.querySelectorAll("video.dv"),function(v){
    v.muted = true;                      /* back in the page: silent again */
  });
});

        YT=(C.youtube||[]).filter(y=>y&&y.id&&y.id.indexOf("PASTE")<0),
        IG=igList();
  if(GTAB!=="photos" && GTAB!=="videos") GTAB="photos";

  let panel;
  if(GTAB==="photos"){
    panel = PH.length
      ? `<div class="mos">${PH.map(p=>`
          <button class="mtile" data-lb="${esc(p.src)}" data-cap="${esc(p.caption||"")}">
            <img loading="lazy" src="${esc(p.src)}" alt="">
            ${p.caption?`<div class="cap">${esc(p.caption)}</div>`:""}</button>`).join("")}</div>`
      : `<div class="nomedia"><b>No photos yet.</b><br>
         Drop jpg files into <code>gallery/</code> and list them in <code>config.js</code>
         under <code>gallery: { photos: [...] }</code>.</div>`;
  } else {
    const blocks=[];
    if(YT.length) blocks.push(`<div class="ygrid">${YT.map(y=>`
      <div><div class="yt"><iframe loading="lazy"
        src="https://www.youtube-nocookie.com/embed/${esc(y.id)}?rel=0&playsinline=1"
        allow="accelerometer;encrypted-media;gyroscope;picture-in-picture"
        allowfullscreen title="${esc(y.title||"")}"></iframe></div>
        ${y.title?`<div style="font-size:13px;color:var(--muted);margin-top:8px">${esc(y.title)}</div>`:""}
      </div>`).join("")}</div>`);
    if(RL.length) blocks.push(`<div class="reelrow" style="margin-top:16px">${reelCards(RL)}</div>`);
    if(IG.length) blocks.push(`<div class="igrow" style="margin-top:16px">${reelCards2(IG)}</div>`);
    if(VD.length) blocks.push(`<div class="ygrid" style="margin-top:16px">${VD.map(v=>`
      <div class="yt"><video src="${esc(v.src)}" ${v.poster?`poster="${esc(v.poster)}"`:""}
        controls playsinline preload="metadata" style="width:100%;height:100%;object-fit:cover"></video></div>`).join("")}</div>`);
    panel = blocks.length ? blocks.join("")
      : `<div class="nomedia"><b>${T("videosNone")}</b><br><br>
         <b style="color:#EFCE86">Two ways to get video playing right here:</b><br>
         1. YouTube — paste the video id into <code>config.js</code> under
            <code>youtube: [...]</code>. It plays inside this page.<br>
         2. Your own mp4 — drop it into <code>gallery/reels/</code> and list it under
            <code>reels: [...]</code>. Silent autoplay as you scroll, tap for sound.<br><br>
         Instagram embeds are deliberately not used here: tapping one opens the
         Instagram app instead of playing, which is wrong for a table tablet.</div>`;
  }

  main.innerHTML=
    backBar("#/",T("menu"),T("gallery"))+
    head(T("galleryTitle"),T("gallerySub"))+
    `<div class="gtabs">
       <button class="${GTAB==="photos"?"on":""}" data-tab="photos">&#9638; ${T("photos")}${PH.length?" "+PH.length:""}</button>
       <button class="${GTAB==="videos"?"on":""}" data-tab="videos">&#9654; ${T("videos")}${(YT.length+RL.length+VD.length+IG.length)?" "+(YT.length+RL.length+VD.length+IG.length):""}</button>
     </div>${panel}
     ${igBar(T("igFollow"),T("igFollowSub"))}`+
    backBottom("#/",T("backMenu"));
  mountReels(main);
  restoreScroll();
}

/* ---------------- routing ---------------- */
/* Remember where the guest was on every page, so coming back from a dish
   lands them exactly where they left instead of at the top. */
var SCROLLMEM = {}, CURHASH = location.hash || "#/", HOLDSCROLL = false;
main.addEventListener("scroll", function(){
  if(!HOLDSCROLL) SCROLLMEM[CURHASH] = main.scrollTop;
}, {passive:true});
function restoreScroll(){
  var h = location.hash || "#/";
  var y = SCROLLMEM[h] || 0;
  HOLDSCROLL = true; CURHASH = h;
  main.scrollTop = y;
  requestAnimationFrame(function(){
    main.scrollTop = y;
    setTimeout(function(){ main.scrollTop = y; HOLDSCROLL = false; }, 160);
  });
}

function route(){
  closeOverlay();                      /* a sheet must never survive a page change */
  if(search.value.trim()) return viewSearch(search.value.trim());
  const p=(location.hash||"#/").slice(2).split("/").filter(Boolean);
  /* cart, checkout, order tracking, the office and the rider all live in
     shop.js. It returns true when it has taken the page. */
  try{ if(window.SHOP && SHOP.route(p, main)){ drawNav(null); restoreScroll(); return; } }catch(e){}
  if(p[0]==="gallery") return viewGallery();
  if(p[0]==="rate")   { RATEMODE = KIOSK ? "kiosk" : "own"; return viewRate(); }
  if(p[0]==="review") { RATEMODE = KIOSK ? "kiosk" : "own"; return viewRate(); }
  if(p[0]==="party") return viewParty();
  if(p[0]==="c") return viewCat(p[1]);
  if(p[0]==="d") return viewDish(p[1],p[2]);
  viewHome();
}
document.addEventListener("click",e=>{
  if(e.target.closest("[data-close]")) return closeOverlay();
  const lb=e.target.closest("[data-lb]");   if(lb) return lightbox(lb.dataset.lb,lb.dataset.cap,false);
  const lv=e.target.closest("[data-lbv]");  if(lv) return lightbox(lv.dataset.lbv,lv.dataset.cap,true);
  const rl=e.target.closest("[data-reel]");
  if(rl){

      const r=igList()[+rl.dataset.reel];
      if(r) openOut(r.url);

  }
  const qr=e.target.closest("[data-qr]");

    if(!KIOSK){
      let u=qrTarget(qr.dataset.qr);
      if(qr.dataset.qr==="review") u=nativeReview(u);

    if(t){ copyText(t); toast(T("revCopied")); sc.classList.add("done"); }
    return;
  }

  const tb=e.target.closest("[data-tab]");  if(tb){GTAB=tb.dataset.tab;return viewGallery()}
  const v =e.target.closest("[data-var]");  if(v){VARIANT=v.dataset.var;return route()}
  const b =e.target.closest("[data-go]");   if(b){search.value="";location.hash=b.dataset.go}
});

/* ===== WELCOME VIDEO OVERLAY =====================================
   Full-screen clips that play when a new guest sits down.
   Swipe UP  -> the menu.  Swipe LEFT/RIGHT -> next / previous clip.
   Comes back on its own after the tablet has been idle a while, so
   the next table gets the same welcome. ================================ */
var INTRO = (function(){
  var cfg   = (C && C.intro) || {};
  var el    = document.getElementById("intro");
  var track = document.getElementById("introtrack");
  var dots  = document.getElementById("introdots");
  var bSnd  = document.getElementById("introsound");
  var bSkip = document.getElementById("introskip");
  var hint  = document.getElementById("introhinttxt");
  var KEY   = "hayat_intro_seen";

  var clips = [], posters = [];
  try{
    clips = (cfg.clips || []).filter(function(s){ return s && String(s).indexOf("PUT_")!==0; });
    posters = cfg.posters || [];
  }catch(e){ clips = []; }

  var idx = 0, vids = [], built = false, live = false, muted = true;
  var lastTouch = Date.now(), armed = false;

  function gapMs(){
    var m = (cfg.showAgainAfterMin == null) ? 15 : Number(cfg.showAgainAfterMin);
    return (m > 0 ? m : 0) * 60000;
  }
  function stamp(){ try{ localStorage.setItem(KEY, String(Date.now())); }catch(e){} }
  function lastSeen(){ try{ return Number(localStorage.getItem(KEY)) || 0; }catch(e){ return 0; } }

  function srcTag(url, type){
    var s = document.createElement("source");
    s.src = url; s.type = type; return s;
  }
  function build(){
    if(built || !el || !clips.length) return;
    track.innerHTML = "";
    vids = clips.map(function(src,i){
      var s = document.createElement("div"); s.className = "introslide";
      var v = document.createElement("video");
      /* mp4 first (iOS, Android Chrome), webm as a fallback for browsers
         built without H.264. Same clip, both formats sit in intro/. */
      var alt = String(src).replace(/\.mp4$/i, ".webm");
      v.appendChild(srcTag(src, "video/mp4"));
      if(alt !== src) v.appendChild(srcTag(alt, "video/webm"));
      if(posters[i]) v.poster = posters[i];
      v.muted = true; v.defaultMuted = true; v.playsInline = true;
      v.setAttribute("playsinline",""); v.setAttribute("webkit-playsinline","");
      v.preload = i === 0 ? "auto" : "metadata";
      v.addEventListener("ended", function(){
        if(cfg.autoAdvance === false){ try{ v.currentTime = 0; v.play(); }catch(e){} }
        else go(idx + 1);
      });
      v.addEventListener("error", function(){
        v.dataset.bad = "1";
        /* if every clip is unplayable, get out of the way rather than
           trapping the guest on a black screen */
        if(vids.every(function(x){ return x.dataset.bad; })){ close(); return; }
        go(idx + 1);
      });
      s.appendChild(v); track.appendChild(s);
      return v;
    });
    dots.innerHTML = clips.map(function(_,i){
      return '<i class="' + (i ? "" : "on") + '"></i>';
    }).join("");
    built = true;
  }

  function paint(){
    track.style.transform = "translateX(" + (-idx * 100) + "%)";
    var ds = dots.children;
    for(var i = 0; i < ds.length; i++) ds[i].className = (i === idx ? "on" : "");
    vids.forEach(function(v,i){
      if(i === idx){
        playCur();
        var nx = vids[i+1]; if(nx && nx.preload !== "auto") nx.preload = "auto";
      }else{
        try{ v.pause(); v.currentTime = 0; }catch(e){}
      }
    });
  }
  /* Sound on by default. Browsers may still refuse to start audio without a
     tap — when that happens we drop to muted and unmute on the first touch. */
  var armedSnd = false;
  function playCur(){
    var v = vids[idx]; if(!v) return;
    v.muted = muted;
    try{ v.volume = 1; }catch(e){}
    var p = v.play();
    if(p && p.catch) p.catch(function(){
      /* the browser refused audio without a tap. Play silently, make the
         sound button obvious, and turn the sound on at the first touch. */
      muted = true; v.muted = true; label(); armUnmute();
      var q = v.play(); if(q && q.catch) q.catch(function(){});
    });
    if(muted) armUnmute();      /* muted for any other reason? same deal */
  }
  function armUnmute(){
    if(armedSnd) return; armedSnd = true;
    var f = function(){
      document.removeEventListener("pointerdown", f, true);
      document.removeEventListener("touchstart", f, true);
      armedSnd = false;
      if(!live) return;
      muted = false;
      var v = vids[idx];
      if(v){ v.muted = false; var p = v.play(); if(p && p.catch) p.catch(function(){}); }
      label();
    };
    document.addEventListener("pointerdown", f, true);
    document.addEventListener("touchstart", f, true);
  }
  function go(n){
    if(!clips.length) return;
    idx = ((n % clips.length) + clips.length) % clips.length;
    track.classList.remove("nosnap");
    paint();
  }

  function open(force){
    if(!el || !clips.length) return;
    if(!force && !shouldShow()) return;
    build();
    idx = 0; muted = (cfg.sound === false);
    label();
    el.hidden = false;
    void el.offsetWidth;                 // force reflow so the transition runs
    el.classList.remove("gone");
    document.body.style.overflow = "hidden";
    live = true;
    paint();
  }
  function close(){
    if(!live) return;
    live = false;
    el.classList.add("gone");
    stamp();
    vids.forEach(function(v){ try{ v.muted = true; v.pause(); v.currentTime = 0; }catch(e){} });
    document.body.style.overflow = "";
    setTimeout(function(){ if(!live) el.hidden = true; }, 520);
  }
  function shouldShow(){
    if(cfg.enabled === false || !clips.length) return false;
    if(cfg.showEveryLoad) return true;   // play on every load / refresh
    var last = lastSeen();
    if(!last) return true;
    var g = gapMs();
    if(!g) return false;                 // showAgainAfterMin: 0  -> once per tablet
    return (Date.now() - last) > g;
  }

  function label(){
    try{
      bSkip.innerHTML = T("introSkip") + " &rarr;";
      bSnd.innerHTML  = (muted ? "&#128263; " : "&#128266; ") + T(muted ? "introSound" : "introMuted");
      bSnd.classList.toggle("pulse", !!muted);
      hint.textContent = T("introSwipe");
    }catch(e){}
  }

  /* ---- gestures ---- */
  var sx = 0, sy = 0, dx = 0, dy = 0, dragging = false, axis = "";
  function down(e){
    if(!live) return;
    var t = e.touches ? e.touches[0] : e;
    sx = t.clientX; sy = t.clientY; dx = dy = 0; dragging = true; axis = "";
    track.classList.add("nosnap");
  }
  function move(e){
    if(!dragging || !live) return;
    var t = e.touches ? e.touches[0] : e;
    dx = t.clientX - sx; dy = t.clientY - sy;
    if(!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8))
      axis = Math.abs(dy) > Math.abs(dx) ? "y" : "x";
    if(axis === "x"){
      track.style.transform = "translateX(calc(" + (-idx * 100) + "% + " + dx + "px))";
    }else if(axis === "y" && dy < 0){
      el.style.transform = "translateY(" + Math.max(dy, -260) + "px)";
      el.style.opacity = String(Math.max(0, 1 + dy / 420));
    }
    if(e.cancelable) e.preventDefault();
  }
  function up(){
    if(!dragging) return;
    dragging = false;
    el.style.transform = ""; el.style.opacity = "";
    if(axis === "y" && dy < -70){ close(); return; }
    if(axis === "x" && Math.abs(dx) > 55) go(idx + (dx < 0 ? 1 : -1));
    else go(idx);
    axis = "";
  }
  if(el){
    el.addEventListener("touchstart", down, {passive:true});
    el.addEventListener("touchmove",  move, {passive:false});
    el.addEventListener("touchend",   up);
    el.addEventListener("touchcancel",up);
    el.addEventListener("mousedown",  down);
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup",   up);
    el.addEventListener("wheel", function(e){ if(live && e.deltaY > 12) close(); }, {passive:true});
    bSkip.addEventListener("click", function(e){ e.stopPropagation(); close(); });
    bSnd.addEventListener("click",  function(e){
      e.stopPropagation(); muted = !muted;
      var v = vids[idx]; if(v){ v.muted = muted; if(!muted){ var p = v.play(); if(p&&p.catch) p.catch(function(){}); } }
      label();
    });
    window.addEventListener("keydown", function(e){
      if(!live) return;
      if(e.key === "Escape" || e.key === "ArrowUp") close();
      if(e.key === "ArrowRight") go(idx + 1);
      if(e.key === "ArrowLeft")  go(idx - 1);
    });
  }

  /* ---- replay button on the home screen ---- */
  document.addEventListener("click", function(e){
    var b = e.target && e.target.closest && e.target.closest("#introreplay");
    if(b){ e.preventDefault(); open(true); }
  });

  /* ---- idle: bring it back for the next table ---- */
  ["touchstart","mousedown","keydown","scroll"].forEach(function(ev){
    window.addEventListener(ev, function(){ lastTouch = Date.now(); }, {passive:true});
  });
  setInterval(function(){
    if(live || !gapMs() || cfg.enabled === false) return;
    if(!introWelcome()) return;          /* never interrupt someone mid-task */
    if(Date.now() - lastTouch < gapMs()) return;
    lastTouch = Date.now();
    if(location.hash && location.hash !== "#/") location.hash = "#/";
    open(true);
  }, 20000);

  function sound(on){
    muted = !on;
    var v = vids[idx];
    if(v){ v.muted = muted; var p = v.play(); if(p && p.catch) p.catch(function(){}); }
    label();
  }
  return { open:open, close:close, relabel:label, sound:sound,
           has:function(){ return clips.length > 0; } };
})();

/* The intro is a welcome, so it only belongs on the front door. Anyone who
   followed a link to a particular page — a review card, an order they are
   tracking, the office — came for that page, not for a film. */
function introWelcome(){
  var h = location.hash || "";
  return h === "" || h === "#" || h === "#/";
}
try{ if(introWelcome()) INTRO.open(false); }catch(e){}
window.addEventListener("hashchange", function(){
  try{ if(!introWelcome()) INTRO.close(); }catch(e){}
});

/* ===== FULL SCREEN =================================================
   A tablet on a table should show the menu, not Chrome. Browsers only
   grant full screen off a real tap, so we take the first one. Installed
   as an app it is already full screen and none of this runs. */
(function(){
  var want = (C.fullscreen !== false) && (MODE === "tablet");
  var el = document.documentElement;
  function isFs(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function enter(){
    if(isFs()) return;
    var f = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if(f){ try{ f.call(el); }catch(e){} }
  }
  function exit(){
    var f = document.exitFullscreen || document.webkitExitFullscreen;
    if(f){ try{ f.call(document); }catch(e){} }
  }
  var btn = document.getElementById("fsbtn");
  if(btn) btn.onclick = function(){ isFs() ? exit() : enter(); };
  if(!want) return;
  /* already an installed app? then it is full screen already */
  if(window.matchMedia && window.matchMedia("(display-mode: fullscreen)").matches) return;
  var once = function(){
    document.removeEventListener("pointerdown", once, true);
    document.removeEventListener("touchstart", once, true);
    document.removeEventListener("keydown", once, true);
    enter();
    /* the same tap unblocks audio — hand it to the intro if it is running */
    try{ if(window.INTRO && window.INTRO.sound) window.INTRO.sound(true); }catch(e){}
  };
  document.addEventListener("pointerdown", once, true);
  document.addEventListener("touchstart", once, true);
  document.addEventListener("keydown", once, true);
})();

/* offline support — https only, silently skipped on file:// */
var okCtx = location.protocol==="https:" || ["localhost","127.0.0.1"].indexOf(location.hostname)>=0;
if("serviceWorker" in navigator && okCtx){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"})
      .then(function(reg){ try{ reg.update(); }catch(e){} })
      .catch(function(){});
  });
  /* When a new version takes over, reload once so the guest sees it straight
     away instead of the copy stored on the device. */
  var swapped = false;
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(swapped) return; swapped = true;
    location.reload();
  });
}
