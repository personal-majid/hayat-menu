<style>
/* Hayat owner board. Reads ONE Firestore document - vm_daylog/<today> - that the

  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#008300; --warn:#eda100; --bad:#e34948; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ color-scheme:dark; --bg:#171512; --card:#211e1a; --line:rgba(245,240,228,.12); --line2:rgba(245,240,228,.26); --ink:#F5F0E4; --muted:#B5AC9A; --pri:#F5F0E4; --onpri:#1B1A17; --soft:rgba(245,240,228,.05); --soft2:rgba(245,240,228,.09);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s7:#9085e9; --s8:#e66767; } }

.bars{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;align-items:end;height:90px;margin:4px 0 2px}
.bar{background:var(--s1);border-radius:3px 3px 0 0;min-height:2px;position:relative} .bar:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--pri);color:var(--onpri);font-size:11px;padding:2px 6px;border-radius:6px;white-space:nowrap;margin-bottom:3px}
.bar.y{background:var(--line2)}
.dd{border-top:1px solid var(--line);padding:6px 0} .dd summary{display:flex;gap:10px;align-items:center;cursor:pointer;list-style:none;font-size:13px} .dd summary::-webkit-details-marker{display:none} .dd summary::before{content:'▸';color:var(--muted);width:12px} .dd[open] summary::before{content:'▾'} .dd summary small{color:var(--muted)} .dd summary b{margin-left:auto} .dd table{margin:6px 0 4px}
.blist{display:grid;gap:8px} .bcard{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--soft);cursor:pointer} .bcard.open,.bcard.due{border-left:3px solid var(--warn)} .bcard.settled{background:var(--card)}

.bcard .l2{font-size:12px;color:var(--muted);margin-top:2px} .bcard .l3{font-size:13px;margin-top:4px;line-height:1.35} .bcard .l4{font-size:12px;color:var(--bad);margin-top:3px}
.sh{border:0;background:transparent;cursor:pointer;font-size:14px;padding:0 4px;margin-left:6px;opacity:.55;vertical-align:middle} .sh:hover{opacity:1} .kpis{position:relative} .kpish{position:absolute;right:0;top:-24px}

table.stack td{display:block;border:0;padding:1px 0;font-size:13px} table.stack td:empty{display:none} table.stack td.m{display:block} table.stack td::before{content:attr(data-h);display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em} table.stack td:first-child{grid-column:1/-1;font-weight:700;font-size:14px} table.stack td:first-child::before{display:none} table.stack td.r{text-align:left}
.bc{position:relative;display:flex;align-items:flex-end;height:100%} .bc .bar{width:100%} .avgm{position:absolute;left:-1px;right:-1px;border-top:2px dotted var(--line2);pointer-events:none}

.search{width:100%;font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:inherit;margin:0 0 8px}

.ha-f{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;margin:0 0 8px;background:var(--bg);color:inherit} .ha-b{width:100%;font:inherit;font-weight:700;padding:11px;border:0;border-radius:10px;background:var(--pri);color:var(--onpri);cursor:pointer} .ha-n{font-size:12px;color:var(--muted)}

.hide{display:none}
.sheetwrap{position:fixed;inset:0;z-index:50;background:rgba(27,26,23,.45);display:flex;justify-content:flex-end}
.sheet{width:min(620px,100%);height:100%;overflow:auto;background:var(--bg);padding:16px;box-shadow:-12px 0 40px rgba(0,0,0,.25)}
.sheet h2{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-size:18px} .sheet h2 .x{margin-left:auto;font:inherit;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;cursor:pointer}

.ev.kot::before{background:var(--s2)} .ev.edit::before{background:var(--s8)} .ev.due::before{background:var(--s4)} .ev.paid::before{background:var(--good)} .ev.move::before{background:var(--s7)}
.ev b{font-size:13px} .ev .at{font-variant-numeric:tabular-nums;font-weight:800;margin-right:8px} .ev .gap{color:var(--muted);font-size:12px;margin-left:6px}

.cmp .k{color:var(--muted);text-align:center;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase} .cmp .a,.cmp .b{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px} .cmp .a{text-align:right} .cmp .d{font-size:11px;font-weight:600;margin-left:6px}

<body>
<div class="top">
  <h1>HAYAT · Owner</h1>
  <span class="seg"><button class="tab on" data-mode="day">Day</button><button class="tab" data-mode="period">Period</button></span>
  <button class="nav" id="prevDay" title="previous day (←)">‹</button>
  <select id="day"></select>
  <button class="nav" id="nextDay" title="next day (→)">›</button>
  <button class="nav cal" id="calBtn" title="calendar">▦</button>
  <div id="calPop" hidden></div>
  <span class="sp"></span>
  <span class="live" id="pc" hidden><i></i><span></span></span>
  <span class="live" id="live"><i></i><span>connecting…</span></span>
  <a class="tb" href="./#/admin" style="text-decoration:none">Office</a>
</div>
<div class="wrap" id="main"><div class="note">Loading…</div></div>

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rs=n=>'₹'+Math.round(+n||0).toLocaleString('en-IN');
const hm=t=>t?t.slice(11,16):'';
const T=s=>s?new Date(s.replace(' ','T')):null;
const mins=(a,b)=>a&&b?Math.round((T(b)-T(a))/60000):null;
const ago=s=>{ const m=s?Math.round((NOW-T(s))/60000):null; return m==null?'':m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' m'; };
const DAYSTART=5;
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');   /* local date - toISOString() is UTC and turned 01:00 IST into the day before */
const bizToday=()=>{ const d=new Date(); if(d.getHours()<DAYSTART) d.setDate(d.getDate()-1); return ymd(d); };
/* which of OUR kitchens cooks a VMENU item: same words the office KOT split uses */
const station=it=>{ const s=((it.cat||'')+' '+(it.n||'')).toLowerCase(); if(/fried rice|juice|lime|water|tea|coffee|shake|mojito|salad|gravy|curry|fish|shawarma|shawaya|broast|dessert|ice/.test(s)) return 'front'; if(/mandi|alfaham|bread|parotta|kuboos|chapati|meal|biryani|beef|rice/.test(s)) return 'main'; return 'front'; };

const BOARD='v174';
let FB=null, DOC=null, YDOC=null, FLOOR=null, DAY=bizToday(), NOW=Date.now(), TAB='sales', Q='', DAYS=[], INDEX={};
const $$=(sel,root)=>Array.from((root||document).querySelectorAll(sel));

function recs(){ return Object.values((DOC&&DOC.records)||{}); }
/* a CASHIER bill this small is staff food, not a customer: shown, counted, never alerted or averaged */
const STAFF_MAX=300;
const ORDER_WORDS=/^(co|c\/o|c\.o|dm|dmu|hd|h\.d|cnt|cntr|counter|parcel|take ?away|ta|pack\w*|deliver\w*|home ?del\w*|zomato|swiggy|online)\b/i;
const staffNames=()=>new Set(Object.values((FLOOR&&FLOOR.staff)||{}).map(n=>String(n).trim().toUpperCase()).filter(Boolean));
/* the ticket remark says who ate: "tan", "viva", "SOHAIL ALF" - staff food, in any section */
const isStaff=r=>{ const rem=String(r.remarks||'').trim(); const w=rem.split(/\s+/)[0]||'';
  if(rem&&!ORDER_WORDS.test(rem)){ if(staffNames().has(w.toUpperCase())) return true; if(/^[a-z]{2,14}$/i.test(rem)&&sum(r)<=STAFF_MAX) return true; if(/\bstaff\b/i.test(rem)) return true; }
  return /cashier/i.test(r.waiter||'')&&sum(r)<=200&&!rem; };
function prep(doc){ if(doc&&doc.records) Object.values(doc.records).forEach(r=>{ if(!r.kindRaw) r.kindRaw=r.kind; r.kind=isStaff(r)?'staff':r.kindRaw; }); return doc; }

  </div>`;

function avg(xs){ return xs.length?Math.round(xs.reduce((a,b)=>a+b,0)/xs.length):null; }

function alerts(){
  const R=recs(), out=[];
  R.filter(r=>(r.status==='open'||r.status==='due')&&r.kind!=='staff').forEach(r=>{
    const age=mins(r.createdAt, tsNow()), sinceDue=r.dueAt?mins(r.dueAt,tsNow()):null;
    /* a delivery bill is settled when the rider is back - or at the end of the day; never an alert */
    const note=r.remarks?' · “'+r.remarks+'”':'';
    if(r.status==='due'&&sinceDue>10&&r.kind!=='delivery') out.push({bad:sinceDue>25,b:`${r.table||'Token '+(r.token||'')} · bill printed, not paid`,s:`${r.waiter||''} · ${rs(sum(r))}${note}`,ago:sinceDue+' min'});
    else if(r.kind==='dine'&&age>75) out.push({bad:age>110,b:`${r.table} · seated a long time`,s:`${r.waiter||''} · ${r.kotCount} KOT · ${rs(sum(r))}`,ago:age+' min'});
    else if(r.kind==='counter'&&age>15) out.push({bad:age>30,b:`Token ${r.token||r.kot} · waiting at counter`,s:(r.remarks?'“'+r.remarks+'” · ':'')+(r.items||[]).map(i=>i.q+'× '+i.n).join(', ').slice(0,60),ago:age+' min'});
    /* a delivery takes longer by nature: cooking + the road + the rider coming back before it can be settled */
    else if(r.kind==='delivery'&&age>90) out.push({bad:age>150,b:`Delivery ${r.customer&&r.customer.name||('KOT '+r.kot)} · still open`,s:(r.rider?'rider '+r.rider:'no rider')+(r.dispatchAt?' · left '+hm(r.dispatchAt):' · not dispatched')+' · '+rs(sum(r)),ago:age+' min'});
    else if(r.kind==='delivery'&&!r.dispatchAt&&age>35) out.push({bad:age>60,b:`Delivery ${r.customer&&r.customer.name||('KOT '+r.kot)} · not dispatched`,s:(r.rider?'rider '+r.rider:'no rider')+' · '+rs(sum(r)),ago:age+' min'});
    const lateLines=(r.items||[]).filter(i=>lineState(i,r)==='late'); if(lateLines.length){ const worst=Math.max(...lateLines.map(i=>(i.kotAt?mins(i.kotAt,tsNow()):0)-prepMin(i))); out.push({bad:worst>10,b:`${r.table||'Token '+(r.token||r.kot)} · kitchen running late`,s:lateLines.map(i=>i.q+'× '+i.n).join(', ').slice(0,60),ago:worst+' min over'}); }
  });
  const voids=R.reduce((n,r)=>n+(r.edits||[]).length,0);
  return `<div class="card wide"><h2>Needs attention <span class="n">${out.length?out.length:'all calm'}${voids?' · '+voids+' edits/voids today':''}</span></h2>`+
    (out.length?`<div class="alerts">${out.sort((a,b)=>parseInt(b.ago)-parseInt(a.ago)).map(a=>`<div class="al${a.bad?' bad':''}"><b>${esc(a.b)}</b><small>${esc(a.s)}</small><span class="ago">${esc(a.ago)}</span></div>`).join('')}</div>`:'<div class="note">Nothing waiting too long.</div>')+'</div>';
}
function sum(r){ return r.total!=null?r.total:(r.items||[]).reduce((n,i)=>n+(i.a||0),0); }
function discOf(r){ const menu=(r.items||[]).reduce((n,i)=>n+(i.a||0),0); const off=r.status==='settled'&&r.total!=null&&menu?Math.round(menu-r.total):0; return Math.max(r.discount||0,off>0?off:0); }
/* how long a bill lives: order -> bill printed -> paid; delivery also order -> out the door */
function closeStats(R){
  const g={}, keep=(x,lim)=>x!=null&&x>=0&&x<=lim;
  R.filter(r=>r.status==='settled'&&r.kind!=='staff').forEach(r=>{
    const k=r.kind==='dine'?(r.section||'Dine'):r.kind==='delivery'?'Delivery':r.kind==='counter'?'Counter':null; if(!k) return;
    const x=g[k]=g[k]||{n:0,toBill:[],toPay:[],total:[],toGo:[]}; x.n++;
    const a=mins(r.createdAt,r.dueAt), b=mins(r.dueAt,r.settledAt), t=mins(r.createdAt,r.settledAt), d=mins(r.createdAt,r.dispatchAt);
    if(keep(a,300)) x.toBill.push(a); if(keep(b,600)) x.toPay.push(b); if(keep(t,600)) x.total.push(t); if(keep(d,300)) x.toGo.push(d);
  });
  return g;
}
/* where today stands against the same clock on other days */
function pace(){
  const live=DAY===bizToday();
  const nowH=(()=>{ const d=new Date(NOW); return (d.getHours()-BH0+24)%24 + d.getMinutes()/60; })();
  const upto=live?nowH:24;
  const till=(H)=>{ if(!H) return null; let t=0; for(let i=0;i<24;i++){ if(i+1<=upto) t+=H[i]||0; else if(i<upto) t+=(H[i]||0)*(upto-i); } return t; };
  const H=hbucket(recs().filter(r=>r.status==='settled')), today=till(H);
  const y=new Date(DAY+'T12:00:00'); y.setDate(y.getDate()-1); const yd=ymd(y);
  const yH=YDOC?hbucket(Object.values(YDOC.records||{}).filter(r=>r.status==='settled')):(INDEX[yd]&&INDEX[yd].hours);
  const w=new Date(DAY+'T12:00:00'); w.setDate(w.getDate()-7); const wd=ymd(w), wH=INDEX[wd]&&INDEX[wd].hours;
  const last7=[]; for(let i=1;i<=7;i++){ const x=new Date(DAY+'T12:00:00'); x.setDate(x.getDate()-i); const k=ymd(x); if(INDEX[k]&&INDEX[k].hours) last7.push(till(INDEX[k].hours)); }
  const avg7=last7.length?last7.reduce((a,b)=>a+b,0)/last7.length:null;
  const full7=[]; for(let i=1;i<=7;i++){ const x=new Date(DAY+'T12:00:00'); x.setDate(x.getDate()-i); const k=ymd(x); if(INDEX[k]&&INDEX[k].rev) full7.push(INDEX[k].rev); }
  const proj=(live&&avg7&&full7.length)?today/avg7*(full7.reduce((a,b)=>a+b,0)/full7.length):null;
  const dow=d=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(d+'T12:00:00').getDay()];
  const row=(k,v,sub)=>{ const d=v!=null&&v?Math.round(100*(today-v)/v):null; return `<div class="mrow"><span>${k}${sub?' <small style="color:var(--muted)">'+sub+'</small>':''}</span><div class="b" style="width:${v!=null?Math.min(100,100*v/Math.max(1,today,v)):0}%"></div><span class="v">${v==null?'—':rs(v)}${d!=null?` <span class="d ${d>=0?'up':'dn'}">${d>=0?'+':''}${d}%</span>`:''}</span></div>`; };
  const at=live?hm(tsNow()):'full day';
  return `<div class="card"><h2>Pace <span class="n">by ${at}${live?' · today so far '+rs(today):''}</span></h2><div class="mini">
    ${row('Today',today)}${row('Yesterday by now',till(yH),dow(yd))}${row('Last week same day',till(wH),dow(wd))}${row('Last 7 days avg by now',avg7,last7.length+' days')}</div>
    ${proj?`<p class="note">On this pace today closes around <b>${rs(proj)}</b> (last 7 days average close ${rs(full7.reduce((a,b)=>a+b,0)/full7.length)}).</p>`:(Object.keys(INDEX).length<3?'<p class="note">Fills in once the day index has a week of days (daylog-backfill-all.bat).</p>':'')}</div>`;
}
function tables(){
  const g={}; recs().filter(r=>r.status==='settled'&&r.kind==='dine'&&r.table).forEach(r=>{ const x=g[r.table]=g[r.table]||{sec:r.section,n:0,v:0,stay:[],pax:0}; x.n++; x.v+=sum(r); x.pax+=r.pax||0; const t=mins(r.createdAt,r.settledAt); if(t!=null&&t>=0&&t<=600) x.stay.push(t); });
  const rows=Object.entries(g).sort((a,b)=>b[1].v-a[1].v); if(!rows.length) return '';
  const turns=rows.reduce((n,r)=>n+r[1].n,0);
  return `<div class="card"><h2>Tables <span class="n">${rows.length} used · ${turns} turns</span></h2><table><tr><th>Table</th><th class="m">Section</th><th class="r">Turns</th><th class="r">Sales</th><th class="r">Avg bill</th><th class="r">Avg stay</th><th class="r m">₹/min</th></tr>${rows.map(([t,x])=>{ const st=avg(x.stay); return `<tr><td>${esc(t)}</td><td class="m">${esc(x.sec||'')}</td><td class="r">${x.n}</td><td class="r">${rs(x.v)}</td><td class="r">${rs(x.v/x.n)}</td><td class="r">${st!=null?st+'m':'—'}</td><td class="r m">${st?Math.round(x.v/x.n/st):'—'}</td></tr>`; }).join('')}</table></div>`;
}
/* every quantity cut or line removed, who did it and what it was worth */
function voidList(){
  const out=[], book={}; recs().forEach(r=>(r.items||[]).forEach(i=>{ if(i.p&&!book[i.n]) book[i.n]=i.p; }));   /* a removed line is no longer on its bill; price it from any bill of the day */
  recs().forEach(r=>(r.edits||[]).forEach(e=>{ const it=(r.items||[]).find(i=>i.n===e.item); const price=e.price||(it&&it.p)||book[e.item]||0; const gone=e.void||e.from===e.to; const cut=gone?(e.from||e.to||0):Math.max(0,(e.from||0)-(e.to||0));   /* VMENU logs a removed line as old = new */
    out.push({key:r.key,kot:r.kot,table:r.table||(r.token?'T'+r.token:''),waiter:r.waiter,at:e.at,item:e.item,from:e.from,to:e.to,cut,value:cut*price,reason:e.reason,by:e.by||r.waiter||'—',void:gone,remarks:e.remarks&&e.remarks!==e.reason?e.remarks:null}); }));
  return out.sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')));
}
function voids(){
  const V=voidList(); if(!V.length) return '';
  const g={}; V.forEach(v=>{ const x=g[v.by]=g[v.by]||{n:0,cut:0,v:0}; x.n++; x.cut+=v.cut; x.v+=v.value; });
  const rows=Object.entries(g).sort((a,b)=>b[1].v-a[1].v), max=Math.max(1,...rows.map(r=>r[1].v)), tot=V.reduce((n,v)=>n+v.value,0);
  return `<div class="card"><h2>Voids · by person <span class="n">${V.length} · ${rs(tot)}</span></h2><div class="mini">${rows.map(([k,x])=>`<div class="mrow"><span>${esc(k)} <small style="color:var(--muted)">${x.n} · ${x.cut} qty</small></span><div class="b" style="width:${100*x.v/max}%"></div><span class="v">${rs(x.v)}</span></div>`).join('')}</div></div>`+
    `<div class="card wide"><h2>Voids &amp; edits <span class="n">click a row for the bill</span></h2><div class="scroll"><table><tr><th>Time</th><th class="m">KOT</th><th class="m">Table</th><th>By</th><th>Item</th><th class="r">Qty</th><th class="m">Reason</th><th class="r">Value</th></tr>${V.map(v=>`<tr class="rowlink" data-drill="${esc(v.key)}"><td>${hm(v.at)}</td><td class="m">${esc(v.kot)}</td><td class="m">${esc(v.table)}</td><td>${esc(v.by)}</td><td>${esc(v.item)}${v.void?' <small style="color:var(--muted)">removed</small>':''}</td><td class="r">${v.void?'−'+v.cut:v.from+'→'+v.to}</td><td class="m">${esc(v.reason||'')}${v.remarks?' · '+esc(v.remarks):''}</td><td class="r">${rs(v.value)}</td></tr>`).join('')}</table></div></div>`;
}
/* the extras a waiter adds around the main course - or does not */
const EXTRAS=[['Desserts',/dessert|ice ?cream|pudding|halwa|kunafa|cake|brownie|faluda|sweet/i],['Salads',/salad|hummus|tabbouleh|raita|mezze/i],['Juices',/juice|lime|shake|lassi|smoothie/i],['Mojitos',/mojito|mocktail|soda|cooler|fresh drink/i],['Soups & starters',/soup|starter|snack|fries|nugget/i]];
const extraKind=i=>{ const t=(i.cat||'')+' '+(i.n||''); for(const [k,re] of EXTRAS) if(re.test(t)) return k; return null; };
function upsell(){

/* A delivery ticket stays open long after the food left - the rider is on the
   road and the bill closes when he is back. The kitchen must not keep seeing
   it. A line belongs on the pass while it is unfinished AND, for a delivery,
   only until it was dispatched / billed or 35 min after its KOT. */
/* Nobody taps "done" in the kitchen, so the pass is a MODEL: every item has a
   preparation time (groups below, tunable in Kitchen timing), a line is
   cooking until then, late after it, and gone at twice that - or the moment
   the bill is printed / the delivery leaves. Packaged goods (NO KOT) never
   reach the pass. */
const PREP_GROUPS=[['mandi',20,/mandi|biryani|kabsa|majboos|kizhi|dum\b/i],['fry',10,/fry\b|fried|broast|shawarma|shawaya|grill|tikka|kebab|\b65\b|dry\b|pepper|chilli|alfaham|alfam|omelette|egg|nugget|fries|roll\b|wings|lollipop/i],['gravy',15,/gravy|curry|masala|roast|manchurian|noodle|noodel|soup|pasta|korma|stew|kadai|butter|chicken|mutton|beef|fish|prawn|crab|pomfret|squid/i],['quick',5,/.*/]];
const PREP_LABEL={mandi:'Mandi · biryani',fry:'Alfaham · fry · grill',gravy:'Gravies · curries',quick:'Quick: juice, bread, salad, meals'};
let KSET=null;   /* settings/kitchen: {groups:{mandi:20,...}, items:{'ITEM NAME':min}, skip:['ITEM NAME']} */
const NOKOT=/\b(7up|pepsi|coke|cola|coca|sprite|mirinda|fanta|thums|limca|slice|maaza|frooti|water|mineral|can\b|1ltr|2ltr|2l\b|750ml|500ml|250ml|bottle|pack\b|burfi|chips|biscuit)/i;
function prepGroup(i){ const n=(i.n||''); for(const [g,m,rx] of PREP_GROUPS) if(rx.test(n)) return g; return 'quick'; }
function prepMin(i){ const n=(i.n||'').trim().toUpperCase(); if(KSET&&KSET.items&&KSET.items[n]!=null) return +KSET.items[n]; const g=prepGroup(i); const d=PREP_GROUPS.find(x=>x[0]===g)[1]; return KSET&&KSET.groups&&KSET.groups[g]!=null?+KSET.groups[g]:d; }
function noKitchen(i){ const n=(i.n||'').trim().toUpperCase(); if(KSET&&KSET.skip&&KSET.skip.includes(n)) return true; return i.kit==='NO KOT'||NOKOT.test(n); }
function lineState(i,r){
  if(noKitchen(i)) return 'skip'; if(i.ready==='ready'||i.servedAt) return 'done';
  if(r.kind==='delivery'&&(r.dispatchAt||r.status==='due')) return 'done';
  if(r.kind==='dine'&&r.status==='due') return 'done';                 /* bill printed: they ate */

function kitchens(){
  const open=recs().filter(r=>r.status==='open'||r.status==='due');

  const col=(k,label)=>{ const L=cols[k].sort((a,b)=>(a.age-a.p)-(b.age-b.p)).reverse(); const late=L.filter(x=>x.st==='late'), backlog=L.filter(x=>x.st==='cooking').reduce((n,x)=>n+Math.max(0,x.p-x.age),0);

  return `<div class="card wide"><h2>Kitchens · live <span class="n">${cols.main.length+cols.front.length} lines${gone?' · '+gone+' assumed served':''} · <a href="#" id="ktime">kitchen timing</a></span></h2><div class="kit">${col('main','Main kitchen')}${col('front','Front kitchen')}</div><p class="note">Estimated: nobody marks "done", so a line is cooking for its prep time, late after it, and assumed served at twice that or when the bill prints.</p></div>`;
}

/* business day runs 05:00 → 04:59; a bill settled at 01:00 belongs to the
   evening before it. Index 0 = 05:00 … index 23 = 04:00 next morning. */
const BH0=5;
function bh(ts){ const h=+(ts||'').slice(11,13); return h>=0?(h-BH0+24)%24:-1; }
function hbucket(rows){ const H=Array(24).fill(0); rows.forEach(r=>{ const i=bh(r.settledAt); if(i>=0) H[i]+=r.total||0; }); return H; }
/* only the active hours: one before the first sale, one after the last */
function hspan(...Hs){ let lo=24,hi=-1; Hs.forEach(H=>(H||[]).forEach((v,i)=>{ if(v>0){ lo=Math.min(lo,i); hi=Math.max(hi,i); } })); if(hi<0) return [5,20]; return [Math.max(0,lo-1),Math.min(23,hi+1)]; }
function hlabel(i){ return String((i+BH0)%24); }
function hbars(H,lo,hi,max,other,otherTag,cls,height,avgH){ const n=hi-lo+1;
  return `<div class="bars" style="grid-template-columns:repeat(${n},1fr)${height?';height:'+height+'px':''}">`+H.slice(lo,hi+1).map((v,j)=>{ const i=lo+j; const bar=`<div class="bar${cls?' '+cls:''}" style="height:${Math.max(2,100*v/max)}%" data-t="${hlabel(i)}:00 ${rs(v)}${other?' · '+(otherTag||'')+rs(other[i]):''}${avgH?' · avg '+rs(avgH[i]):''}"></div>`;
    return avgH?`<div class="bc">${bar}<i class="avgm" style="bottom:${Math.min(100,100*(avgH[i]||0)/max)}%"></i></div>`:bar; }).join('')+'</div>'; }
/* the same weekday's hourly average, from the day index (no reads) */
function weekdayAvg(day){ const dow=new Date(day+'T12:00:00').getDay(); const days=Object.keys(INDEX).filter(d=>d!==day&&INDEX[d].hours&&new Date(d+'T12:00:00').getDay()===dow); if(days.length<2) return null;
  const A=Array(24).fill(0); days.forEach(d=>INDEX[d].hours.forEach((v,i)=>A[i]+=v||0)); return {H:A.map(v=>v/days.length),n:days.length}; }
function hx(lo,hi){ const n=hi-lo+1, step=n>14?2:1;
  return `<div class="hx" style="grid-template-columns:repeat(${n},1fr)">`+Array.from({length:n},(_,j)=>j%step?'<span></span>':'<span>'+hlabel(lo+j)+'</span>').join('')+'</div>'; }

function hourly(){
  const H=hbucket(recs().filter(r=>r.status==='settled'));

let BF={kind:'',status:'',waiter:'',section:'',sort:'time'};
function bills(){
  const all=recs();

function trends(){

  const axis=`<div class="hx" style="${cols}">${days.map((d,i)=>i%step?'<span></span>':'<span>'+d.slice(8)+'</span>').join('')}</div>`;
  const series=(title,f,fmt,unit)=>{ const vals=days.map(d=>+f(INDEX[d]||{})||0), have=vals.filter(Boolean); const max=Math.max(1,...vals);
    if(!have.length) return '';

  const all=Object.keys(INDEX).filter(d=>INDEX[d]&&INDEX[d].rev);
  const bucketCard=(title,keyOf,labels,note)=>{ const g={}; all.forEach(d=>{ const k=keyOf(d); (g[k]=g[k]||[]).push(INDEX[d].rev); }); const vals=labels.map(l=>g[l]?g[l].reduce((a,b)=>a+b,0)/g[l].length:0); const max=Math.max(1,...vals);
    return `<div class="card"><h2>${title} <span class="n">avg sales/day · ${all.length} days</span></h2><div class="bars" style="grid-template-columns:repeat(${labels.length},1fr);height:70px">${vals.map((v,i)=>`<div class="bar" style="height:${Math.max(2,100*v/max)}%" data-t="${labels[i]} ${rs(v)} · ${(g[labels[i]]||[]).length} days"></div>`).join('')}</div><div class="hx" style="grid-template-columns:repeat(${labels.length},1fr)">${labels.map(l=>'<span>'+l+'</span>').join('')}</div>${note?'<p class="note">'+note+'</p>':''}</div>`; };

  if(MODE==='period'){ m.innerHTML=period()+`<div class="note">board ${BOARD}</div>`; }
  else m.innerHTML=kpis()+
    `<div class="tabs main">${[['floor','Live'],['sales','Sales'],['bills','Bills'],['items','Items'],['buy','Spends'],['cmp','Compare']].map(t=>`<button class="tab${TAB===t[0]?' on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>`+
    (TAB==='sales'?`<div class="grid">${hourly()}${pace()}${closures()}${breakdown()}${waiters()}${upsell()}${tables()}${voids()}${discounts()}</div>`:
     TAB==='floor'?`<div class="grid">${live?alerts():''}${unrealized()}${floor()}${kitchens()}</div>`:
     TAB==='bills'?`<div class="grid">${bills()}</div>`:
     TAB==='buy'?`<div class="grid">${drafts()}${payments()}${purchases()}</div>`:
     TAB==='cmp'?`<div class="grid">${compare()}</div>`:`<div class="grid">${items()}</div>`)+
    `<div class="note">Day log ${esc(DOC.updatedAt||'')} · ${DOC.count||0} records · shop PC appends every minute · board ${BOARD}</div>`;
  document.documentElement.style.setProperty('--toph',(document.querySelector('.top')||{offsetHeight:52}).offsetHeight+'px');
  addShare(); fitTables();
  $$('[data-tab]').forEach(b=>b.onclick=()=>{ TAB=b.dataset.tab; Q=''; render(); if(TAB==='cmp'&&!WEEK) loadWeek(); });
  $$('[data-ptab]').forEach(b=>b.onclick=()=>{ PTAB=b.dataset.ptab; Q=''; render(); });
  $$('[data-per]').forEach(b=>b.onclick=()=>{ const p=b.dataset.per.split('|'); loadPeriod(p[0],p[1],p[2]); });
  const pg=$('pGo'); if(pg) pg.onclick=()=>loadPeriod($('pFrom').value,$('pTo').value,''); const pr=$('pRefresh'); if(pr) pr.onclick=()=>loadPeriod(PER.from,PER.to,PER.label,true); const pp=$('perPerson'); if(pp) pp.onchange=()=>{ PER.person=pp.value; render(); };
  $$('[data-mode]').forEach(b=>b.onclick=()=>{ MODE=b.dataset.mode; render(); });
  $$('[data-sp]').forEach(sel=>sel.onchange=()=>{ SP[sel.dataset.sp]=sel.value; render(); }); const spq=$('spq'); if(spq){ spq.oninput=()=>{ SP.q=spq.value; const pos=spq.selectionStart; render(); const q2=$('spq'); if(q2){ q2.focus(); q2.setSelectionRange(pos,pos); } }; }
  $$('details[data-spk]').forEach(d=>d.ontoggle=()=>{ SP.open[d.dataset.spk]=d.open; });
  $$('[data-drill]').forEach(tr=>tr.onclick=()=>drill(tr.dataset.drill));
  $$('[data-table]').forEach(t=>t.onclick=()=>tableSheet(t.dataset.table));
  const kt=$('ktime'); if(kt) kt.onclick=e=>{ e.preventDefault(); kitchenSheet(); };
  const re=$('rcpEdit'); if(re) re.onclick=e=>{ e.preventDefault(); recipeSheet(PER.V); };
  $$('[data-pur]').forEach(t=>t.onclick=()=>purchaseSheet(t.dataset.pur));
  const mp=$('monPick'); if(mp) mp.onchange=()=>loadMonth(mp.value); const mr=$('monRefresh'); if(mr) mr.onclick=()=>loadMonth(MON.key,true); const mper=$('monPerson'); if(mper) mper.onchange=()=>{ MON.person=mper.value; render(); };
  $$('[data-mdrill]').forEach(tr=>tr.onclick=async()=>{ const [d,key]=tr.dataset.mdrill.split('|'); const rk=key.split('/')[1]; const doc=d===bizToday()?DOC:await loadDay(d); const r=doc&&doc.records[rk]; if(!r) return; const keep=RANGE.doc; RANGE.doc={records:{[key]:Object.assign({},r,{key})},purchases:{}}; drill(key); RANGE.doc=keep; });
  $$('[data-bf]').forEach(sel=>sel.onchange=()=>{ BF[sel.dataset.bf]=sel.value; render(); }); const bc=document.querySelector('[data-bfclear]'); if(bc) bc.onclick=()=>{ BF={kind:'',status:'',waiter:'',section:'',sort:BF.sort}; render(); };
  const rg=$('rGo'); if(rg){ rg.onclick=()=>{ RANGE.from=$('rFrom').value; RANGE.to=$('rTo').value; if(RANGE.from>RANGE.to){ const t=RANGE.from; RANGE.from=RANGE.to; RANGE.to=t; } loadRange(); }; $$('[data-range]').forEach(b=>b.onclick=()=>{ const p=b.dataset.range.split('|'); RANGE.from=p[0]; RANGE.to=p[1]; loadRange(); }); }
  $$('[data-day]').forEach(b=>b.onclick=()=>{ MODE='day'; TAB='sales'; setDay(b.dataset.day); render(); });
  $$('[data-csv]').forEach(b=>b.onclick=()=>csv(b.dataset.csv));
  const cd=$('cmpDay'); if(cd) cd.onchange=()=>pickCompare(cd.value);
  $$('[data-cmp]').forEach(b=>b.onclick=()=>pickCompare(b.dataset.cmp));
  const q=$('q'); if(q){ q.oninput=()=>{ Q=q.value.trim().toLowerCase(); const pos=q.selectionStart; render(); const q2=$('q'); q2.focus(); q2.setSelectionRange(pos,pos); }; }
}

let unsub=null;
async function watchDay(){
  if(unsub){ unsub(); unsub=null; } DOC=null; YDOC=null; render();
  const {fs,db}=FB, want=DAY;
  const y=new Date(DAY+'T12:00:00'); y.setDate(y.getDate()-1); const yday=ymd(y);
  loadDay(yday).then(d=>{ if(want!==DAY) return; YDOC=d; render(); });
  if(DAY!==bizToday()){
    /* a finished day: the published file, else Firebase once */
    const d=await loadDay(DAY); if(want!==DAY) return; DOC=d; stamp(); render(); return;
  }
  unsub=fs.onSnapshot(fs.doc(db,'vm_daylog',DAY),d=>{ DOC=prep(d.exists()?d.data():null); CACHE[DAY]=DOC; SRC[DAY]='firebase'; syncIndexToday(); stamp(); render(); },e=>{ $('live').className='live bad'; $('live').lastElementChild.textContent=e.code||'error'; });
}
/* the index is read once an hour; today's entry is refreshed from the live doc so every trend has the last sale */
function syncIndexToday(){ if(!DOC||DAY!==bizToday()) return; const S=recs().filter(r=>r.status==='settled'); const cs=closeStats(recs()), close={}; Object.keys(cs).forEach(k=>{ const a=avg(cs[k].total); if(a!=null) close[k]=a; });
  INDEX[DAY]=Object.assign({},INDEX[DAY]||{},{rev:S.reduce((n,r)=>n+(r.total||0),0),bills:S.length,open:recs().filter(r=>r.status==='open'||r.status==='due').length,paidOut:DOC.paidOut||0,purchases:DOC.purchaseTotal||0,hours:hbucket(S),close,updatedAt:DOC.updatedAt}); }
/* ---- share any card as WhatsApp text ---- */
const txt=el=>(el.innerText||el.textContent||'').replace(/\s+/g,' ').trim();
function cardText(card){
  const out=[]; const h=card.querySelector('h2'); if(h){ const t=h.cloneNode(true); t.querySelectorAll('button,select,input,a').forEach(x=>x.remove()); const n=t.querySelector('.n'); const sub=n?txt(n):''; if(n) n.remove(); out.push('*'+txt(t)+'*'+(sub?' — '+sub:'')); }
  card.querySelectorAll('.mrow').forEach(r=>{ const c=r.children; out.push('• '+txt(c[0])+': '+txt(c[c.length-1])); });
  card.querySelectorAll('.bcard').forEach(b=>{ const l1=b.querySelector('.l1'), l2=b.querySelector('.l2'), l3=b.querySelector('.l3'), l4=b.querySelector('.l4'); out.push('• *'+txt(l1)+'*'); if(l2) out.push('  '+txt(l2)); if(l3) out.push('  '+txt(l3)); if(l4) out.push('  '+txt(l4)); });
  card.querySelectorAll('.tbl').forEach(t=>out.push('• '+txt(t)));
  card.querySelectorAll('.ki').forEach(t=>out.push('• '+txt(t)));
  card.querySelectorAll('.al').forEach(t=>out.push('⚠ '+txt(t)));
  card.querySelectorAll('.ev').forEach(t=>out.push('• '+txt(t)));
  card.querySelectorAll('.dd').forEach(dd=>{ out.push('▸ *'+txt(dd.querySelector('summary'))+'*'); if(dd.open){ const tb=dd.querySelector('table'); if(tb){ const heads=[...tb.querySelectorAll('tr th')].map(txt); tb.querySelectorAll('tr').forEach(tr=>{ const tds=[...tr.children].filter(td=>td.tagName==='TD'); if(!tds.length) return; out.push('   • '+tds.map((td,i)=>{ const v=txt(td); return v?(i===0?v:(heads[i]||'')+' '+v):''; }).filter(Boolean).join(' · ')); }); } } });
  card.querySelectorAll('table').forEach(tb=>{ if(tb.closest('.dd')) return; const heads=[...tb.querySelectorAll('tr th')].map(txt); tb.querySelectorAll('tr').forEach(tr=>{ const tds=[...tr.children].filter(td=>td.tagName==='TD'); if(!tds.length) return; const cells=tds.map((td,i)=>{ const v=txt(td); const hd=heads[i]||''; return v?(i===0?'*'+v+'*':hd?hd+' '+v:v):''; }).filter(Boolean); out.push('• '+cells.join(' · ')); }); });
  const bars=card.querySelector('.bars'); if(bars&&!card.querySelector('table')&&!card.querySelector('.mrow')){ [...bars.querySelectorAll('.bar')].forEach(b=>{ if(b.dataset.t) out.push('• '+b.dataset.t); }); }
  return out.filter(Boolean).join('\n');
}
async function shareText(text,title){ text='🏠 HAYAT · '+(MODE==='period'?PER.label:DAY)+(title?' · '+title:'')+'\n'+text; try{ if(navigator.share){ await navigator.share({text}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(text); }catch(e){}
  window.open('https://wa.me/?text='+encodeURIComponent(text.slice(0,4000)),'_blank'); }
function kpiText(){ return [...document.querySelectorAll('.kpi')].map(k=>'• '+txt(k.querySelector('small'))+': *'+txt(k.querySelector('b'))+'*'+(k.querySelector('em')?' ('+txt(k.querySelector('em'))+')':'')).join('\n'); }
function addShare(){ $$('.card h2').forEach(h=>{ if(h.querySelector('.sh')) return; const b=document.createElement('button'); b.className='sh'; b.title='share on WhatsApp'; b.textContent='📤'; b.onclick=e=>{ e.stopPropagation(); e.preventDefault(); shareText(cardText(h.closest('.card')),''); }; h.appendChild(b); });
  const k=document.querySelector('.kpis'); if(k&&!k.querySelector('.sh')){ const b=document.createElement('button'); b.className='sh kpish'; b.title='share the summary'; b.textContent='📤'; b.onclick=()=>shareText(kpiText(),MODE==='period'?PER.label:'Day'); k.appendChild(b); } }
/* ---- phones: a table that does not fit becomes stacked row-cards, never a sideways scroll ---- */
function fitTables(){ if(window.innerWidth>640) return; $$('main table, #main table').forEach(t=>{ t.classList.remove('stack'); const host=t.closest('.scroll')||t.parentElement; if(t.scrollWidth>host.clientWidth+2){ const heads=[...t.querySelectorAll('tr th')].map(txt); t.querySelectorAll('tr').forEach(tr=>[...tr.children].forEach((td,i)=>{ if(td.tagName==='TD') td.dataset.h=heads[i]||''; })); t.classList.add('stack'); } }); }
function stamp(){ const l=$('live'); if(!DOC){ l.className='live bad'; l.lastElementChild.textContent='no data'; return; }
  if(DAY!==bizToday()){ l.className='live'; l.lastElementChild.textContent=({file:'from file',cache:'from this device',firebase:'from Firebase'}[SRC[DAY]]||'')+' · '+DAY; return; }
  const age=Math.max(0,Math.round((Date.now()-T(DOC.updatedAt))/60000)); l.className='live'+(age>6?' bad':''); l.lastElementChild.textContent=(age>6?'stale · ':'live · ')+age+' min ago'; }
/* the shop PC's own health note (watchdog.py, every 5 min) */
let HEALTH=null;
function healthPill(){ const el=$('pc'); if(!el) return; if(!HEALTH){ el.hidden=true; return; } el.hidden=false;
  const age=Math.round((NOW-T(HEALTH.at))/60000), bad=age>12||!HEALTH.ok; el.className='live'+(bad?' bad':'');
  const bads=Object.entries(HEALTH.tasks||{}).filter(([k,t])=>!t.ok).map(([k])=>k.replace('Hayat ','')).join(', ');
  el.lastElementChild.textContent='shop PC '+(age>12?'silent '+age+' min':bad?'fixing: '+bads:'ok'); el.title=(HEALTH.host||'')+' · '+HEALTH.at+(HEALTH.disk?' · disk free '+HEALTH.disk+' GB':'')+((HEALTH.actions||[]).length?'\n'+HEALTH.actions.join('\n'):''); }

/* the calendar: three months of squares, darker = bigger day */
function setDay(d){ if(!d||d===DAY) return; DAY=d; CMP=null; WEEK=null; const sel=$('day'); if(sel&&[...sel.options].some(o=>o.value===d)) sel.value=d; watchDay(); }
function stepDay(n){ const list=(DAYS||[]).slice().sort(); const i=list.indexOf(DAY); const d=list[i+n]; if(d) setDay(d); }
function calendar(){
  const pop=$('calPop'); if(!pop.hidden){ pop.hidden=true; return; }
  const max=Math.max(1,...Object.values(INDEX).map(x=>x.rev||0));
  const months=[]; const b=new Date(bizToday()+'T12:00:00'); for(let i=2;i>=0;i--){ const x=new Date(b.getFullYear(),b.getMonth()-i,1,12); months.push(x); }
  pop.innerHTML=months.map(m=>{ const y=m.getFullYear(), mo=m.getMonth(), first=(new Date(y,mo,1).getDay()+6)%7, n=new Date(y,mo+1,0).getDate(); let cells='';
    for(let i=0;i<first;i++) cells+='<i></i>';
    for(let d=1;d<=n;d++){ const k=ymd(new Date(y,mo,d,12)); const x=INDEX[k]; const v=x?x.rev||0:0; const w=Math.round(100*v/max);
      cells+=`<div class="d${v?' has':' none'}${w>55?' hot':''}${k===DAY?' cur':''}" style="--w:${Math.max(12,w)}" data-t="${k} ${v?rs(v)+' · '+(x.bills||0)+' bills':'no data'}" ${v?`data-pick="${k}"`:''}>${d}</div>`; }
    const tot=Object.keys(INDEX).filter(k=>k.startsWith(ymd(m).slice(0,7))).reduce((a,k)=>a+(INDEX[k].rev||0),0);
    return `<div class="cm"><h4>${m.toLocaleString('en',{month:'long',year:'numeric'})} <span style="float:right;margin-left:10px">${rs(tot)}</span></h4><div class="g">${['M','T','W','T','F','S','S'].map(x=>'<span>'+x+'</span>').join('')}${cells}</div><div class="lg">darker = bigger day · click to open</div></div>`; }).join('');
  pop.hidden=false;
  $$('[data-pick]',pop).forEach(c=>c.onclick=()=>{ pop.hidden=true; setDay(c.dataset.pick); });
}
let rzT=null; window.addEventListener('resize',()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{ if(DOC) render(); },250); });
document.addEventListener('click',e=>{ const pop=$('calPop'); if(pop&&!pop.hidden&&!pop.contains(e.target)&&e.target.id!=='calBtn') pop.hidden=true; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ const pop=$('calPop'); if(pop) pop.hidden=true; } if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return; if(e.key==='ArrowLeft') stepDay(-1); if(e.key==='ArrowRight') stepDay(1); });

async function days(){
  const {fs,db}=FB; const sel=$('day'); const out=[];
  let err='';
  const ixf=await fetchJson('index.json'); if(ixf&&ixf.days&&Object.keys(ixf.days).length) INDEX=ixf.days;
  const cached=await IDB.get('index'); const fresh=cached&&cached.at&&(Date.now()-cached.at)<3600000&&cached.days&&cached.days[bizToday()];
  if(cached&&cached.days) INDEX=Object.assign({},cached.days,INDEX);
  if(!fresh){ try{ const ix=await fs.getDoc(fs.doc(db,'vm_meta','days')); if(ix.exists()){ const d=ix.data().days||{}; Object.keys(d).forEach(k=>{ if(!INDEX[k]||(d[k].updatedAt||'')>(INDEX[k].updatedAt||'')) INDEX[k]=d[k]; }); IDB.set('index',{at:Date.now(),days:INDEX}); } }catch(e){ if(!Object.keys(INDEX).length) err=e.code||String(e); } }
  Object.keys(INDEX).forEach(d=>{ const x=INDEX[d]||{}; if(x.bills||x.rev||x.paidOut) out.push(d); });   /* a day with nothing in it is not a day */
  /* a thin index (sync not run yet) - list the day docs themselves as well */
  if(out.length<8){ try{ const q=await fs.getDocs(fs.query(fs.collection(db,'vm_daylog'),fs.orderBy(fs.documentId(),'desc'),fs.limit(60))); q.docs.forEach(d=>{ if(!out.includes(d.id)) out.push(d.id); const x=d.data(); if(!INDEX[d.id]&&x) INDEX[d.id]={rev:x.revenue||0,bills:x.settled||0,paidOut:x.paidOut||0}; }); }catch(e){ err=e.code||String(e); } }
  out.sort().reverse();
  if(!out.includes(bizToday())) out.unshift(bizToday());
  DAYS=out;
  sel.innerHTML=out.map(d=>{ const x=INDEX[d]; return `<option value="${d}"${d===DAY?' selected':''}>${d===bizToday()?'Today · ':''}${d}${x&&x.rev?' · '+rs(x.rev):''}</option>`; }).join('');
  if(err){ $('live').className='live bad'; $('live').lastElementChild.textContent='days: '+err; }
  sel.onchange=()=>setDay(sel.value);
  $('prevDay').onclick=()=>stepDay(-1); $('nextDay').onclick=()=>stepDay(1); $('calBtn').onclick=calendar;
}

async function go(){
  let ctx; try{ ctx=await HayatAuth.start(); }catch(e){ $('main').innerHTML='<div class="note">'+esc(e.message||e)+'</div>'; return; }
  FB=ctx;
  if(ctx.role!=='office'){ $('main').innerHTML=''; await HayatAuth.form($('main'),ctx,['office'],go,'The owner board is for the office sign-in.'); return; }
  ctx.fs.onSnapshot(ctx.fs.doc(ctx.db,'vm_meta','floor'),d=>{ FLOOR=d.exists()?d.data():null; prep(DOC); prep(YDOC); render(); },()=>{});
  ctx.fs.onSnapshot(ctx.fs.doc(ctx.db,'vm_meta','health'),d=>{ HEALTH=d.exists()?d.data():null; healthPill(); },()=>{});
  $$('[data-mode]').forEach(b=>b.onclick=()=>{ MODE=b.dataset.mode; render(); });
  ctx.fs.onSnapshot(ctx.fs.doc(ctx.db,'settings','kitchen'),d=>{ KSET=d.exists()?d.data():null; render(); },()=>{});
  ctx.fs.onSnapshot(ctx.fs.doc(ctx.db,'settings','recipes'),d=>{ RCP=d.exists()?d.data():null; render(); },()=>{});
  await days(); watchDay();
  setInterval(()=>{ if(DOC){ stamp(); render(); } healthPill(); },60000);
}
go();
})();
