<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hayat · Owner</title>
<link rel="icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@600;700&display=swap">
<script src="config.js"></script>
<script src="hayat-auth.js"></script>
<style>
/* Hayat owner board. Reads ONE Firestore document - vm_daylog/<today> - that the
   shop PC's day log appends to every two minutes, plus vm_meta/floor for the
   room. One listener, so a whole day of watching costs a handful of reads. */
:root{ color-scheme:light;
  --bg:#F5F0E4; --card:#FBF8F1; --line:rgba(27,26,23,.13); --line2:rgba(27,26,23,.26); --ink:#1B1A17; --muted:#6F6758;
  --gold:#B8975A; --gold2:#7E6535; --green:#4F7A2C; --hot:#B3462B; --pri:#1B1A17; --onpri:#F5F0E4; --soft:rgba(27,26,23,.045); --soft2:rgba(27,26,23,.08);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#008300; --warn:#eda100; --bad:#e34948; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ color-scheme:dark; --bg:#171512; --card:#211e1a; --line:rgba(245,240,228,.12); --line2:rgba(245,240,228,.26); --ink:#F5F0E4; --muted:#B5AC9A; --pri:#F5F0E4; --onpri:#1B1A17; --soft:rgba(245,240,228,.05); --soft2:rgba(245,240,228,.09);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s7:#9085e9; --s8:#e66767; } }
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Outfit","Manrope","Segoe UI",system-ui,sans-serif}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font:700 18px "Cormorant Garamond",Georgia,serif;margin:0;letter-spacing:.02em}
.top .sp{flex:1}
.seg{display:inline-flex;gap:4px;background:var(--soft);border-radius:999px;padding:3px} .seg .tab{border:0;background:transparent} body.period .seg [data-mode=period],body:not(.period) .seg [data-mode=day]{background:var(--pri);color:var(--onpri)}
body.period #prevDay,body.period #nextDay,body.period #calBtn,body.period #day,body.period #live{display:none}
.nav{border:1px solid var(--line2);background:var(--card);color:var(--ink);border-radius:8px;height:32px;min-width:32px;padding:0 8px;font-size:16px;cursor:pointer} .nav:hover{background:var(--soft2)} .nav.cal{font-size:14px}
#calPop[hidden]{display:none} #calPop{position:fixed;bottom:calc(var(--dockh,120px) + 8px);top:auto;left:16px;z-index:9;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;box-shadow:0 12px 40px rgba(0,0,0,.18);display:flex;gap:18px;flex-wrap:wrap;max-width:calc(100vw - 32px)}
.cm{min-width:196px} .cm h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)} .cm .g{display:grid;grid-template-columns:repeat(7,26px);gap:3px} .cm .g span{font-size:9px;color:var(--muted);text-align:center}
.cm .d{height:26px;border-radius:6px;background:var(--soft);font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);position:relative} .cm .d.has{background:color-mix(in srgb,var(--s1) calc(var(--w) * 1%),var(--soft))} .cm .d.has.hot{color:#fff} .cm .d.cur{outline:2px solid var(--ink);outline-offset:-2px} .cm .d.none{opacity:.35;cursor:default} .cm .d:hover::after{content:attr(data-t);position:absolute;bottom:110%;left:50%;transform:translateX(-50%);background:var(--pri);color:var(--onpri);font-size:11px;padding:2px 6px;border-radius:6px;white-space:nowrap;z-index:2}
.cm .lg{font-size:10px;color:var(--muted);margin-top:6px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)} .live i{width:8px;height:8px;border-radius:50%;background:var(--good)} .live.bad i{background:var(--bad)}
select,button.tb{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:inherit;cursor:pointer} select.sm{font-size:12px;padding:4px 8px;max-width:46vw}
.wrap{max-width:1500px;margin:0 auto;padding:14px 16px 60px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi small{display:block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.kpi.click{cursor:pointer} .kpi.click:hover{border-color:var(--line2)}
.kpi em.rows{display:grid;gap:1px} .kpi em.rows span{display:flex;justify-content:space-between} .kpi em.rows b{font-size:12px;font-weight:600;display:inline;margin:0}
.kpi b{display:block;font-size:27px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.kpi em.up{color:var(--good)} .kpi em.dn{color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:900px){.grid{grid-template-columns:1fr 1fr}} @media (min-width:1300px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.card.wide{grid-column:1/-1}
.card h2{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.card h2 .n{margin-left:auto;font-weight:700;color:var(--ink);letter-spacing:0;text-transform:none;font-size:12px}
.alerts{display:grid;gap:6px}

.al.bad{border-left-color:var(--bad)} .al b{font-size:13px} .al small{color:var(--muted)} .al .ago{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.tbl.click{cursor:pointer} .tbl.click:hover{border-color:var(--line2)}
.tbl{border:1px solid var(--line);border-radius:10px;padding:8px;min-height:74px;background:var(--soft);position:relative}
.tbl b{display:block;font-size:14px} .tbl small{display:block;font-size:11px;color:var(--muted);line-height:1.35}
.tbl .tk{font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:700} .tbl b.amt{font-size:22px;line-height:1.15;font-variant-numeric:tabular-nums;margin:1px 0 2px}
/* open orders: newest first, the amount leads, the edge and the clock colour with age (green → amber → red over 40 min) */
.olist{display:grid;gap:6px;margin-top:8px}
.oo{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--soft);border-left:4px solid hsl(var(--h) 60% 42%);cursor:pointer}
.oo .ag{font-weight:800;font-size:15px;color:hsl(var(--h) 60% 38%);text-align:center;font-variant-numeric:tabular-nums;line-height:1.1} .oo .ag small{display:block;font-size:9px;letter-spacing:.08em;color:inherit;opacity:.8}
.oo .w{min-width:0} .oo .w b{display:block;font-size:14px} .oo .w small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oo .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.oo.new{box-shadow:inset 0 0 0 1px hsl(120 50% 45% / .5)} .oo.new .w b::after{content:'new';font-size:9px;letter-spacing:.1em;background:hsl(120 50% 40%);color:#fff;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}
@media (prefers-color-scheme:dark){ .oo .ag{color:hsl(var(--h) 55% 60%)} .oo{border-left-color:hsl(var(--h) 55% 55%)} }
.tbl.on{background:color-mix(in srgb,var(--s1) 14%,var(--card));border-color:color-mix(in srgb,var(--s1) 50%,transparent)}
.tbl.due{background:color-mix(in srgb,var(--s4) 18%,var(--card));border-color:color-mix(in srgb,var(--s4) 60%,transparent)}
.tbl.late{background:color-mix(in srgb,var(--s8) 14%,var(--card));border-color:color-mix(in srgb,var(--s8) 55%,transparent)}
.tbl .age{float:right;margin:-2px -2px 0 6px;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.tbl.late .age,.tbl.due .age{color:var(--ink)}
.sechead{grid-column:1/-1;font-size:11.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:6px 0 -2px}
/* an empty section folds to one line; open it to see the free tables */
.secfold{grid-column:1/-1} .secfold summary{list-style:none;cursor:pointer;font-size:11.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:6px 0;display:flex;gap:8px;align-items:center} .secfold summary::after{content:'▸';margin-left:auto} .secfold[open] summary::after{content:'▾'} .secfold .floor{margin-top:4px}
/* an hour, tapped: today against the days that matter */
.hsel{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.hsel b{font-size:15px}
/* the heat-map: days x hours, colour = how that hour did against its normal */
.heat{display:grid;gap:2px;font-size:10px;font-variant-numeric:tabular-nums}
.heat .hr{display:grid;grid-template-columns:52px repeat(var(--n),1fr);gap:2px;align-items:center}
.heat .hr>span:first-child{color:var(--muted);font-weight:700;white-space:nowrap}
.heat .c{height:20px;border-radius:3px;background:color-mix(in srgb,var(--pri) calc(var(--p) * 1%),var(--soft));display:grid;place-items:center;color:var(--ink);font-size:9px}
.heat .c.slow{outline:2px solid var(--s8,#c0882c);outline-offset:-2px} .heat .c.none{background:transparent}
.heat .hx{grid-template-columns:52px repeat(var(--n),1fr)}
.kit{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kcol{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kcol h3{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between}
.kcol h3 span{color:var(--muted);font-weight:600}
.ki{display:flex;gap:8px;padding:4px 0;border-top:1px dashed var(--line);font-size:13px} .ki.late{background:color-mix(in srgb,var(--s8) 10%,transparent)} .dn{color:var(--bad)}
.ki .q{min-width:26px;font-weight:800} .ki .w{flex:1} .ki .t{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.ki.rdy .w{text-decoration:line-through;color:var(--muted)}
.ki.del{border-left:3px solid var(--s3);padding-left:6px}
table{width:100%;border-collapse:collapse;font-size:13px} th{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line2)} td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums} td.r,th.r{text-align:right}
tr.open td{background:color-mix(in srgb,var(--s1) 8%,transparent)} tr.due td{background:color-mix(in srgb,var(--s4) 12%,transparent)}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700;background:var(--soft2)}
.pill.dine{background:color-mix(in srgb,var(--s1) 18%,transparent)} .pill.counter{background:color-mix(in srgb,var(--s4) 22%,transparent)} .pill.delivery{background:color-mix(in srgb,var(--s3) 18%,transparent)}
.bars{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;align-items:end;height:90px;margin:4px 0 2px;position:relative}
.rpbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .rpbar input[type=range]{flex:1;min-width:140px;accent-color:var(--pri);height:30px} .rpbar b{font-variant-numeric:tabular-nums;min-width:48px}
.bars .grp{display:grid;gap:1px;align-items:end;height:100%;position:relative;z-index:1} .bars .grp .bar{position:static}
.sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px} .chips .chip{border:1px solid var(--line2);background:var(--card);color:var(--muted);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer} .chips .chip.on{background:var(--pri);color:var(--onpri);border-color:transparent} .chips .chip small{font-weight:500;opacity:.8}
.ovs{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)} .ovs label{display:inline-flex;gap:5px;align-items:center;cursor:pointer} .ovs input{accent-color:var(--pri)}
.bars.axed,.hx.axed{margin-left:40px}
/* ---- the dock: everything you touch, at the bottom, within a thumb ---- */
.top .seg,.top #prevDay,.top #nextDay,.top #day,.top #calBtn{display:none}
#main{padding-bottom:calc(var(--dockh,120px) + 16px)}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line2);padding:0 0 env(safe-area-inset-bottom,0px);box-shadow:0 -8px 30px rgba(0,0,0,.08)}

#dock .tslide.ago input{accent-color:var(--s8,#c0882c)} #dock .tslide.ahead input{accent-color:var(--sea,#1f4d4a)}

#dock .chip.on{background:var(--pri);color:var(--onpri);border-color:transparent}

#dock .dn.dplay{width:auto;padding:0 12px;font-size:14px;font-weight:800;white-space:nowrap;background:var(--pri);color:var(--onpri);border-color:transparent} #dock .dn.dplay[hidden]{display:none}

.tday{display:flex;gap:6px;align-items:center;flex:0 1 360px;min-width:0}
.tday .dn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);background:var(--card);color:var(--text);font-size:18px;cursor:pointer;flex:0 0 auto;line-height:1}
.tday .dpill{flex:1;min-width:0;height:34px;border-radius:10px;border:1px solid var(--line2);background:var(--card);color:var(--text);cursor:pointer;display:flex;align-items:baseline;justify-content:center;gap:7px;padding:0 10px;font:inherit}
.tday .dpill b{font-size:14px;white-space:nowrap} .tday .dpill small{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .tday .dcar{font-style:normal;color:var(--muted);font-size:11px}
#dock{transition:transform .22s ease} #dock.hid{transform:translateY(110%)}
.sltog{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px} .sltog .chip{border:1px solid var(--line2);background:var(--card);color:var(--text);border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer} .sltog .chip.on{background:var(--pri);color:var(--onpri);border-color:transparent} .sltog .n{font-size:12.5px;color:var(--muted)}
#dock .sl{flex-direction:column;align-items:stretch;gap:4px;padding:6px 12px 4px} #dock .sl .slt{display:flex;align-items:center;gap:10px} #dock .sl .slt input{flex:1;min-width:0;accent-color:var(--pri);height:30px} #dock .sl .slt b{font-size:15px;min-width:52px;text-align:right;font-variant-numeric:tabular-nums}

.topit{--tp1:#2a78d6;--tp2:#eb6834;--tp3:#1baf7a;--tpo:#a8a49a}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .topit{--tp1:#3987e5;--tp2:#d95926;--tp3:#199e70;--tpo:#6d6a63} }
:root[data-theme="dark"] .topit{--tp1:#3987e5;--tp2:#d95926;--tp3:#199e70;--tpo:#6d6a63}
.topit .tpn button{border:1px solid var(--line2);background:var(--card);color:var(--muted);border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;margin-left:4px} .topit .tpn button.on{background:var(--pri);color:var(--onpri);border-color:transparent}
.tpstrip{display:flex;gap:2px;height:22px;margin:4px 0 8px} .tpstrip i{display:block;min-width:4px} .tpstrip i:first-child{border-radius:4px 0 0 4px} .tpstrip i:last-child{border-radius:0 4px 4px 0}
.topit .s1{background:var(--tp1)} .topit .s2{background:var(--tp2)} .topit .s3{background:var(--tp3)}

.tpn2{color:var(--muted);font-size:11.5px;text-align:right} .tpl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .tpb{height:12px} .tpb i{display:block;height:100%;background:var(--tp1);border-radius:0 4px 4px 0;min-width:2px} .tpo .tpb i{background:var(--tpo)} .tpo .tpl{color:var(--muted);font-weight:700}
.tpv{text-align:right;font-variant-numeric:tabular-nums;font-weight:700} .tpp{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}

:root[data-theme="dark"] .ssv{--sv1:#3987e5;--sv2:#d95926}
.sstop{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:2px 0 12px} .sstop small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:800} .sstop b{font-size:20px} .sstop em{display:block;font-style:normal;font-size:12px;color:var(--muted)}

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rs=n=>{ const v=Math.round(+n||0); return (v<0?'−':'')+'₹'+Math.abs(v).toLocaleString('en-IN'); };
const hm=t=>t?t.slice(11,16):'';
const T=s=>s?new Date(s.replace(' ','T')):null;
const mins=(a,b)=>a&&b?Math.round((T(b)-T(a))/60000):null;
const ago=s=>{ const m=s?Math.round((NOW-T(s))/60000):null; return m==null?'':m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' m'; };
const DAYSTART=5;
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');   /* local date - toISOString() is UTC and turned 01:00 IST into the day before */
const bizToday=()=>{ const d=new Date(); if(d.getHours()<DAYSTART) d.setDate(d.getDate()-1); return ymd(d); };
/* which of OUR kitchens cooks a VMENU item: same words the office KOT split uses */
const station=it=>{ const s=((it.cat||'')+' '+(it.n||'')).toLowerCase(); if(/fried rice|juice|lime|water|tea|coffee|shake|mojito|salad|gravy|curry|fish|shawarma|shawaya|broast|dessert|ice/.test(s)) return 'front'; if(/mandi|alfaham|bread|parotta|kuboos|chapati|meal|biryani|beef|rice/.test(s)) return 'main'; return 'front'; };

const BOARD='v219';
let FB=null, DOC=null, YDOC=null, FLOOR=null, DAY=bizToday(), NOW=Date.now(), TAB='sales', Q='', DAYS=[], INDEX={};
const $$=(sel,root)=>Array.from((root||document).querySelectorAll(sel));

/* the time slider: TCUT = minutes after the day start, null = live. Before now the day is replayed as it stood then
   (a bill settled later is open again); after now the forecast carries the strip. */
let TCUT=null;
const dayStartMs=d=>new Date(d+'T00:00:00').getTime()+BH0*3600e3;
function cutTs(day){ return TCUT==null?null:dayStartMs(day||DAY)+TCUT*60000; }
const tcutLabel=()=>{ const v=TCUT==null?0:TCUT; return String(Math.floor(((v/60)+BH0)%24)).padStart(2,'0')+':'+String(v%60).padStart(2,'0'); };
function recs(){ const all=Object.values((DOC&&DOC.records)||{}); const cut=cutTs((DOC&&DOC.day&&!String(DOC.day).includes('→'))?DOC.day:DAY); if(cut==null||MODE!=='day'||cut>=Date.now()) return all;
  const ts=s=>s?T(s).getTime():null; const out=[];
  all.forEach(r=>{ const c=ts(r.createdAt); if(c!=null&&c>cut) return; const st=ts(r.settledAt);
    if(r.status==='settled'&&st!=null&&st>cut){ const x=Object.assign({},r,{status:(r.dueAt&&ts(r.dueAt)<=cut)?'due':'open',settledAt:null,foodReady:0}); x.items=(r.items||[]).filter(i=>!i.kotAt||ts(i.kotAt)<=cut); out.push(x); return; }
    out.push(r); });
  return out; }
/* staff food: only when the ticket remark names a staff member or says staff */
const STAFF_MAX=300;
const ORDER_WORDS=/^(co|c\/o|c\.o|dm|dmu|hd|h\.d|cnt|cntr|counter|parcel|take ?away|ta|pack\w*|deliver\w*|home ?del\w*|zomato|swiggy|online)\b/i;
const staffNames=()=>new Set(Object.values((FLOOR&&FLOOR.staff)||{}).map(n=>String(n).trim().toUpperCase()).filter(Boolean));
/* the ticket remark says who ate: "tan", "viva", "SOHAIL ALF" - staff food, in any section */
const isStaff=r=>{ const rem=String(r.remarks||'').trim(); const w=rem.split(/\s+/)[0]||'';
  if(rem&&!ORDER_WORDS.test(rem)){ if(staffNames().has(w.toUpperCase())) return true; if(/^[a-z]{2,14}$/i.test(rem)&&sum(r)<=STAFF_MAX) return true; if(/\bstaff\b/i.test(rem)) return true; }
  /* a cashier bill is a counter sale to a customer - only the remark makes it staff food */
  return false; };
function prep(doc){ if(doc&&doc.records) Object.values(doc.records).forEach(r=>{ if(!r.kindRaw) r.kindRaw=r.kind; r.kind=isStaff(r)?'staff':r.kindRaw; }); return doc; }

function kpis(){
  const R=recs(), settled=R.filter(r=>r.status==='settled'), open=R.filter(r=>r.status==='open'||r.status==='due');
  const rev=settled.reduce((n,r)=>n+(r.total||0),0), y=YDOC?Object.values(YDOC.records||{}).filter(r=>r.status==='settled'):null;
  const yrev=y?y.reduce((n,r)=>n+(r.total||0),0):null;
  const dine=settled.filter(r=>r.kind==='dine'), pax=dine.reduce((n,r)=>n+(r.pax||0),0);
  const avgStay=avg(dine.map(r=>mins(r.createdAt,r.settledAt)).filter(x=>x!=null&&x<300));
  const cash=settled.reduce((n,r)=>n+(r.cash||0),0), card=settled.reduce((n,r)=>n+(r.card||0),0);
  const tables=FLOOR?FLOOR.tables.filter(t=>t.active):[]; const busy=new Set(open.filter(r=>r.kind==='dine').map(r=>r.table));
  const seats=tables.reduce((n,t)=>n+(t.chairs||0),0), seatsBusy=tables.filter(t=>busy.has(t.name)).reduce((n,t)=>n+(t.chairs||0),0);
  const d=yrev!=null?(rev-yrev):null;
  /* ordered, not yet paid: on tables, at the counter, out with riders */
  const un=k=>open.filter(r=>r.kind===k).reduce((n,r)=>n+sum(r),0), unreal=open.filter(r=>r.kind!=='staff').reduce((n,r)=>n+sum(r),0);
  return `<div class="kpis">
    <div class="kpi"><small>Sales today</small><b>${rs(rev)}</b><em class="${d==null?'':d>=0?'up':'dn'}">${d==null?settled.length+' bills':(d>=0?'▲':'▼')+' '+rs(Math.abs(d))+' vs yesterday'}</em></div>
    <div class="kpi click" data-tab="bills"><small>Unrealized · expected ${rs(rev+unreal)}</small><b>${rs(unreal)}</b><em class="rows"><span>Delivery <b>${rs(un('delivery'))}</b></span><span>CO <b>${rs(un('counter'))}</b></span><span>Dining <b>${rs(un('dine'))}</b></span></em></div>
    ${DAY!==bizToday()?'':FC?fcCard(fcToday())+tmCard():`<div class="kpi click fcoff" id="fcOnTile" title="show the forecast"><small>Forecast</small><b>◔ Show</b><em>today, tomorrow · pessimistic / neutral / optimistic</em></div>`}
    <div class="kpi"><small>Bills</small><b>${settled.length}</b><em>avg ${rs(settled.length?rev/settled.length:0)} · ${open.filter(r=>r.status==='due').length} bill printed, unpaid</em></div>
    <div class="kpi"><small>Seats</small><b>${tables.length?Math.round(100*seatsBusy/Math.max(1,seats))+'%':'—'}</b><em>${busy.size} of ${tables.length} tables · ${seatsBusy}/${seats} chairs</em></div>
    <div class="kpi"><small>Avg table time</small><b>${avgStay!=null?avgStay+' min':'—'}</b><em>${pax?pax+' covers':'covers not entered'}</em></div>
    <div class="kpi"><small>Cash · Card</small><b>${rs(cash)}</b><em>card ${rs(card)}</em></div>
    <div class="kpi click" data-tab="buy" title="open purchases & payments"><small>Paid out</small><b>${rs(DOC.paidOut||0)}</b><em>${DOC.paymentCount||0} entries${DOC.draftTotal?' · <b>'+rs(DOC.draftTotal)+' being entered</b>':''}${DOC.paidIn?' · in '+rs(DOC.paidIn):''}${rev&&DOC.paidOut?' · '+Math.round(100*DOC.paidOut/rev)+'% of sales':''}</em></div>
  </div>${DAY===bizToday()&&FC?scnBar():''}`;
}
function avg(xs){ return xs.length?Math.round(xs.reduce((a,b)=>a+b,0)/xs.length):null; }

function alerts(){
  const R=recs(), out=[];
  R.filter(r=>(r.status==='open'||r.status==='due')&&r.kind!=='staff').forEach(r=>{
    const age=mins(r.createdAt, tsNow()), sinceDue=r.dueAt?mins(r.dueAt,tsNow()):null;
    /* a delivery bill is settled when the rider is back - or at the end of the day; never an alert */
    const note=r.remarks?' · “'+r.remarks+'”':'';
    if(r.status==='due'&&sinceDue>10&&r.kind!=='delivery') out.push({bad:sinceDue>25,b:`${r.table||'Token '+(r.token||'')} · bill printed, not paid`,s:`${r.waiter||''} · ${rs(sum(r))}${note}`,ago:sinceDue+' min'});
    else if(r.kind==='dine'&&age>75) out.push({bad:age>110,b:`${r.table} · seated a long time`,s:`${r.waiter||''} · ${r.kotCount} KOT · ${rs(sum(r))}`,ago:age+' min'});
    else if(r.kind==='counter'&&age>15) out.push({bad:age>30,b:`Token ${r.token||r.kot} · waiting at counter`,s:(r.remarks?'“'+r.remarks+'” · ':'')+(r.items||[]).map(i=>i.q+'× '+i.n).join(', ').slice(0,60),ago:age+' min'});
    /* a delivery takes longer by nature: cooking + the road + the rider coming back before it can be settled */
    else if(r.kind==='delivery'&&age>90) out.push({bad:age>150,b:`Delivery ${r.customer&&r.customer.name||('KOT '+r.kot)} · still open`,s:(r.rider?'rider '+r.rider:'no rider')+(r.dispatchAt?' · left '+hm(r.dispatchAt):' · not dispatched')+' · '+rs(sum(r)),ago:age+' min'});
    else if(r.kind==='delivery'&&!r.dispatchAt&&age>35) out.push({bad:age>60,b:`Delivery ${r.customer&&r.customer.name||('KOT '+r.kot)} · not dispatched`,s:(r.rider?'rider '+r.rider:'no rider')+' · '+rs(sum(r)),ago:age+' min'});
    const lateLines=(r.items||[]).filter(i=>lineState(i,r)==='late'); if(lateLines.length){ const worst=Math.max(...lateLines.map(i=>(i.kotAt?mins(i.kotAt,tsNow()):0)-prepMin(i))); out.push({bad:worst>10,b:`${r.table||'Token '+(r.token||r.kot)} · kitchen running late`,s:lateLines.map(i=>i.q+'× '+i.n).join(', ').slice(0,60),ago:worst+' min over'}); }
  });
  const voids=R.reduce((n,r)=>n+(r.edits||[]).length,0);
  return `<div class="card wide"><h2>Needs attention <span class="n">${out.length?out.length:'all calm'}${voids?' · '+voids+' edits/voids today':''}</span></h2>`+
    (out.length?`<div class="alerts">${out.sort((a,b)=>parseInt(b.ago)-parseInt(a.ago)).map(a=>`<div class="al${a.bad?' bad':''}"><b>${esc(a.b)}</b><small>${esc(a.s)}</small><span class="ago">${esc(a.ago)}</span></div>`).join('')}</div>`:'<div class="note">Nothing waiting too long.</div>')+'</div>';
}
function sum(r){ return r.total!=null?r.total:(r.items||[]).reduce((n,i)=>n+(i.a||0),0); }
function discOf(r){ const menu=(r.items||[]).reduce((n,i)=>n+(i.a||0),0); const off=r.status==='settled'&&r.total!=null&&menu?Math.round(menu-r.total):0; return Math.max(r.discount||0,off>0?off:0); }
/* how long a bill lives: order -> bill printed -> paid; delivery also order -> out the door */
function closeStats(R){
  const g={}, keep=(x,lim)=>x!=null&&x>=0&&x<=lim;
  R.filter(r=>r.status==='settled'&&r.kind!=='staff').forEach(r=>{
    const k=r.kind==='dine'?(r.section||'Dine'):r.kind==='delivery'?'Delivery':r.kind==='counter'?'Counter':null; if(!k) return;
    const x=g[k]=g[k]||{n:0,toBill:[],toPay:[],total:[],toGo:[]}; x.n++;
    const a=mins(r.createdAt,r.dueAt), b=mins(r.dueAt,r.settledAt), t=mins(r.createdAt,r.settledAt), d=mins(r.createdAt,r.dispatchAt);
    if(keep(a,300)) x.toBill.push(a); if(keep(b,600)) x.toPay.push(b); if(keep(t,600)) x.total.push(t); if(keep(d,300)) x.toGo.push(d);
  });
  return g;
}
/* where today stands against the same clock on other days */
function pace(){
  const live=DAY===bizToday();
  const nowH=(()=>{ const d=new Date(NOW); return (d.getHours()-BH0+24)%24 + d.getMinutes()/60; })();
  const upto=live?nowH:24;
  const till=(H)=>{ if(!H) return null; let t=0; for(let i=0;i<24;i++){ if(i+1<=upto) t+=H[i]||0; else if(i<upto) t+=(H[i]||0)*(upto-i); } return t; };
  const H=hbucket(recs().filter(r=>r.status==='settled')), today=till(H);
  const y=new Date(DAY+'T12:00:00'); y.setDate(y.getDate()-1); const yd=ymd(y);
  const yH=YDOC?hbucket(Object.values(YDOC.records||{}).filter(r=>r.status==='settled')):(INDEX[yd]&&INDEX[yd].hours);
  const w=new Date(DAY+'T12:00:00'); w.setDate(w.getDate()-7); const wd=ymd(w), wH=INDEX[wd]&&INDEX[wd].hours;
  const last7=[]; for(let i=1;i<=7;i++){ const x=new Date(DAY+'T12:00:00'); x.setDate(x.getDate()-i); const k=ymd(x); if(INDEX[k]&&INDEX[k].hours) last7.push(till(INDEX[k].hours)); }
  const avg7=last7.length?last7.reduce((a,b)=>a+b,0)/last7.length:null;
  const full7=[]; for(let i=1;i<=7;i++){ const x=new Date(DAY+'T12:00:00'); x.setDate(x.getDate()-i); const k=ymd(x); if(INDEX[k]&&INDEX[k].rev) full7.push(INDEX[k].rev); }
  const proj=(live&&avg7&&full7.length)?today/avg7*(full7.reduce((a,b)=>a+b,0)/full7.length):null;
  const dow=d=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(d+'T12:00:00').getDay()];
  const row=(k,v,sub)=>{ const d=v!=null&&v?Math.round(100*(today-v)/v):null; return `<div class="mrow"><span>${k}${sub?' <small style="color:var(--muted)">'+sub+'</small>':''}</span><div class="b" style="width:${v!=null?Math.min(100,100*v/Math.max(1,today,v)):0}%"></div><span class="v">${v==null?'—':rs(v)}${d!=null?` <span class="d ${d>=0?'up':'dn'}">${d>=0?'+':''}${d}%</span>`:''}</span></div>`; };
  const at=live?hm(tsNow()):'full day';
  return `<div class="card"><h2>Pace <span class="n">by ${at}${live?' · today so far '+rs(today):''}</span></h2><div class="mini">
    ${row('Today',today)}${row('Yesterday by now',till(yH),dow(yd))}${row('Last week same day',till(wH),dow(wd))}${row('Last 7 days avg by now',avg7,last7.length+' days')}</div>
    ${proj?`<p class="note">On this pace today closes around <b>${rs(proj)}</b> (last 7 days average close ${rs(full7.reduce((a,b)=>a+b,0)/full7.length)}).</p>`:(Object.keys(INDEX).length<3?'<p class="note">Fills in once the day index has a week of days (daylog-backfill-all.bat).</p>':'')}</div>`;
}
function tables(){
  const g={}; recs().filter(r=>r.status==='settled'&&r.kind==='dine'&&r.table).forEach(r=>{ const x=g[r.table]=g[r.table]||{sec:r.section,n:0,v:0,stay:[],pax:0}; x.n++; x.v+=sum(r); x.pax+=r.pax||0; const t=mins(r.createdAt,r.settledAt); if(t!=null&&t>=0&&t<=600) x.stay.push(t); });
  const rows=Object.entries(g).sort((a,b)=>b[1].v-a[1].v); if(!rows.length) return '';
  const turns=rows.reduce((n,r)=>n+r[1].n,0);
  return `<div class="card"><h2>Tables <span class="n">${rows.length} used · ${turns} turns</span></h2><table><tr><th>Table</th><th class="m">Section</th><th class="r">Turns</th><th class="r">Sales</th><th class="r">Avg bill</th><th class="r">Avg stay</th><th class="r m">₹/min</th></tr>${rows.map(([t,x])=>{ const st=avg(x.stay); return `<tr><td>${esc(t)}</td><td class="m">${esc(x.sec||'')}</td><td class="r">${x.n}</td><td class="r">${rs(x.v)}</td><td class="r">${rs(x.v/x.n)}</td><td class="r">${st!=null?st+'m':'—'}</td><td class="r m">${st?Math.round(x.v/x.n/st):'—'}</td></tr>`; }).join('')}</table></div>`;
}
/* every quantity cut or line removed, who did it and what it was worth */
function voidList(){
  const out=[], book={}; recs().forEach(r=>(r.items||[]).forEach(i=>{ if(i.p&&!book[i.n]) book[i.n]=i.p; }));   /* a removed line is no longer on its bill; price it from any bill of the day */
  recs().forEach(r=>(r.edits||[]).forEach(e=>{ const it=(r.items||[]).find(i=>i.n===e.item); const price=e.price||(it&&it.p)||book[e.item]||0; const gone=e.void||e.from===e.to; const cut=gone?(e.from||e.to||0):Math.max(0,(e.from||0)-(e.to||0));   /* VMENU logs a removed line as old = new */
    out.push({key:r.key,kot:r.kot,table:r.table||(r.token?'T'+r.token:''),waiter:r.waiter,at:e.at,item:e.item,from:e.from,to:e.to,cut,value:cut*price,reason:e.reason,by:e.by||r.waiter||'—',void:gone,remarks:e.remarks&&e.remarks!==e.reason?e.remarks:null}); }));
  return out.sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')));
}
function voids(){
  const V=voidList(); if(!V.length) return '';
  const g={}; V.forEach(v=>{ const x=g[v.by]=g[v.by]||{n:0,cut:0,v:0}; x.n++; x.cut+=v.cut; x.v+=v.value; });
  const rows=Object.entries(g).sort((a,b)=>b[1].v-a[1].v), max=Math.max(1,...rows.map(r=>r[1].v)), tot=V.reduce((n,v)=>n+v.value,0);
  return `<div class="card"><h2>Voids · by person <span class="n">${V.length} · ${rs(tot)}</span></h2><div class="mini">${rows.map(([k,x])=>`<div class="mrow"><span>${esc(k)} <small style="color:var(--muted)">${x.n} · ${x.cut} qty</small></span><div class="b" style="width:${100*x.v/max}%"></div><span class="v">${rs(x.v)}</span></div>`).join('')}</div></div>`+
    `<div class="card wide"><h2>Voids &amp; edits <span class="n">click a row for the bill</span></h2><div class="scroll"><table><tr><th>Time</th><th class="m">KOT</th><th class="m">Table</th><th>By</th><th>Item</th><th class="r">Qty</th><th class="m">Reason</th><th class="r">Value</th></tr>${V.map(v=>`<tr class="rowlink" data-drill="${esc(v.key)}"><td>${hm(v.at)}</td><td class="m">${esc(v.kot)}</td><td class="m">${esc(v.table)}</td><td>${esc(v.by)}</td><td>${esc(v.item)}${v.void?' <small style="color:var(--muted)">removed</small>':''}</td><td class="r">${v.void?'−'+v.cut:v.from+'→'+v.to}</td><td class="m">${esc(v.reason||'')}${v.remarks?' · '+esc(v.remarks):''}</td><td class="r">${rs(v.value)}</td></tr>`).join('')}</table></div></div>`;
}
/* the extras a waiter adds around the main course - or does not */
const EXTRAS=[['Desserts',/dessert|ice ?cream|pudding|halwa|kunafa|cake|brownie|faluda|sweet/i],['Salads',/salad|hummus|tabbouleh|raita|mezze/i],['Juices',/juice|lime|shake|lassi|smoothie/i],['Mojitos',/mojito|mocktail|soda|cooler|fresh drink/i],['Soups & starters',/soup|starter|snack|fries|nugget/i]];
const extraKind=i=>{ const t=(i.cat||'')+' '+(i.n||''); for(const [k,re] of EXTRAS) if(re.test(t)) return k; return null; };
function upsell(){
  const g={}; recs().filter(r=>r.status==='settled'&&r.kind!=='staff'&&r.waiter).forEach(r=>{ const w=g[r.waiter]=g[r.waiter]||{bills:0,with:0,v:0,k:{}}; w.bills++; let any=false;
    (r.items||[]).forEach(i=>{ const k=extraKind(i); if(!k) return; any=true; w.k[k]=(w.k[k]||0)+(i.q||0); w.v+=i.a||0; }); if(any) w.with++; });

/* A delivery ticket stays open long after the food left - the rider is on the

/* business day runs 05:00 → 04:59; a bill settled at 01:00 belongs to the
   evening before it. Index 0 = 05:00 … index 23 = 04:00 next morning. */
const BH0=5;

/* RAIN: Open-Meteo (free tier: non-commercial, CC-BY 4.0; Majid chose it for now, 10 Oct 2026).

/* ============================================================
   PATTERNS - normal business by hour (large orders out), by weekday and
   week of the month, and a forecast you can read step by step.
   ============================================================ */
const PT_WK=d=>{ const n=+d.slice(8,10); return n<=7?'W1':n<=14?'W2':n<=21?'W3':n<=28?'W4':'W5'; };
const PT_WKN={All:'All weeks',W1:'Week 1 (1–7)',W2:'Week 2 (8–14)',W3:'Week 3 (15–21)',W4:'Week 4 (22–28)',W5:'29th – 31st'};
const PT_DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], PT_ORDER=[1,2,3,4,5,6,0];
let PT={dow:null,week:null,method:'median',back:12,fday:null,lines:'each',hl:null};
function ptStat(vals){ const v=vals.filter(x=>x!=null).slice().sort((a,b)=>a-b), n=v.length; if(!n) return null;
  if(PT.method==='median') return n%2?v[(n-1)/2]:(v[n/2-1]+v[n/2])/2;
  const cut=n>=5?Math.floor(n*0.15)||1:0, w=v.slice(cut,n-cut); return w.reduce((a,b)=>a+b,0)/w.length; }
const ptQ=(vals,q)=>{ const v=vals.slice().sort((a,b)=>a-b); if(!v.length) return 0; const i=(v.length-1)*q, lo=Math.floor(i), hi=Math.ceil(i); return v[lo]+(v[hi]-v[lo])*(i-lo); };
/* the days behind an average: past days with hours, last N weeks, that weekday, that week of month, no holiday */
function ptDays(dow,week,before){ const end=before||bizToday(); const from=new Date(end+'T12:00:00'); from.setDate(from.getDate()-7*PT.back); const f=ymd(from);
  return Object.keys(INDEX).filter(d=>d<end&&d>=f&&INDEX[d].hours&&nrev(d)>0&&!HOLI[d]&&(dow==null||new Date(d+'T12:00:00').getDay()===dow)&&(!week||week==='All'||PT_WK(d)===week)).sort().reverse(); }
function ptProfile(days){ const P=Array(24).fill(0), L=Array(24).fill(0), U=Array(24).fill(0);
  for(let h=0;h<24;h++){ const v=days.map(d=>INDEX[d].hours[h]||0); P[h]=ptStat(v)||0; L[h]=ptQ(v,0.25); U[h]=ptQ(v,0.75); } return {P,L,U}; }
/* week-of-month factor for a weekday: that week's typical day vs all weeks, pulled toward 1 when it rests on few days */
function ptWeekFactor(dow,week,before){ const all=ptDays(dow,'All',before), sel=all.filter(d=>PT_WK(d)===week); if(all.length<3||!sel.length) return {f:1,n:sel.length};
  const a=ptStat(all.map(nrev)), s=ptStat(sel.map(nrev)); if(!a) return {f:1,n:sel.length}; const r=s/a, n=sel.length; return {f:1+(r-1)*n/(n+2),raw:r,n}; }
/* the readable forecast: normal weekday x week of month x trend x holiday */

/* every day of the span and a week either side, read once (cached days cost nothing) */
async function spScan(){
  const key=PER.from+'|'+PER.to; if(SPD.busy||SPD.key===key) return; SPD.busy=true; SPD.key=key; SPD.dups=null; SPD.prog=0; render();
  const D=spDays(addDays(PER.from,-7),addDays(PER.to,7)>bizToday()?bizToday():addDays(PER.to,7)).filter(d=>INDEX[d]&&((INDEX[d].purchases||0)+(INDEX[d].paidOut||0))>0);
  for(let i=0;i<D.length;i++){ const d=D[i]; if(!SPD.docs[d]) SPD.docs[d]=d===bizToday()?DOC:await loadDay(d); SPD.prog=(i+1)/D.length; if(i%5===4&&MODE==='period'&&PTAB==='money'){ const el=$('spProg'); if(el) el.textContent=Math.round(100*SPD.prog)+'%'; } }

function spFind(D){
  const groups={}; const add=(sig,lvl,x)=>{ (groups[sig]=groups[sig]||{lvl,items:[]}).items.push(x); };
  const norm=s=>String(s||'').toLowerCase().replace(/\s+/g,' ').trim(), r0=v=>Math.round(+v||0);
  D.forEach(day=>{ const doc=SPD.docs[day]; if(!doc) return;
    Object.entries(doc.purchases||{}).forEach(([k,p])=>{ const x={day,coll:'purchases',key:k,e:p,amt:+p.total||0,what:(p.supplier||'—')+(p.billNo?' · bill '+p.billNo:''),at:p.at};
      if(p.id!=null) add('pk|'+p.id,'certain',x);   /* VMENU's own purchase id: the same bill */
      if(p.billNo) add('pb|'+norm(p.supplier)+'|'+norm(p.billNo)+'|'+r0(p.total),'very likely',x);
      const it=(p.items||[]).map(i=>norm(i.n)+'×'+(+i.q||0)).sort().join(','); if(it&&r0(p.total)>=200) add('pi|'+norm(p.supplier)+'|'+r0(p.total)+'|'+it,'possible',x); });
    Object.entries(doc.payments||{}).forEach(([k,p])=>{ if(p.deleted) return; const x={day,coll:'payments',key:k,e:p,amt:+p.amount||0,what:payKind(p)+' · '+(p.party||p.remarks||'—'),at:p.at};
      if(p.id!=null) add('yk|'+p.id,'certain',x);   /* VMENU's transaction id */
      if(r0(p.amount)>=100) add('yp|'+norm(p.party)+'|'+r0(p.amount)+'|'+norm(p.remarks)+'|'+norm(payKind(p)),'possible',x); }); });
  /* a group counts when its copies sit on different days, close together */
  const seen=new Set(), out=[]; const rank={'certain':0,'very likely':1,'possible':2};

    const span=(new Date(days.sort().slice(-1)[0])-new Date(days[0]))/864e5; if(g.lvl!=='certain'&&span>10) return;
    /* the same amount to the same person on 3+ days is a routine (daily wages), not a moved entry */
    if(g.lvl!=='certain'&&days.length>=3) return;
    const id=g.items.map(x=>x.day+'/'+x.coll+'/'+x.key).sort().join('&'); if(seen.has(id)) return; seen.add(id);
    /* the copy whose own date is its day is the one VMENU holds; the other is the stale one */

    if(g.items.some(x=>x.day>=PER.from&&x.day<=PER.to)) out.push(g); });

}

/* an entry that does not belong to this day (saved on the wrong date, later corrected in VMENU):
   the owner can drop it here. The totals, the day index and the month snapshot follow. */
async function removeEntry(day,coll,key){
  const doc=day===bizToday()?DOC:await loadDay(day); if(!doc||!doc[coll]||!doc[coll][key]) return;
  const e=doc[coll][key]; const what=coll==='purchases'?`supplier bill ${e.billNo?'#'+e.billNo:''} ${rs(e.total)}`:`${payKind(e)} ${e.party||e.remarks||''} ${rs(e.amount)}`;
  if(!confirm(`Remove ${what} from ${day}?\n\nUse this only for an entry the cashier moved to another day. The shop PC will not bring it back unless VMENU still has it on this day.`)) return;
  const {fs,db}=FB; const rest=Object.assign({},doc[coll]); delete rest[key];
  const patch={}; patch[coll+'.'+key]=fs.deleteField();
  if(coll==='purchases'){ patch.purchaseCount=Object.keys(rest).length; patch.purchaseTotal=Math.round(100*Object.values(rest).reduce((n,x)=>n+(x.total||0),0))/100; }
  else { const live=Object.values(rest).filter(x=>!x.deleted); patch.paymentCount=live.length; patch.paidOut=Math.round(100*live.filter(x=>x.flow==='out').reduce((n,x)=>n+(x.amount||0),0))/100; patch.paidIn=Math.round(100*live.filter(x=>x.flow==='in').reduce((n,x)=>n+(x.amount||0),0))/100; }
  try{ await fs.updateDoc(fs.doc(db,'vm_daylog',day),patch); }catch(err){ alert('Could not remove: '+(err.code||err)); return; }
  const ip={}; if(patch.paidOut!=null) ip['days.'+day+'.paidOut']=patch.paidOut; if(patch.purchaseTotal!=null) ip['days.'+day+'.purchases']=patch.purchaseTotal;
  try{ if(Object.keys(ip).length) await fs.updateDoc(fs.doc(db,'vm_meta','days'),ip); }catch(e){}
  const m=day.slice(0,7); try{ await fs.deleteDoc(fs.doc(db,'vm_months',m)); }catch(e){}
  await IDB.del('day:'+day); await IDB.del('month:'+m); delete CACHE[day]; LASTBUILD=null; CASHV.chain=null;
  if(INDEX[day]){ if(patch.paidOut!=null) INDEX[day].paidOut=patch.paidOut; if(patch.purchaseTotal!=null) INDEX[day].purchases=patch.purchaseTotal; }
  if(day!==bizToday()){ delete doc[coll][key]; Object.assign(doc,patch,{[coll]:rest}); if(DAY===day) DOC=doc; }
  const dr=document.getElementById('drill'); if(dr) dr.remove();
  if(MODE==='period') loadPeriod(PER.from,PER.to,PER.label,true); else render();
}

function normalHour(day,h){ /* typical value of this weekday-hour: median of the last 8 same weekdays before `day` */

    return `<div class="hr"><span>${wd[new Date(d+'T12:00:00').getDay()]} ${d.slice(8)}</span>${cells.join('')}</div>`; });
  const byHour={}; slow.forEach(x=>{ byHour[x.h]=(byHour[x.h]||0)+1; }); const worst=Object.entries(byHour).sort((a,b)=>b[1]-a[1]).slice(0,3);

function kpiText(){ return [...document.querySelectorAll('.kpi')].map(k=>'• '+txt(k.querySelector('small'))+': *'+txt(k.querySelector('b'))+'*'+(k.querySelector('em')?' ('+txt(k.querySelector('em'))+')':'')).join('\n'); }
function addShare(){ $$('.card h2').forEach(h=>{ if(h.querySelector('.sh')) return; const b=document.createElement('button'); b.className='sh'; b.title='share on WhatsApp'; b.textContent='📤'; b.onclick=e=>{ e.stopPropagation(); e.preventDefault(); shareText(cardText(h.closest('.card')),''); }; h.appendChild(b); });
  const k=document.querySelector('.kpis'); if(k&&!k.querySelector('.sh')){ const b=document.createElement('button'); b.className='sh kpish'; b.title='share the summary'; b.textContent='📤'; b.onclick=()=>shareText(kpiText(),MODE==='period'?PER.label:'Day'); k.appendChild(b); } }
/* ---- phones: a table that does not fit becomes stacked row-cards, never a sideways scroll ---- */
function fitTables(){ if(window.innerWidth>640) return; $$('main table, #main table').forEach(t=>{ t.classList.remove('stack'); const host=t.closest('.scroll')||t.parentElement; if(t.scrollWidth>host.clientWidth+2){ const heads=[...t.querySelectorAll('tr th')].map(txt); t.querySelectorAll('tr').forEach(tr=>[...tr.children].forEach((td,i)=>{ if(td.tagName==='TD') td.dataset.h=heads[i]||''; })); t.classList.add('stack'); } }); }
function stamp(){ const l=$('live'); if(!DOC){ l.className='live bad'; l.lastElementChild.textContent='no data'; return; }
  if(DAY!==bizToday()){ l.className='live'; l.lastElementChild.textContent=({file:'from file',cache:'from this device',firebase:'from Firebase'}[SRC[DAY]]||'')+' · '+DAY; return; }
  const age=Math.max(0,Math.round((Date.now()-T(DOC.updatedAt))/60000)); l.className='live'+(age>6?' bad':''); l.lastElementChild.textContent=(age>6?'stale · ':'live · ')+age+' min ago'; }
/* the shop PC's own health note (watchdog.py, every 5 min) */
let HEALTH=null;
function healthPill(){ const el=$('pc'); if(!el) return; if(!HEALTH){ el.hidden=true; return; } el.hidden=false;
  const age=Math.round((NOW-T(HEALTH.at))/60000), bad=age>12||!HEALTH.ok; el.className='live'+(bad?' bad':'');
  const bads=Object.entries(HEALTH.tasks||{}).filter(([k,t])=>!t.ok).map(([k])=>k.replace('Hayat ','')).join(', ');
  el.lastElementChild.textContent='shop PC '+(age>12?'silent '+age+' min':bad?'fixing: '+bads:'ok'); el.title=(HEALTH.host||'')+' · '+HEALTH.at+(HEALTH.disk?' · disk free '+HEALTH.disk+' GB':'')+((HEALTH.actions||[]).length?'\n'+HEALTH.actions.join('\n'):''); }

/* the calendar: three months of squares, darker = bigger day */
function setDay(d){ if(!d||d===DAY) return; rpStop(); SIM.pick=[]; SIM.touched=false; SIM.hour=null; SIM.open=null; RP.days=[]; RP.auto=true; RP.docs={}; RP.cur={}; DAY=d; TCUT=null; CMP=null; WEEK=null; const sel=$('day'); if(sel&&[...sel.options].some(o=>o.value===d)) sel.value=d; watchDay(); }
function stepDay(n){ const list=(DAYS||[]).slice().sort(); const i=list.indexOf(DAY); const d=list[i+n]; if(d) setDay(d); }
function calendar(){
  const pop=$('calPop'); if(!pop.hidden){ pop.hidden=true; return; }
  const max=Math.max(1,...Object.values(INDEX).map(x=>x.rev||0));
  const months=[]; const b=new Date(bizToday()+'T12:00:00'); for(let i=2;i>=0;i--){ const x=new Date(b.getFullYear(),b.getMonth()-i,1,12); months.push(x); }
  pop.innerHTML=months.map(m=>{ const y=m.getFullYear(), mo=m.getMonth(), first=(new Date(y,mo,1).getDay()+6)%7, n=new Date(y,mo+1,0).getDate(); let cells='';
    for(let i=0;i<first;i++) cells+='<i></i>';
    for(let d=1;d<=n;d++){ const k=ymd(new Date(y,mo,d,12)); const x=INDEX[k]; const v=x?x.rev||0:0; const w=Math.round(100*v/max);
      cells+=`<div class="d${v?' has':' none'}${w>55?' hot':''}${k===DAY?' cur':''}" style="--w:${Math.max(12,w)}" data-t="${k} ${v?rs(v)+' · '+(x.bills||0)+' bills':'no data'}" ${v?`data-pick="${k}"`:''}>${d}</div>`; }
    const tot=Object.keys(INDEX).filter(k=>k.startsWith(ymd(m).slice(0,7))).reduce((a,k)=>a+(INDEX[k].rev||0),0);
    return `<div class="cm"><h4>${m.toLocaleString('en',{month:'long',year:'numeric'})} <span style="float:right;margin-left:10px">${rs(tot)}</span></h4><div class="g">${['M','T','W','T','F','S','S'].map(x=>'<span>'+x+'</span>').join('')}${cells}</div><div class="lg">darker = bigger day · click to open</div></div>`; }).join('');
  pop.hidden=false;
  $$('[data-pick]',pop).forEach(c=>c.onclick=()=>{ pop.hidden=true; setDay(c.dataset.pick); });
}
let rzT=null; window.addEventListener('resize',()=>{ clearTimeout(rzT); rzT=setTimeout(()=>{ if(DOC) render(); },250); });
document.addEventListener('click',e=>{ const pop=$('calPop'); if(pop&&!pop.hidden&&!pop.contains(e.target)&&e.target.id!=='calBtn'&&!e.target.closest('[data-r="pick"],#dPick')) pop.hidden=true; });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ const pop=$('calPop'); if(pop) pop.hidden=true; } if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return; if(e.key==='ArrowLeft') stepDay(-1); if(e.key==='ArrowRight') stepDay(1); });

async function days(){
  const {fs,db}=FB; const sel=$('day'); const out=[];
  let err='';
  const ixf=await fetchJson('index.json'); if(ixf&&ixf.days&&Object.keys(ixf.days).length) INDEX=ixf.days;
  const cached=await IDB.get('index'); const fresh=cached&&cached.at&&(Date.now()-cached.at)<3600000&&cached.days&&cached.days[bizToday()];
  if(cached&&cached.days) INDEX=Object.assign({},cached.days,INDEX);
  if(!fresh){ try{ const ix=await fs.getDoc(fs.doc(db,'vm_meta','days')); if(ix.exists()){ const d=ix.data().days||{}; Object.keys(d).forEach(k=>{ if(!INDEX[k]||(d[k].updatedAt||'')>(INDEX[k].updatedAt||'')) INDEX[k]=d[k]; }); IDB.set('index',{at:Date.now(),days:INDEX}); } }catch(e){ if(!Object.keys(INDEX).length) err=e.code||String(e); } }
  Object.keys(INDEX).forEach(d=>{ const x=INDEX[d]||{}; if(x.bills||x.rev||x.paidOut) out.push(d); });   /* a day with nothing in it is not a day */
  /* a thin index (sync not run yet) - list the day docs themselves as well */
  if(out.length<8){ try{ const q=await fs.getDocs(fs.query(fs.collection(db,'vm_daylog'),fs.orderBy(fs.documentId(),'desc'),fs.limit(60))); q.docs.forEach(d=>{ if(!out.includes(d.id)) out.push(d.id); const x=d.data(); if(!INDEX[d.id]&&x) INDEX[d.id]={rev:x.revenue||0,bills:x.settled||0,paidOut:x.paidOut||0}; }); }catch(e){ err=e.code||String(e); } }
  out.sort().reverse(); applyLarge();
  if(!out.includes(bizToday())) out.unshift(bizToday());
  DAYS=out;
  sel.innerHTML=out.map(d=>{ const x=INDEX[d]; return `<option value="${d}"${d===DAY?' selected':''}>${d===bizToday()?'Today · ':''}${d}${x&&x.rev?' · '+rs(x.rev):''}</option>`; }).join('');
  if(err){ $('live').className='live bad'; $('live').lastElementChild.textContent='days: '+err; }
  sel.onchange=()=>setDay(sel.value);
  $('prevDay').onclick=()=>stepDay(-1); $('nextDay').onclick=()=>stepDay(1); $('calBtn').onclick=calendar; dockWire();
}

async function go(){
  let ctx; try{ ctx=await HayatAuth.start(); }catch(e){ $('main').innerHTML='<div class="note">'+esc(e.message||e)+'</div>'; return; }
  FB=ctx;
  if(ctx.role!=='office'){ $('main').innerHTML=''; await HayatAuth.form($('main'),ctx,['office'],go,'The owner board is for the office sign-in.'); return; }
  ctx.fs.onSnapshot(ctx.fs.doc(ctx.db,'vm_meta','floor'),d=>{ FLOOR=d.exists()?d.data():null; prep(DOC); prep(YDOC); render(); },()=>{});
  ctx.fs.onSnapshot(ctx.fs.doc(ctx.db,'vm_meta','health'),d=>{ HEALTH=d.exists()?d.data():null; healthPill(); },()=>{});
  $$('[data-mode]').forEach(b=>b.onclick=()=>{ MODE=b.dataset.mode; render(); });
  ctx.fs.onSnapshot(ctx.fs.doc(ctx.db,'settings','kitchen'),d=>{ KSET=d.exists()?d.data():null; render(); },()=>{});
  ctx.fs.onSnapshot(ctx.fs.doc(ctx.db,'settings','recipes'),d=>{ RCP=d.exists()?d.data():null; render(); },()=>{});
  ctx.fs.onSnapshot(ctx.fs.doc(ctx.db,'settings','events'),d=>{ EVENTS=(d.exists()&&d.data().e)||{}; LAB.res=null; render(); },()=>{});
  ctx.fs.onSnapshot(ctx.fs.doc(ctx.db,'settings','large_orders'),d=>{ LARGE=(d.exists()&&d.data().b)||{}; LGSCAN=Object.assign(LGSCAN,(d.exists()&&d.data().s)||{}); applyLarge(); syncIndexToday(); FC_BT=null; render(); },()=>{});
  ctx.fs.onSnapshot(ctx.fs.doc(ctx.db,'settings','weather'),d=>{ const busy=WX.busy; WX=d.exists()?Object.assign({},d.data()):{days:{}}; WX.busy=busy; WX.loaded=true; render(); setTimeout(wxSync,1500); },()=>{ WX.loaded=true; setTimeout(wxSync,1500); });
  setInterval(()=>wxSync(),30*60e3);   /* while the app stays open: check every 30 min, pull when over 6 h old */
  await days(); watchDay(); setTimeout(preScan,5000);
  [bizToday(),tomorrow()].forEach(day=>ctx.fs.onSnapshot(ctx.fs.doc(ctx.db,'vm_prebook',day),d=>{ PBK[day]=(d.exists()&&d.data().e)||{}; render(); },()=>{}));
  setInterval(()=>{ if(DOC){ stamp(); render(); } healthPill(); },60000);
}
go();
})();
