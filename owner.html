<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hayat · Owner</title>
<link rel="icon" href="assets/icon-192.png">
<script src="config.js"></script>
<script src="hayat-auth.js"></script>
<style>
/* Hayat owner board. Reads ONE Firestore document - vm_daylog/<today> - that the
   shop PC's day log appends to every two minutes, plus vm_meta/floor for the
   room. One listener, so a whole day of watching costs a handful of reads. */
:root{ color-scheme:light;
  --bg:#F5F0E4; --card:#FBF8F1; --line:rgba(27,26,23,.13); --line2:rgba(27,26,23,.26); --ink:#1B1A17; --muted:#6F6758;
  --gold:#B8975A; --gold2:#7E6535; --green:#4F7A2C; --hot:#B3462B; --pri:#1B1A17; --onpri:#F5F0E4; --soft:rgba(27,26,23,.045); --soft2:rgba(27,26,23,.08);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#008300; --warn:#eda100; --bad:#e34948; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ color-scheme:dark; --bg:#171512; --card:#211e1a; --line:rgba(245,240,228,.12); --line2:rgba(245,240,228,.26); --ink:#F5F0E4; --muted:#B5AC9A; --pri:#F5F0E4; --onpri:#1B1A17; --soft:rgba(245,240,228,.05); --soft2:rgba(245,240,228,.09);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s7:#9085e9; --s8:#e66767; } }
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Manrope","Segoe UI",system-ui,sans-serif}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{font:700 18px "Cormorant Garamond",Georgia,serif;margin:0;letter-spacing:.02em}
.top .sp{flex:1}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)} .live i{width:8px;height:8px;border-radius:50%;background:var(--good)} .live.bad i{background:var(--bad)}
select,button.tb{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:inherit;cursor:pointer}
.wrap{max-width:1500px;margin:0 auto;padding:14px 16px 60px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi small{display:block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-size:24px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:12px;color:var(--muted)}
.kpi em.up{color:var(--good)} .kpi em.dn{color:var(--bad)}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:900px){.grid{grid-template-columns:1fr 1fr}} @media (min-width:1300px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.card.wide{grid-column:1/-1}
.card h2{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.card h2 .n{margin-left:auto;font-weight:700;color:var(--ink);letter-spacing:0;text-transform:none;font-size:12px}
.alerts{display:grid;gap:6px}
.al{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;border-left:3px solid var(--warn);background:var(--soft)}
.al.bad{border-left-color:var(--bad)} .al b{font-size:13px} .al small{color:var(--muted)} .al .ago{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700}
.floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.tbl{border:1px solid var(--line);border-radius:10px;padding:8px;min-height:74px;background:var(--soft);position:relative}
.tbl b{display:block;font-size:14px} .tbl small{display:block;font-size:11px;color:var(--muted);line-height:1.35}
.tbl.on{background:color-mix(in srgb,var(--s1) 14%,var(--card));border-color:color-mix(in srgb,var(--s1) 50%,transparent)}
.tbl.due{background:color-mix(in srgb,var(--s4) 18%,var(--card));border-color:color-mix(in srgb,var(--s4) 60%,transparent)}
.tbl.late{background:color-mix(in srgb,var(--s8) 14%,var(--card));border-color:color-mix(in srgb,var(--s8) 55%,transparent)}
.tbl .age{float:right;margin:-2px -2px 0 6px;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--muted)}
.tbl.late .age,.tbl.due .age{color:var(--ink)}
.sechead{grid-column:1/-1;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:6px 0 -2px}
.kit{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kcol{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kcol h3{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between}
.kcol h3 span{color:var(--muted);font-weight:600}
.ki{display:flex;gap:8px;padding:4px 0;border-top:1px dashed var(--line);font-size:13px}
.ki .q{min-width:26px;font-weight:800} .ki .w{flex:1} .ki .t{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.ki.rdy .w{text-decoration:line-through;color:var(--muted)}
.ki.del{border-left:3px solid var(--s3);padding-left:6px}
table{width:100%;border-collapse:collapse;font-size:13px} th{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line2)} td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums} td.r,th.r{text-align:right}
tr.open td{background:color-mix(in srgb,var(--s1) 8%,transparent)} tr.due td{background:color-mix(in srgb,var(--s4) 12%,transparent)}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700;background:var(--soft2)}
.pill.dine{background:color-mix(in srgb,var(--s1) 18%,transparent)} .pill.counter{background:color-mix(in srgb,var(--s4) 22%,transparent)} .pill.delivery{background:color-mix(in srgb,var(--s3) 18%,transparent)}
.bars{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;align-items:end;height:90px;margin:4px 0 2px}
.bar{background:var(--s1);border-radius:3px 3px 0 0;min-height:2px;position:relative} .bar:hover::after{content:attr(data-t);position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--pri);color:var(--onpri);font-size:11px;padding:2px 6px;border-radius:6px;white-space:nowrap;margin-bottom:3px}
.bar.y{background:var(--line2)}
.hx{display:grid;grid-template-columns:repeat(24,1fr);font-size:9px;color:var(--muted);text-align:center}
.mini{display:grid;gap:4px} .mrow{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;font-size:13px}
.mrow .b{height:12px;background:var(--s1);border-radius:3px;min-width:2px} .mrow .v{text-align:right;font-variant-numeric:tabular-nums}
.search{width:100%;font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:inherit;margin:0 0 8px}
.scroll{max-height:420px;overflow:auto}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}
.ha-box{max-width:420px;margin:40px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.ha-f{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;margin:0 0 8px;background:var(--bg);color:inherit} .ha-b{width:100%;font:inherit;font-weight:700;padding:11px;border:0;border-radius:10px;background:var(--pri);color:var(--onpri);cursor:pointer} .ha-n{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px} .tab{font:inherit;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:inherit;cursor:pointer} .tab.on{background:var(--pri);color:var(--onpri);border-color:transparent}
.hide{display:none}
.sheetwrap{position:fixed;inset:0;z-index:50;background:rgba(27,26,23,.45);display:flex;justify-content:flex-end}
.sheet{width:min(620px,100%);height:100%;overflow:auto;background:var(--bg);padding:16px;box-shadow:-12px 0 40px rgba(0,0,0,.25)}
.sheet h2{display:flex;align-items:center;gap:10px;margin:0 0 4px;font-size:18px} .sheet h2 .x{margin-left:auto;font:inherit;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;cursor:pointer}
.sheet .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.tl{position:relative;padding-left:22px;border-left:2px solid var(--line2);margin:8px 0 0}
.ev{position:relative;margin:0 0 14px} .ev::before{content:"";position:absolute;left:-28px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--s1);border:2px solid var(--bg)}
.ev.kot::before{background:var(--s2)} .ev.edit::before{background:var(--s8)} .ev.due::before{background:var(--s4)} .ev.paid::before{background:var(--good)} .ev.move::before{background:var(--s7)}
.ev b{font-size:13px} .ev .at{font-variant-numeric:tabular-nums;font-weight:800;margin-right:8px} .ev .gap{color:var(--muted);font-size:12px;margin-left:6px}
.ev ul{margin:4px 0 0;padding-left:16px;font-size:13px} .ev li small{color:var(--muted)}
tr.rowlink{cursor:pointer} tr.rowlink:hover td{background:var(--soft)}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 12px;align-items:center;font-size:13px}
.cmp .k{color:var(--muted);text-align:center;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase} .cmp .a,.cmp .b{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px} .cmp .a{text-align:right} .cmp .d{font-size:11px;font-weight:600;margin-left:6px}
.d.up{color:var(--good)} .d.dn{color:var(--bad)}
.trend{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:80px} .trend div{background:var(--s1);border-radius:3px 3px 0 0;position:relative;min-height:2px} .trend div.cur{background:var(--s2)} .trend div::after{content:attr(data-t);position:absolute;top:100%;left:0;right:0;text-align:center;font-size:10px;color:var(--muted);white-space:nowrap}
.exp{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px} .exp button{font:inherit;font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:inherit;cursor:pointer}
.bar.b2{background:var(--line2)}
</style>
</head>
<body>
<div class="top">
  <h1>HAYAT · Owner</h1>
  <select id="day"></select>
  <span class="sp"></span>
  <span class="live" id="live"><i></i><span>connecting…</span></span>
  <a class="tb" href="./#/admin" style="text-decoration:none">Office</a>
</div>
<div class="wrap" id="main"><div class="note">Loading…</div></div>

<script>
(function(){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rs=n=>'₹'+Math.round(+n||0).toLocaleString('en-IN');
const hm=t=>t?t.slice(11,16):'';
const T=s=>s?new Date(s.replace(' ','T')):null;
const mins=(a,b)=>a&&b?Math.round((T(b)-T(a))/60000):null;
const ago=s=>{ const m=s?Math.round((NOW-T(s))/60000):null; return m==null?'':m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' m'; };
const DAYSTART=5;
const bizToday=()=>{ const d=new Date(); if(d.getHours()<DAYSTART) d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); };
/* which of OUR kitchens cooks a VMENU item: same words the office KOT split uses */
const station=it=>{ const s=((it.cat||'')+' '+(it.n||'')).toLowerCase(); if(/fried rice|juice|lime|water|tea|coffee|shake|mojito|salad|gravy|curry|fish|shawarma|shawaya|broast|dessert|ice/.test(s)) return 'front'; if(/mandi|alfaham|bread|parotta|kuboos|chapati|meal|biryani|beef|rice/.test(s)) return 'main'; return 'front'; };

let FB=null, DOC=null, YDOC=null, FLOOR=null, DAY=bizToday(), NOW=Date.now(), TAB='sales', Q='', DAYS=[];
const $$=(sel,root)=>Array.from((root||document).querySelectorAll(sel));

function recs(){ return Object.values((DOC&&DOC.records)||{}); }

function kpis(){
  const R=recs(), settled=R.filter(r=>r.status==='settled'), open=R.filter(r=>r.status==='open'||r.status==='due');
  const rev=settled.reduce((n,r)=>n+(r.total||0),0), y=YDOC?Object.values(YDOC.records||{}).filter(r=>r.status==='settled'):null;
  const yrev=y?y.reduce((n,r)=>n+(r.total||0),0):null;
  const dine=settled.filter(r=>r.kind==='dine'), pax=dine.reduce((n,r)=>n+(r.pax||0),0);
  const avgStay=avg(dine.map(r=>mins(r.createdAt,r.settledAt)).filter(x=>x!=null&&x<300));
  const cash=settled.reduce((n,r)=>n+(r.cash||0),0), card=settled.reduce((n,r)=>n+(r.card||0),0);
  const tables=FLOOR?FLOOR.tables.filter(t=>t.active):[]; const busy=new Set(open.filter(r=>r.kind==='dine').map(r=>r.table));
  const seats=tables.reduce((n,t)=>n+(t.chairs||0),0), seatsBusy=tables.filter(t=>busy.has(t.name)).reduce((n,t)=>n+(t.chairs||0),0);
  const d=yrev!=null?(rev-yrev):null;
  return `<div class="kpis">
    <div class="kpi"><small>Sales today</small><b>${rs(rev)}</b><em class="${d==null?'':d>=0?'up':'dn'}">${d==null?settled.length+' bills':(d>=0?'▲':'▼')+' '+rs(Math.abs(d))+' vs yesterday'}</em></div>
    <div class="kpi"><small>Bills</small><b>${settled.length}</b><em>avg ${rs(settled.length?rev/settled.length:0)}</em></div>
    <div class="kpi"><small>Open now</small><b>${open.length}</b><em>${open.filter(r=>r.status==='due').length} bill printed · ${rs(open.reduce((n,r)=>n+(r.items||[]).reduce((m,i)=>m+(i.a||0),0),0))} on tables</em></div>
    <div class="kpi"><small>Seats</small><b>${tables.length?Math.round(100*seatsBusy/Math.max(1,seats))+'%':'—'}</b><em>${busy.size} of ${tables.length} tables · ${seatsBusy}/${seats} chairs</em></div>
    <div class="kpi"><small>Avg table time</small><b>${avgStay!=null?avgStay+' min':'—'}</b><em>${pax?pax+' covers':'covers not entered'}</em></div>
    <div class="kpi"><small>Cash · Card</small><b>${rs(cash)}</b><em>card ${rs(card)}</em></div>
    <div class="kpi"><small>Purchases</small><b>${rs(DOC.purchaseTotal||0)}</b><em>${DOC.purchaseCount||0} bills · ${rev?Math.round(100*(DOC.purchaseTotal||0)/rev)+'% of sales':''}</em></div>
  </div>`;
}
function avg(xs){ return xs.length?Math.round(xs.reduce((a,b)=>a+b,0)/xs.length):null; }

function alerts(){
  const R=recs(), out=[];
  R.filter(r=>r.status==='open'||r.status==='due').forEach(r=>{
    const age=mins(r.createdAt, tsNow()), sinceDue=r.dueAt?mins(r.dueAt,tsNow()):null;
    if(r.status==='due'&&sinceDue>10) out.push({bad:sinceDue>25,b:`${r.table||'Token '+(r.token||'')} · bill printed, not paid`,s:`${r.waiter||''} · ${rs(sum(r))}`,ago:sinceDue+' min'});
    else if(r.kind==='dine'&&age>75) out.push({bad:age>110,b:`${r.table} · seated a long time`,s:`${r.waiter||''} · ${r.kotCount} KOT · ${rs(sum(r))}`,ago:age+' min'});
    else if(r.kind==='counter'&&age>15) out.push({bad:age>30,b:`Token ${r.token||r.kot} · waiting at counter`,s:(r.items||[]).map(i=>i.q+'× '+i.n).join(', ').slice(0,60),ago:age+' min'});
    /* a delivery takes longer by nature: cooking + the road + the rider coming back before it can be settled */
    else if(r.kind==='delivery'&&age>90) out.push({bad:age>150,b:`Delivery ${r.customer&&r.customer.name||('KOT '+r.kot)} · still open`,s:(r.rider?'rider '+r.rider:'no rider')+(r.dispatchAt?' · left '+hm(r.dispatchAt):' · not dispatched')+' · '+rs(sum(r)),ago:age+' min'});
    else if(r.kind==='delivery'&&!r.dispatchAt&&age>35) out.push({bad:age>60,b:`Delivery ${r.customer&&r.customer.name||('KOT '+r.kot)} · not dispatched`,s:(r.rider?'rider '+r.rider:'no rider')+' · '+rs(sum(r)),ago:age+' min'});
    const lastKot=r.kots&&r.kots[r.kots.length-1]; const wait=lastKot?mins(lastKot,tsNow()):null;
    if(r.status==='open'&&r.kind!=='delivery'&&wait>25&&(r.items||[]).some(i=>i.ready!=='ready')) out.push({bad:wait>40,b:`${r.table||'Token '+(r.token||'')} · food not marked ready`,s:`last KOT ${hm(lastKot)}`,ago:wait+' min'});
  });
  const voids=R.reduce((n,r)=>n+(r.edits||[]).length,0);
  return `<div class="card wide"><h2>Needs attention <span class="n">${out.length?out.length:'all calm'}${voids?' · '+voids+' edits/voids today':''}</span></h2>`+
    (out.length?`<div class="alerts">${out.sort((a,b)=>parseInt(b.ago)-parseInt(a.ago)).map(a=>`<div class="al${a.bad?' bad':''}"><b>${esc(a.b)}</b><small>${esc(a.s)}</small><span class="ago">${esc(a.ago)}</span></div>`).join('')}</div>`:'<div class="note">Nothing waiting too long.</div>')+'</div>';
}
function sum(r){ return r.total!=null?r.total:(r.items||[]).reduce((n,i)=>n+(i.a||0),0); }
function tsNow(){ const d=new Date(NOW); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0'); }

function floor(){
  const open=recs().filter(r=>(r.status==='open'||r.status==='due')&&r.kind==='dine');
  const byT={}; open.forEach(r=>{ byT[String(r.table)]=r; });
  const tables=(FLOOR?FLOOR.tables.filter(t=>t.active):[]);
  if(!tables.length&&!open.length) return `<div class="card wide"><h2>Tables</h2><div class="note">Waiting for the shop PC to send the floor.</div></div>`;
  const secs={}; tables.forEach(t=>{ (secs[t.section||'?']=secs[t.section||'?']||[]).push(t); });
  // open tables not in the master (e.g. section without table map) still show
  open.forEach(r=>{ if(!tables.some(t=>t.name===r.table)) (secs[r.section||'?']=secs[r.section||'?']||[]).push({name:r.table,chairs:r.chairs,section:r.section,ghost:true}); });
  const counter=recs().filter(r=>(r.status==='open'||r.status==='due')&&r.kind!=='dine');
  return `<div class="card wide"><h2>Tables <span class="n">${open.length} busy · ${counter.length} counter / delivery</span></h2><div class="floor">`+
    Object.keys(secs).sort().map(sec=>`<div class="sechead">${esc(sec)}</div>`+secs[sec].sort((a,b)=>String(a.name).localeCompare(String(b.name),undefined,{numeric:true})).map(t=>{
      const r=byT[String(t.name)]; if(!r) return `<div class="tbl"><b>${esc(t.name)}</b><small>${t.chairs?t.chairs+' chairs':''}</small></div>`;
      const age=mins(r.createdAt,tsNow()); const cls=r.status==='due'?'due':age>75?'late':'on';
      return `<div class="tbl ${cls}" title="${esc((r.items||[]).map(i=>i.q+'× '+i.n).join('\n'))}"><span class="age">${age}m</span><b>${esc(t.name)}</b><small>${esc(r.waiter||'')}${r.pax?' · '+r.pax+' pax':''}</small><small>${r.kotCount} KOT · ${rs(sum(r))}</small><small>${r.status==='due'?'BILL PRINTED':(r.foodReady||0)+'/'+(r.items||[]).length+' ready'}</small></div>`;
    }).join('')).join('')+
    (counter.length?`<div class="sechead">Counter &amp; delivery</div>`+counter.map(r=>{ const age=mins(r.createdAt,tsNow()); return `<div class="tbl ${r.status==='due'&&r.kind!=='delivery'?'due':age>(r.kind==='delivery'?90:20)?'late':'on'}"><span class="age">${age}m</span><b>${r.kind==='delivery'?'🛵':'🎟'}${esc(r.token||r.kot)}</b><small>${r.kind==='delivery'?(r.dispatchAt?'out · left '+hm(r.dispatchAt):r.status==='due'?'billed · with rider':'cooking'):esc(r.kind)}${r.rider?' · '+esc(r.rider):''}</small><small>${(r.items||[]).length} items · ${rs(sum(r))}</small></div>`; }).join(''):'')+
  '</div></div>';
}

/* A delivery ticket stays open long after the food left - the rider is on the
   road and the bill closes when he is back. The kitchen must not keep seeing
   it. A line belongs on the pass while it is unfinished AND, for a delivery,
   only until it was dispatched / billed or 35 min after its KOT. */
const COOK_WINDOW=35;
function onPass(i,r){
  if(i.ready==='ready') return false;
  if(r.kind!=='delivery') return true;
  if(r.dispatchAt||r.status==='due') return false;
  const age=i.kotAt?mins(i.kotAt,tsNow()):0;
  return age<=COOK_WINDOW;
}
function kitchens(){
  const open=recs().filter(r=>r.status==='open'||r.status==='due');
  const cols={main:[],front:[]}; let outDel=0;
  open.forEach(r=>(r.items||[]).forEach(i=>{ if(r.kind==='delivery'&&!onPass(i,r)&&i.ready!=='ready'){ outDel++; return; } cols[station(i)].push({i,r}); }));
  const who=r=>r.kind==='dine'?esc(r.table):(r.kind==='delivery'?'🛵 ':'🎟 ')+esc(r.token||r.kot);
  const col=(k,label)=>{ const L=cols[k].filter(x=>onPass(x.i,x.r)).sort((a,b)=>String(a.i.kotAt||'').localeCompare(String(b.i.kotAt||'')));
    return `<div class="kcol"><h3>${label} <span>${L.reduce((n,x)=>n+(x.i.q||0),0)} to cook</span></h3>`+(L.length?L.map(x=>`<div class="ki${x.r.kind==='delivery'?' del':''}"><span class="q">${x.i.q}×</span><span class="w">${esc(x.i.n)} <small style="color:var(--muted)">· ${who(x.r)}</small></span><span class="t">${hm(x.i.kotAt)}${x.i.kotAt?' · '+mins(x.i.kotAt,tsNow())+'m':''}</span></div>`).join(''):'<div class="note">Nothing on the pass.</div>')+'</div>'; };
  return `<div class="card wide"><h2>Kitchens · live <span class="n">${cols.main.length+cols.front.length} lines to cook${outDel?' · '+outDel+' delivery lines already out':''}</span></h2><div class="kit">${col('main','Main kitchen')}${col('front','Front kitchen')}</div></div>`;
}

function hourly(){
  const H=Array(24).fill(0), HY=Array(24).fill(0);
  recs().filter(r=>r.status==='settled').forEach(r=>{ const h=+(r.settledAt||'').slice(11,13); if(h>=0) H[h]+=r.total||0; });
  if(YDOC) Object.values(YDOC.records||{}).filter(r=>r.status==='settled').forEach(r=>{ const h=+(r.settledAt||'').slice(11,13); if(h>=0) HY[h]+=r.total||0; });
  const max=Math.max(1,...H,...HY);
  return `<div class="card"><h2>Sales by hour <span class="n">grey = yesterday</span></h2><div class="bars">${H.map((v,h)=>`<div class="bar" style="height:${Math.max(2,100*v/max)}%" data-t="${h}:00 ${rs(v)}${YDOC?' · y '+rs(HY[h]):''}"></div>`).join('')}</div><div class="hx">${H.map((v,h)=>h%3?'<span></span>':'<span>'+h+'</span>').join('')}</div></div>`;
}

function breakdown(){
  const S=recs().filter(r=>r.status==='settled');
  const group=(f)=>{ const g={}; S.forEach(r=>{ const k=f(r)||'—'; g[k]=g[k]||{n:0,v:0}; g[k].n++; g[k].v+=r.total||0; }); return Object.entries(g).sort((a,b)=>b[1].v-a[1].v); };
  const block=(title,rows)=>{ const max=Math.max(1,...rows.map(r=>r[1].v)); return `<div class="card"><h2>${title}</h2><div class="mini">${rows.map(([k,x])=>`<div class="mrow"><span>${esc(k)} <small style="color:var(--muted)">${x.n}</small></span><div class="b" style="width:${100*x.v/max}%"></div><span class="v">${rs(x.v)}</span></div>`).join('')||'<div class="note">No bills yet.</div>'}</div></div>`; };
  return block('By section',group(r=>r.section))+block('By type',group(r=>r.kind))+block('By payment',group(r=>r.payMode))+block('By waiter',group(r=>r.waiter));
}

function items(){
  const S=recs().filter(r=>r.status==='settled'), g={};
  S.forEach(r=>(r.items||[]).forEach(i=>{ const k=i.n; g[k]=g[k]||{n:i.n,cat:i.cat,q:0,v:0,bills:0}; g[k].q+=i.q||0; g[k].v+=i.a||0; g[k].bills++; }));
  let rows=Object.values(g).sort((a,b)=>b.v-a.v); if(Q) rows=rows.filter(r=>(r.n+' '+(r.cat||'')).toLowerCase().includes(Q));
  const tot=rows.reduce((n,r)=>n+r.v,0);
  return `<div class="card wide"><h2>Item‑wise <span class="n">${rows.length} items · ${rs(tot)}</span></h2><input class="search" id="q" placeholder="Search item or category…" value="${esc(Q)}"><div class="scroll"><table><tr><th>#</th><th>Item</th><th>Category</th><th class="r">Qty</th><th class="r">Bills</th><th class="r">Sales</th><th class="r">Share</th></tr>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.n)}</td><td>${esc(r.cat||'')}</td><td class="r">${r.q}</td><td class="r">${r.bills}</td><td class="r">${rs(r.v)}</td><td class="r">${tot?Math.round(100*r.v/tot):0}%</td></tr>`).join('')}</table></div></div>`;
}

function bills(){
  const R=recs().slice().sort((a,b)=>String(b.settledAt||b.createdAt||'').localeCompare(String(a.settledAt||a.createdAt||'')));
  let rows=R; if(Q) rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(Q));
  return `<div class="card wide"><div class="exp"><button data-csv="bills">⬇ Bills CSV</button><button data-csv="items">⬇ Items CSV</button><button data-csv="purchases">⬇ Purchases CSV</button></div><h2>Bills · live <span class="n">${R.filter(r=>r.status!=='settled').length} open · ${R.filter(r=>r.status==='settled').length} settled</span></h2><input class="search" id="q" placeholder="Search KOT, table, waiter, item…" value="${esc(Q)}"><div class="scroll"><table><tr><th>KOT</th><th>Type</th><th>Table</th><th>Waiter</th><th>Created</th><th>KOTs</th><th>Bill</th><th>Settled</th><th class="r">Stay</th><th>Pay</th><th class="r">Total</th><th>Items</th><th>Edits</th></tr>${rows.map(r=>`<tr class="${r.status} rowlink" data-drill="${esc(r.key)}"><td>${esc(r.kot)}</td><td><span class="pill ${esc(r.kind)}">${esc(r.kind)}</span></td><td>${esc(r.table||(r.token?'T'+r.token:''))}</td><td>${esc(r.waiter||'')}</td><td>${hm(r.createdAt)}</td><td>${(r.kots||[]).map(hm).join(' · ')}</td><td>${hm(r.dueAt)}</td><td>${r.status==='settled'?hm(r.settledAt):'<b>'+esc(r.status)+'</b>'}</td><td class="r">${mins(r.createdAt,r.settledAt||tsNow())??''}m</td><td>${esc(r.payMode||'')}</td><td class="r">${rs(sum(r))}</td><td title="${esc((r.items||[]).map(i=>i.q+'× '+i.n+' '+hm(i.kotAt)).join('\n'))}">${(r.items||[]).map(i=>i.q+'× '+i.n).join(', ').slice(0,70)}${(r.items||[]).map(i=>i.n).join('').length>70?'…':''}</td><td>${(r.edits||[]).map(e=>esc(e.item)+' '+e.from+'→'+e.to+(e.reason?' ('+esc(e.reason)+')':'')).join('; ')}${(r.moves||[]).map(m=>' ⇄ '+esc(m.from)+'→'+esc(m.to)).join('')}</td></tr>`).join('')}</table></div></div>`;
}

function purchases(){
  let P=Object.values((DOC&&DOC.purchases)||{}).sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')));
  if(Q) P=P.filter(p=>JSON.stringify(p).toLowerCase().includes(Q));
  const tot=P.reduce((n,p)=>n+(p.total||0),0);
  const bySup={}; P.forEach(p=>{ const k=p.supplier||'—'; bySup[k]=bySup[k]||{n:0,v:0}; bySup[k].n++; bySup[k].v+=p.total||0; });
  const sups=Object.entries(bySup).sort((a,b)=>b[1].v-a[1].v); const max=Math.max(1,...sups.map(x=>x[1].v));
  const byItem={}; P.forEach(p=>(p.items||[]).forEach(i=>{ const k=i.n; byItem[k]=byItem[k]||{n:i.n,cat:i.cat,unit:i.unit,q:0,v:0,c:[]}; byItem[k].q+=i.q||0; byItem[k].v+=i.total||0; if(i.cost) byItem[k].c.push(i.cost); }));
  const items=Object.values(byItem).sort((a,b)=>b.v-a.v);
  return `<div class="card"><h2>By supplier <span class="n">${rs(tot)}</span></h2><div class="mini">${sups.map(([k,x])=>`<div class="mrow"><span>${esc(k)} <small style="color:var(--muted)">${x.n}</small></span><div class="b" style="width:${100*x.v/max}%"></div><span class="v">${rs(x.v)}</span></div>`).join('')||'<div class="note">No purchases entered today.</div>'}</div></div>`+
    `<div class="card wide"><h2>Purchase bills <span class="n">${P.length}</span></h2><input class="search" id="q" placeholder="Search supplier, item…" value="${esc(Q)}"><div class="scroll"><table><tr><th>Time</th><th>Supplier</th><th>Bill no</th><th>By</th><th class="r">Lines</th><th class="r">GST</th><th class="r">Total</th><th>Items</th></tr>${P.map(p=>`<tr><td>${hm(p.at)}</td><td>${esc(p.supplier||'')}</td><td>${esc(p.billNo||'')}</td><td>${esc(p.by||'')}</td><td class="r">${p.lines}</td><td class="r">${rs(p.gst||0)}</td><td class="r">${rs(p.total)}</td><td>${(p.items||[]).map(i=>esc(i.n)+' '+(i.q||'')+(i.unit?' '+esc(i.unit):'')+' @'+rs(i.cost)).join(', ')}</td></tr>`).join('')}</table></div></div>`+
    `<div class="card wide"><h2>Item‑wise purchases</h2><div class="scroll"><table><tr><th>Item</th><th>Category</th><th class="r">Qty</th><th>Unit</th><th class="r">Avg cost</th><th class="r">Total</th></tr>${items.map(i=>`<tr><td>${esc(i.n)}</td><td>${esc(i.cat||'')}</td><td class="r">${i.q}</td><td>${esc(i.unit||'')}</td><td class="r">${i.c.length?rs(i.c.reduce((a,b)=>a+b,0)/i.c.length):''}</td><td class="r">${rs(i.v)}</td></tr>`).join('')}</table></div></div>`;
}

function drill(key){
  const r=(DOC.records||{})[key]; if(!r) return;
  const ev=[]; const push=(cls,at,title,body)=>ev.push({cls,at,title,body});
  const byKot={}; (r.items||[]).forEach(i=>{ (byKot[i.kotAt||r.createdAt||'?']=byKot[i.kotAt||r.createdAt||'?']||[]).push(i); });
  Object.keys(byKot).sort().forEach((t,i)=>push('kot',t,`KOT ${i+1}${i===0?' · order created':' · add‑on'}`,`<ul>${byKot[t].map(x=>`<li>${x.q}× ${esc(x.n)} <small>${esc(x.kit||'')}${x.ready?' · '+esc(x.ready):''}${x.servedAt?' · served '+hm(x.servedAt):''}</small> <span style="float:right">${rs(x.a)}</span></li>`).join('')}</ul>`));
  (r.edits||[]).forEach(e=>push('edit',e.at,`${e.void?'Void':'Edit'} · ${esc(e.item)} ${e.from}→${e.to}`,`<small>${esc(e.reason||'')}${e.by?' · by '+esc(e.by):''}${e.remarks?' · '+esc(e.remarks):''}</small>`));
  (r.moves||[]).forEach(m=>push('move',m.at,`Table moved ${esc(m.from)} → ${esc(m.to)}`,`<small>${esc(m.by||'')}</small>`));
  (r.joins||[]).forEach(j=>push('move',j.at,`Joined KOT ${j.fromKot} → ${j.toKot}`,`<small>table ${esc(j.fromTable)} → ${esc(j.toTable)} · ${esc(j.by||'')}</small>`));
  if(r.dueAt) push('due',r.dueAt,'Bill printed'+(r.dueCount>1?' ×'+r.dueCount:''),'');
  if(r.settledAt) push('paid',r.settledAt,`Settled · ${esc(r.payMode||'')} ${rs(r.paid!=null?r.paid:r.total)}`,`<small>${r.cash?'cash '+rs(r.cash)+' ':''}${r.card?'card '+rs(r.card)+' ':''}${r.credit?'credit '+rs(r.credit):''}${r.cashier?' · cashier '+esc(r.cashier):''}${r.discount?' · discount '+rs(r.discount):''}</small>`);
  ev.sort((a,b)=>String(a.at).localeCompare(String(b.at)));
  const old=document.getElementById('drill'); if(old) old.remove();
  const box=document.createElement('div'); box.className='sheetwrap'; box.id='drill';
  const stay=mins(r.createdAt,r.settledAt||tsNow());
  box.innerHTML=`<div class="sheet"><h2>KOT ${esc(r.kot)} <span class="pill ${esc(r.kind)}">${esc(r.kind)}</span><button class="x" id="drillX">✕</button></h2>
    <p class="sub">${esc(r.section||'')}${r.table?' · table '+esc(r.table):''}${r.token?' · token '+esc(r.token):''}${r.waiter?' · waiter '+esc(r.waiter):''}${r.pax?' · '+r.pax+' pax':''}${r.invoiceId?' · invoice '+r.invoiceId:''}${r.customer&&r.customer.name?' · '+esc(r.customer.name):''}${r.customer&&r.customer.phone?' '+esc(r.customer.phone):''}${r.rider?' · rider '+esc(r.rider):''}<br>${esc(r.status)} · ${stay!=null?stay+' min':''}${r.dueAt?' · order→bill '+mins(r.createdAt,r.dueAt)+'m':''}${r.settledAt&&r.dueAt?' · bill→paid '+mins(r.dueAt,r.settledAt)+'m':''} · total ${rs(sum(r))}${r.remarks?'<br>“'+esc(r.remarks)+'”':''}</p>
    <div class="tl">${ev.map((e,i)=>`<div class="ev ${e.cls}"><span class="at">${hm(e.at)}</span><b>${e.title}</b>${i?`<span class="gap">+${mins(ev[i-1].at,e.at)} min</span>`:''}${e.body}</div>`).join('')}</div>
    <p class="note">First seen in log ${esc(r.seen||'')} · last change ${esc(r.updated||'')}</p></div>`;
  document.body.appendChild(box);
  box.onclick=e=>{ if(e.target===box) box.remove(); }; $('drillX').onclick=()=>box.remove();
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ const d=$('drill'); if(d) d.remove(); } });

function csv(kind){
  let rows=[], name=DAY+'-'+kind+'.csv';
  const R=recs();
  if(kind==='bills') rows=[['kot','invoice','status','kind','section','table','token','waiter','cashier','pax','created','kots','billPrinted','settled','stayMin','payMode','cash','card','credit','total','items','edits','moves']].concat(R.map(r=>[r.kot,r.invoiceId,r.status,r.kind,r.section,r.table,r.token,r.waiter,r.cashier,r.pax,r.createdAt,(r.kots||[]).join(' | '),r.dueAt,r.settledAt,mins(r.createdAt,r.settledAt),r.payMode,r.cash,r.card,r.credit,sum(r),(r.items||[]).map(i=>i.q+'x '+i.n).join(' | '),(r.edits||[]).map(e=>e.item+' '+e.from+'>'+e.to).join(' | '),(r.moves||[]).map(m=>m.from+'>'+m.to).join(' | ')]));
  else if(kind==='items') rows=[['kot','status','kind','table','waiter','item','category','kitchen','qty','price','amount','kotAt','ready']].concat(R.flatMap(r=>(r.items||[]).map(i=>[r.kot,r.status,r.kind,r.table,r.waiter,i.n,i.cat,i.kit,i.q,i.p,i.a,i.kotAt,i.ready])));
  else rows=[['id','at','supplier','billNo','by','total','gst','item','category','unit','qty','cost','lineTotal']].concat(Object.values(DOC.purchases||{}).flatMap(p=>(p.items||[]).length?(p.items||[]).map(i=>[p.id,p.at,p.supplier,p.billNo,p.by,p.total,p.gst,i.n,i.cat,i.unit,i.q,i.cost,i.total]):[[p.id,p.at,p.supplier,p.billNo,p.by,p.total,p.gst]]));
  const txt=rows.map(r=>r.map(v=>{ v=v==null?'':String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+txt],{type:'text/csv'})); a.download=name; a.click();
}

/* ---- compare two days, and the week around today ---- */
const CACHE={}; let CMP=null, WEEK=null;
async function loadDay(d){ if(CACHE[d]!==undefined) return CACHE[d]; try{ const s=await FB.fs.getDoc(FB.fs.doc(FB.db,'vm_daylog',d)); CACHE[d]=s.exists()?s.data():null; }catch(e){ CACHE[d]=null; } return CACHE[d]; }
function stats(doc){
  const R=Object.values((doc&&doc.records)||{}), S=R.filter(r=>r.status==='settled');
  const rev=S.reduce((n,r)=>n+(r.total||0),0), dine=S.filter(r=>r.kind==='dine'), ctr=S.filter(r=>r.kind==='counter'), del=S.filter(r=>r.kind==='delivery');
  const g=f=>{ const o={}; S.forEach(r=>{ const k=f(r)||'—'; o[k]=(o[k]||0)+(r.total||0); }); return o; };
  const items={}; S.forEach(r=>(r.items||[]).forEach(i=>{ items[i.n]=items[i.n]||{q:0,v:0}; items[i.n].q+=i.q||0; items[i.n].v+=i.a||0; }));
  const H=Array(24).fill(0); S.forEach(r=>{ const h=+(r.settledAt||'').slice(11,13); if(h>=0) H[h]+=r.total||0; });
  return {rev,bills:S.length,avg:S.length?rev/S.length:0,dine:dine.reduce((n,r)=>n+(r.total||0),0),counter:ctr.reduce((n,r)=>n+(r.total||0),0),delivery:del.reduce((n,r)=>n+(r.total||0),0),
    covers:dine.reduce((n,r)=>n+(r.pax||0),0),stay:avg(dine.map(r=>mins(r.createdAt,r.settledAt)).filter(x=>x!=null&&x<300)),
    edits:R.reduce((n,r)=>n+(r.edits||[]).length,0),purchases:(doc&&doc.purchaseTotal)||0,section:g(r=>r.section),waiter:g(r=>r.waiter),pay:g(r=>r.payMode),items,H,
    cash:S.reduce((n,r)=>n+(r.cash||0),0),card:S.reduce((n,r)=>n+(r.card||0),0)};
}
function compare(){
  const A=stats(DOC), B=CMP&&CMP.doc?stats(CMP.doc):null, bd=CMP?CMP.day:'';
  const row=(k,a,b,fmt)=>{ fmt=fmt||rs; const d=(b!=null&&a!=null&&b)?Math.round(100*(a-b)/b):null; return `<div class="a">${a==null?'—':fmt(a)}${d!=null?`<span class="d ${d>=0?'up':'dn'}">${d>=0?'+':''}${d}%</span>`:''}</div><div class="k">${k}</div><div class="b">${b==null?'—':fmt(b)}</div>`; };
  const opts=(DAYS||[]).filter(d=>d!==DAY).map(d=>`<option value="${d}"${d===bd?' selected':''}>${d}</option>`).join('');
  const max=Math.max(1,...A.H,...(B?B.H:[0]));
  const mini=(title,ga,gb)=>{ const keys=[...new Set([...Object.keys(ga),...Object.keys(gb||{})])].sort((x,y)=>(ga[y]||0)-(ga[x]||0)).slice(0,8); const m=Math.max(1,...keys.map(k=>Math.max(ga[k]||0,(gb||{})[k]||0)));
    return `<div class="card"><h2>${title}</h2><div class="mini">${keys.map(k=>`<div class="mrow"><span>${esc(k)}</span><div><div class="b" style="width:${100*(ga[k]||0)/m}%"></div>${gb?`<div class="b" style="width:${100*(gb[k]||0)/m}%;background:var(--line2);margin-top:2px"></div>`:''}</div><span class="v">${rs(ga[k]||0)}${gb?'<br><small style="color:var(--muted)">'+rs(gb[k]||0)+'</small>':''}</span></div>`).join('')}</div></div>`; };
  const topA=Object.entries(A.items).sort((x,y)=>y[1].v-x[1].v).slice(0,15);
  const week=WEEK?`<div class="card wide"><h2>Last 7 days · sales <span class="n">${rs(WEEK.reduce((n,w)=>n+w.rev,0))} · avg ${rs(WEEK.reduce((n,w)=>n+w.rev,0)/Math.max(1,WEEK.filter(w=>w.rev).length))}/day</span></h2><div class="trend">${(()=>{ const m=Math.max(1,...WEEK.map(w=>w.rev)); return WEEK.map(w=>`<div class="${w.day===DAY?'cur':''}" style="height:${Math.max(2,100*w.rev/m)}%" data-t="${w.day.slice(5)} ${rs(w.rev)}" title="${w.day}: ${rs(w.rev)} · ${w.bills} bills"></div>`).join(''); })()}</div><div style="height:16px"></div></div>`:'';
  return `<div class="card wide"><h2>Compare <span class="n"><select id="cmpDay"><option value="">choose a day…</option>${opts}</select></span></h2>
      <div class="cmp"><div class="a"><b>${esc(DAY)}</b></div><div class="k"></div><div class="b"><b>${esc(bd||'—')}</b></div>
      ${row('Sales',A.rev,B&&B.rev)}${row('Bills',A.bills,B&&B.bills,x=>x)}${row('Avg bill',A.avg,B&&B.avg)}${row('Dine‑in',A.dine,B&&B.dine)}${row('Counter',A.counter,B&&B.counter)}${row('Delivery',A.delivery,B&&B.delivery)}${row('Covers',A.covers,B&&B.covers,x=>x)}${row('Avg table min',A.stay,B&&B.stay,x=>x+'m')}${row('Cash',A.cash,B&&B.cash)}${row('Card',A.card,B&&B.card)}${row('Edits/voids',A.edits,B&&B.edits,x=>x)}${row('Purchases',A.purchases,B&&B.purchases)}</div></div>`+
    week+
    `<div class="card wide"><h2>Sales by hour <span class="n">blue ${esc(DAY)} · grey ${esc(bd||'')}</span></h2><div class="bars">${A.H.map((v,h)=>`<div class="bar" style="height:${Math.max(2,100*v/max)}%" data-t="${h}:00 ${rs(v)}${B?' · '+rs(B.H[h]):''}"></div>`).join('')}</div>${B?`<div class="bars" style="height:50px">${B.H.map((v,h)=>`<div class="bar b2" style="height:${Math.max(2,100*v/max)}%" data-t="${h}:00 ${rs(v)}"></div>`).join('')}</div>`:''}<div class="hx">${A.H.map((v,h)=>h%3?'<span></span>':'<span>'+h+'</span>').join('')}</div></div>`+
    mini('By section',A.section,B&&B.section)+mini('By waiter',A.waiter,B&&B.waiter)+mini('By payment',A.pay,B&&B.pay)+
    `<div class="card wide"><h2>Top items <span class="n">${esc(DAY)} vs ${esc(bd||'—')}</span></h2><table><tr><th>Item</th><th class="r">Qty</th><th class="r">Sales</th><th class="r">Qty ${esc(bd||'')}</th><th class="r">Sales ${esc(bd||'')}</th><th class="r">Δ</th></tr>${topA.map(([n,x])=>{ const y=B&&B.items[n]; const d=y&&y.v?Math.round(100*(x.v-y.v)/y.v):null; return `<tr><td>${esc(n)}</td><td class="r">${x.q}</td><td class="r">${rs(x.v)}</td><td class="r">${y?y.q:'—'}</td><td class="r">${y?rs(y.v):'—'}</td><td class="r">${d==null?'':`<span class="d ${d>=0?'up':'dn'}">${d>=0?'+':''}${d}%</span>`}</td></tr>`; }).join('')}</table></div>`;
}
async function pickCompare(d){ CMP=d?{day:d,doc:await loadDay(d)}:null; render(); }
async function loadWeek(){
  const out=[]; const base=new Date(DAY+'T12:00:00');
  for(let i=6;i>=0;i--){ const x=new Date(base); x.setDate(x.getDate()-i); const d=x.toISOString().slice(0,10); const doc=d===DAY?DOC:await loadDay(d); const st=stats(doc); out.push({day:d,rev:st.rev,bills:st.bills}); }
  WEEK=out; render();
}

function waiters(){
  const R=recs(), g={};
  R.forEach(r=>{ if(!r.waiter) return; const w=g[r.waiter]=g[r.waiter]||{bills:0,v:0,open:0,edits:0,d:[],k:[]}; if(r.status==='settled'){ w.bills++; w.v+=r.total||0; const a=mins(r.createdAt,r.dueAt); if(a!=null) w.d.push(a); } else w.open++; w.edits+=(r.edits||[]).length; w.k.push(r.kotCount||0); });
  const rows=Object.entries(g).sort((a,b)=>b[1].v-a[1].v);
  return `<div class="card"><h2>Waiters</h2><table><tr><th>Name</th><th class="r">Bills</th><th class="r">Open</th><th class="r">Sales</th><th class="r">Order→bill</th><th class="r">Add‑on KOT %</th><th class="r">Edits</th></tr>${rows.map(([n,w])=>`<tr><td>${esc(n)}</td><td class="r">${w.bills}</td><td class="r">${w.open}</td><td class="r">${rs(w.v)}</td><td class="r">${avg(w.d)??'—'}m</td><td class="r">${w.k.length?Math.round(100*w.k.filter(x=>x>1).length/w.k.length):0}%</td><td class="r">${w.edits}</td></tr>`).join('')}</table></div>`;
}

function render(){
  /* a PC whose clock is behind the shop's (or a browser in another zone) must not show negative ages */
  NOW=Math.max(Date.now(), DOC&&DOC.updatedAt?T(DOC.updatedAt).getTime():0);
  const m=$('main'); if(!DOC){ m.innerHTML='<div class="note">No day log for '+esc(DAY)+' yet. Is the shop PC running <b>Hayat Day Log</b>?</div>'; return; }
  const live=DAY===bizToday();
  m.innerHTML=kpis()+
    `<div class="tabs">${[['sales','Sales'],['floor','Tables & kitchens'],['bills','Bills'],['items','Items'],['buy','Purchases'],['cmp','Compare']].map(t=>`<button class="tab${TAB===t[0]?' on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>`+
    (TAB==='sales'?`<div class="grid">${live?alerts():''}${hourly()}${breakdown()}${waiters()}</div>`:
     TAB==='floor'?`<div class="grid">${live?alerts():''}${floor()}${kitchens()}</div>`:
     TAB==='bills'?`<div class="grid">${bills()}</div>`:
     TAB==='buy'?`<div class="grid">${purchases()}</div>`:
     TAB==='cmp'?`<div class="grid">${compare()}</div>`:`<div class="grid">${items()}</div>`)+
    `<div class="note">Day log ${esc(DOC.updatedAt||'')} · ${DOC.count||0} records · shop PC appends every minute.</div>`;
  $$('[data-tab]').forEach(b=>b.onclick=()=>{ TAB=b.dataset.tab; Q=''; render(); if(TAB==='cmp'&&!WEEK) loadWeek(); });
  $$('[data-drill]').forEach(tr=>tr.onclick=()=>drill(tr.dataset.drill));
  $$('[data-csv]').forEach(b=>b.onclick=()=>csv(b.dataset.csv));
  const cd=$('cmpDay'); if(cd) cd.onchange=()=>pickCompare(cd.value);
  const q=$('q'); if(q){ q.oninput=()=>{ Q=q.value.trim().toLowerCase(); const pos=q.selectionStart; render(); const q2=$('q'); q2.focus(); q2.setSelectionRange(pos,pos); }; }
}

let unsub=null;
async function watchDay(){
  if(unsub) unsub(); DOC=null; YDOC=null; render();
  const {fs,db}=FB;
  const y=new Date(DAY+'T12:00:00'); y.setDate(y.getDate()-1); const yday=y.toISOString().slice(0,10);
  fs.getDoc(fs.doc(db,'vm_daylog',yday)).then(d=>{ YDOC=d.exists()?d.data():null; render(); }).catch(()=>{});
  unsub=fs.onSnapshot(fs.doc(db,'vm_daylog',DAY),d=>{ DOC=d.exists()?d.data():null; CACHE[DAY]=DOC; stamp(); render(); },e=>{ $('live').className='live bad'; $('live').lastElementChild.textContent=e.code||'error'; });
}
function stamp(){ const l=$('live'); if(!DOC){ l.className='live bad'; l.lastElementChild.textContent='no data'; return; } const age=Math.max(0,Math.round((Date.now()-T(DOC.updatedAt))/60000)); l.className='live'+(age>6?' bad':''); l.lastElementChild.textContent=(age>6?'stale · ':'live · ')+age+' min ago'; }

async function days(){
  const {fs,db}=FB; const sel=$('day'); const out=[];
  try{ const q=await fs.getDocs(fs.query(fs.collection(db,'vm_daylog'),fs.orderBy(fs.documentId(),'desc'),fs.limit(45))); q.docs.forEach(d=>out.push(d.id)); }catch(e){}
  if(!out.includes(bizToday())) out.unshift(bizToday());
  DAYS=out;
  sel.innerHTML=out.map(d=>`<option value="${d}"${d===DAY?' selected':''}>${d===bizToday()?'Today · ':''}${d}</option>`).join('');
  sel.onchange=()=>{ DAY=sel.value; CMP=null; WEEK=null; watchDay(); };
}

async function go(){
  let ctx; try{ ctx=await HayatAuth.start(); }catch(e){ $('main').innerHTML='<div class="note">'+esc(e.message||e)+'</div>'; return; }
  FB=ctx;
  if(ctx.role!=='office'){ $('main').innerHTML=''; await HayatAuth.form($('main'),ctx,['office'],go,'The owner board is for the office sign-in.'); return; }
  ctx.fs.onSnapshot(ctx.fs.doc(ctx.db,'vm_meta','floor'),d=>{ FLOOR=d.exists()?d.data():null; render(); },()=>{});
  await days(); watchDay();
  setInterval(()=>{ if(DOC){ stamp(); render(); } },60000);
}
go();
})();
</script>
