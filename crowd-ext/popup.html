<!doctype html><html><head><meta charset="utf-8"><title>Hayat Crowd</title>
<style>
  body{font:13px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;margin:0;width:420px;color:#1B1A17;background:#F5F0E4}
  h1{font:600 20px Georgia,serif;margin:0;padding:14px 16px 6px}
  .sub{padding:0 16px 10px;color:#6F6758;font-size:12px}
  table{width:100%;border-collapse:collapse;background:#FBF8F1}
  th,td{padding:7px 10px;border-bottom:1px solid rgba(27,26,23,.12);text-align:left;font-size:12.5px}
  th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#7E6535}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  .busier{color:#B3462B;font-weight:700}.quieter{color:#4F7A2C;font-weight:700}.usual{color:#6F6758}
  tr.us td{background:rgba(184,151,90,.14)}
  .bar{display:flex;gap:8px;padding:12px 16px;align-items:center;flex-wrap:wrap}
  button{font:inherit;border:0;border-radius:999px;padding:9px 16px;background:#1B1A17;color:#F5F0E4;cursor:pointer}
  button.ghost{background:transparent;border:1px solid #1B1A17;color:#1B1A17}
  input{font:inherit;padding:7px 9px;border:1px solid rgba(27,26,23,.26);border-radius:8px;background:#FBF8F1}
  label{display:block;font-size:11px;color:#6F6758;margin-top:8px}
  .set{padding:0 16px 12px}
  textarea{width:100%;box-sizing:border-box;height:120px;font:12px ui-monospace,monospace;border:1px solid rgba(27,26,23,.26);border-radius:8px;padding:8px;background:#FBF8F1}
  pre{margin:0;padding:10px 16px 14px;font:11px ui-monospace,monospace;color:#6F6758;white-space:pre-wrap;max-height:160px;overflow:auto}
  .head{display:flex;align-items:baseline;justify-content:space-between;padding-right:16px}
  .stamp{font-size:11px;color:#6F6758}
</style></head><body>
<div class="head"><h1>Hayat Crowd</h1><span class="stamp" id="stamp"></span></div>
<div class="sub" id="summary">No reading yet.</div>
<table><thead><tr><th>Place</th><th class="n">Now</th><th class="n">Usual</th><th class="n">±</th><th>Google says</th></tr></thead><tbody id="rows"></tbody></table>
<div class="bar">
  <button id="go">Read now</button>
  <button class="ghost" id="cfg">Settings</button>
  <span class="stamp" id="busy"></span>
</div>
<div class="set" id="settings" hidden>
  <label>Firebase project</label><input id="project">
  <label>Robot word (must match firestore.rules)</label><input id="robot">
  <label>Read every (minutes, min 10)</label><input id="every" type="number" min="10">
  <label>Places — one per line:  key | name | place_id   (add "| us" for our own)</label>
  <textarea id="places"></textarea>
  <div class="bar" style="padding:10px 0 0"><button id="saveBtn">Save</button></div>
</div>
<pre id="log"></pre>
<script src="popup.js"></script>
</body></html>
