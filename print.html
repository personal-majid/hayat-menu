<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hayat · print</title>
<script src="config.js"></script>
<script src="assets/qr.js"></script>
<style>
  /* 80 mm thermal roll. 58 mm rolls: add ?w=58 to the address. */
  :root{ --w:72mm; --ink:#000 }
  @page{ size: 80mm auto; margin: 4mm }
  html,body{ margin:0; background:#fff; color:var(--ink) }
  body{ font: 12.5px/1.35 "Segoe UI", Roboto, "Noto Sans Malayalam", Arial, sans-serif; width:var(--w); margin:0 auto; padding:4mm 0 }
  body.w58{ --w:50mm; font-size:11.5px }
  @media screen{ body{ background:#e9e6df; padding:16px } .sheet{ background:#fff; padding:6mm 4mm; box-shadow:0 2px 10px rgba(0,0,0,.15); margin:0 auto 14px } }
  @media print{ .sheet{ page-break-after: always } .sheet:last-child{ page-break-after:auto } .screen{ display:none } }
  .brand{ text-align:center; margin:0 0 6px }
  .brand img{ height:34px; display:block; margin:0 auto 4px; filter:brightness(0) }
  .brand b{ display:block; font:700 20px Georgia,"Times New Roman",serif; letter-spacing:.06em }
  .brand small{ display:block; font-size:10px; letter-spacing:.14em; text-transform:uppercase }
  .brand .addr{ letter-spacing:0; text-transform:none; font-size:10px; margin-top:3px }
  hr{ border:0; border-top:1px dashed #000; margin:6px 0 }
  .row{ display:flex; justify-content:space-between; gap:8px }
  .row.h{ font-weight:700 }
  .big{ font-size:22px; font-weight:800; letter-spacing:.04em; text-align:center; margin:2px 0 }
  .kot .station{ font-size:26px; font-weight:900; text-align:center; border:2px solid #000; padding:4px 0; margin:4px 0 6px; letter-spacing:.08em }
  .kot .it{ display:flex; gap:10px; font-size:19px; font-weight:800; padding:4px 0; border-bottom:1px dotted #000 }
  .kot .it .q{ min-width:34px; text-align:right }
  .kot .it small{ display:block; font-size:12px; font-weight:600; opacity:.85 }
  .kot .meta{ font-size:12px; margin:2px 0 }
  .kot .note{ font-size:14px; font-weight:800; border:1px solid #000; padding:5px 7px; margin-top:8px }
  .bill .it{ display:flex; gap:6px; padding:3px 0 }
  .bill .it .n{ flex:1 } .bill .it .q{ min-width:26px } .bill .it .a{ min-width:56px; text-align:right; font-variant-numeric:tabular-nums }
  .bill .it small{ display:block; font-size:10.5px; opacity:.8 }
  .bill .tot{ display:flex; justify-content:space-between; font-size:18px; font-weight:900; margin-top:4px }
  .bill .sub{ display:flex; justify-content:space-between; font-size:12px }
  .qr{ text-align:center; margin-top:8px } .qr img{ width:34mm; height:34mm } .qr small{ display:block; font-size:10px }
  .band{ background:#000; color:#fff; text-align:center; font-size:17px; font-weight:900; letter-spacing:.04em; padding:5px 0; margin:6px 0 4px }
  .foot{ text-align:center; font-size:10.5px; margin-top:6px }
  .screen{ text-align:center; margin:0 auto 14px; width:var(--w) }
  .screen button{ font:inherit; padding:10px 18px; border:0; border-radius:999px; background:#1B1A17; color:#fff; cursor:pointer }
  .screen small{ display:block; margin-top:6px; color:#555 }
</style>
</head>
<body>
<div class="screen"><button onclick="window.print()">Print</button><small id="hint"></small></div>
<div id="out"></div>
<script>
(function(){
  var C = window.CONFIG || window.HAYAT || {};
  var q = new URLSearchParams(location.search);
  if(q.get("w") === "58") document.body.className = "w58";
  var job = null;
  try{ job = JSON.parse(localStorage.getItem("hayat_print") || "null"); }catch(e){}
  var out = document.getElementById("out"), hint = document.getElementById("hint");
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); }
  function rupee(n){ return "₹" + Math.round(+n || 0).toLocaleString("en-IN"); }
  function when(ts){ var d = new Date(ts || Date.now()); return d.toLocaleDateString("en-IN", { day:"2-digit", month:"short" }) + " " + d.toLocaleTimeString("en-IN", { hour:"2-digit", minute:"2-digit" }); }
  if(!job || !job.order){ out.innerHTML = '<p style="text-align:center">Nothing to print. Open an order in the office and choose Print.</p>'; return; }
  var o = job.order, kind = job.kind || "kot";
  var brand = '<div class="brand"><img src="assets/mark.png" alt=""><b>HAYAT</b><small>Fish &amp; Mandi Restaurant</small>' +
    '<small class="addr">' + esc(C.address || "Makkaraparamba") + (C.whatsapp ? " · " + esc(String(C.whatsapp).replace(/^91/, "")) : "") + '</small></div>';
  var sheets = [];
  if(kind === "kot"){
    (job.tickets || []).forEach(function(t){
      sheets.push('<div class="sheet kot">' +
        '<div class="station">KOT · ' + esc(t.station.toUpperCase()) + '</div>' +
        '<div class="big">' + esc(o.id) + '</div>' +
        '<div class="row meta"><span>' + esc(o.kind === "ticket" ? "PHONE" : "DELIVERY") + '</span><span>' + esc(when(job.at)) + '</span></div>' +
        '<div class="row meta"><span>' + esc(o.name || "") + '</span><span>' + esc(o.rider ? "Rider: " + o.rider : "") + '</span></div>' +
        (o.wantAt ? '<div class="row meta"><span>FOR</span><span>' + esc(when(o.wantAt)) + '</span></div>' : '') +
        '<hr>' +
        t.lines.map(function(l){ return '<div class="it"><span class="q">' + l.q + ' ×</span><span>' + esc(l.name) + (l.label ? '<small>' + esc(l.label) + '</small>' : '') + '</span></div>'; }).join("") +
        (o.note ? '<div class="note">' + esc(o.note) + '</div>' : '') +
        '<div class="foot">' + (job.tickets.length > 1 ? esc("Ticket " + (job.tickets.indexOf(t) + 1) + " of " + job.tickets.length + " · ") : "") + esc(t.lines.reduce(function(n,l){ return n + l.q; }, 0) + " items") + '</div>' +
      '</div>');
    });
  } else {
    var m = job.money || {};
    var qr = "";                       /* no code on the bill; Majid's call */
    sheets.push('<div class="sheet bill">' + brand +
      '<div class="row h"><span>Bill · ' + esc(o.id) + '</span><span>' + esc(when(job.at)) + '</span></div>' +
      '<div class="row"><span>' + esc(o.name || "") + '</span><span>' + esc(o.phone || "") + '</span></div>' +
      (o.addr ? '<div style="font-size:11px">' + esc(o.addr) + '</div>' : '') +
      '<hr>' +
      (o.lines || []).map(function(l){ return '<div class="it"><span class="q">' + l.q + '×</span><span class="n">' + esc(l.name) + (l.label ? '<small>' + esc(l.label) + '</small>' : '') + '</span><span class="a">' + rupee(l.q * l.price) + '</span></div>'; }).join("") +
      '<hr>' +
      (m.off ? '<div class="sub"><span>Subtotal</span><span>' + rupee(m.sub) + '</span></div><div class="sub"><span>' + esc(job.offLabel || "Discount") + '</span><span>− ' + rupee(m.off) + '</span></div>' : '') +
      '<div class="tot"><span>TOTAL</span><span>' + rupee(m.total != null ? m.total : o.total) + '</span></div>' +
      (o.paid
        ? '<div class="band">PAID · ' + esc(o.payMode === "upi" ? "UPI" : "Cash") + '</div>'
        : '<div class="band">TO PAY ' + rupee(m.total != null ? m.total : o.total) + '</div><div class="sub"><span>Cash or UPI to the rider</span><span>' + esc(o.rider ? "Rider " + o.rider : "") + '</span></div>') +
      qr +
      '<div class="foot">Thank you · ' + esc(job.site || "") + '</div>' +
    '</div>');
  }
  out.innerHTML = sheets.join("");
  hint.textContent = sheets.length + (sheets.length === 1 ? " page" : " pages") + " · 80 mm roll";
  if(job.auto){ setTimeout(function(){ window.print(); }, 300); }
})();
</script>
</body>
</html>
