; Hayat VMENU sync - copy this file to config.ini and fill in the blanks.
; config.ini stays on the shop PC. It is never uploaded to GitHub.

[vmenu]
; the VMENU database on this PC (MariaDB)
host = 127.0.0.1
port = 3306
database = vmenu
; the READ-ONLY login made with setup_readonly_user.sql
user = hayat_sync
password =
timezone = Asia/Kolkata
; bills settled before 5 am count for the previous day
day_start_hour = 5

[firebase]
; the service-account key downloaded from Firebase (see README step 2)
key_file = firebase-key.json
project_id = h-menu

[sync]
; Task Scheduler runs every 2 minutes; this is used by "loop" and shown in the heartbeat
interval_seconds = 120
; the first run sends everything settled since this date
first_sync_since = 2026-07-01
; delete bills older than this many months from Firebase (0 = keep forever).
; day summaries are always kept. 1 GiB free lasts 15+ years at our volume.
retention_months = 0
; kitchen screens: the always-on local page also sends open orders this often (seconds, 0 = off)
open_fast_seconds = 20

[serve]
; the local page: phones on the shop Wi-Fi open http://<this-pc-ip>:8765
port = 8765
; PIN asked by the page (set one; the page shows bills and staff names)
pin =

[push]
; phone reminders for the cleaning app (Firebase Cloud Messaging, free). 0 = off
enabled = 1
; where the site is served; reminder taps open <site_url>clean.html
site_url = https://personal-majid.github.io/hayat-menu/
; morning summary to each person with the app, and who hears about late tasks
morning = 10:15
escalate_to = office,captain
